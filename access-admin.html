<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Access Admin | MGC Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body>
<main class="wrap" id="app"></main>
<script src="mgc-workspace-core.js"></script>
<script>
(function () {
  const W = MGCW, S = () => W.S, esc = W.esc, app = document.getElementById('app');
  const me = W.me();
  let tab = 'requests';

  if (!me || me.role !== 'owner') {
    app.innerHTML = '<div class="card lock"><span class="chip warn">🔒 Zero-Trust Owner Authorization Enforced</span><h1 style="margin-top:10px">Owner authentication required</h1><p>This administrative control center is restricted to the authenticated platform owner.</p><div style="margin-top:14px"><a class="btn pri" href="login.html?next=access-admin.html">Sign In as Owner →</a></div></div>';
    W.header('access-admin.html'); return;
  }
  const members = () => Object.values(S().users).filter(x => x.role !== 'owner');
  const name = (id) => (S().users[id] || {}).name || id;

  function kpis() {
    const m = members(); const c = (s) => m.filter(x => x.status === s).length;
    const open = S().tasks.filter(t => !t.done).length;
    return '<div class="grid" style="margin-bottom:12px">' + [['Pending approval', c('requested')], ['Building pages', c('approved_building')], ['Open build tasks', open], ['Active members', c('active')], ['MRR (base)', '$' + (m.filter(x => x.plan.base).length * 5)]].map(k => '<div class="card"><p>' + k[0] + '</p><h1>' + k[1] + '</h1></div>').join('') + '</div>';
  }

  function requests() {
    const list = members().filter(x => x.status === 'requested');
    if (!list.length) return '<div class="card"><p>No pending requests. 🎉</p></div>';
    return list.map(x => '<div class="card" style="margin-bottom:10px"><div class="row"><div><h2>' + esc(x.name) + ' · ' + esc(x.email) + '</h2><p>' + (x.brand === 'FIX' ? 'F.I.X Solutions' : 'MGC') + ' quote · interest: <b>' + esc((W.TAILOR[x.quote.interest] || {}).label) + '</b></p></div><div class="nav"><button class="btn pri" data-ap="' + x.id + '">Approve → create pages</button><button class="btn" data-dn="' + x.id + '">Deny</button></div></div>' +
      '<details><summary>Pages that will be created</summary><p>' + ['home', 'agile', 'resources'].concat((W.TAILOR[x.quote.interest] || { pages: [] }).pages).map(p => W.CATALOG.find(c => c.id === p).title).join(' · ') + '</p></details></div>').join('');
  }

  function tasks() {
    const t = S().tasks;
    if (!t.length) return '<div class="card"><p>No build tasks. Approve a request to generate the page-creation workflow.</p></div>';
    const by = {}; t.forEach(x => (by[x.uid] = by[x.uid] || []).push(x));
    return Object.keys(by).map(id => { const done = by[id].filter(x => x.done).length;
      return '<div class="card" style="margin-bottom:10px"><div class="row"><h2>' + esc(name(id)) + '</h2><span class="chip ' + (done === by[id].length ? 'ok' : 'warn') + '">' + done + '/' + by[id].length + ' built</span></div>' +
        by[id].map(x => '<label class="row" style="justify-content:flex-start;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer"><input type="checkbox" data-task="' + x.id + '"' + (x.done ? ' checked' : '') + '><span>' + esc(x.title) + '</span></label>').join('') +
        '<p>When the last box is checked the member is notified: <i>"Access approved — your pages are ready."</i></p></div>'; }).join('');
  }

  function users() {
    const cols = W.CATALOG;
    const apps = W.APPS_CATALOG || [];
    return '<div class="card" style="overflow:auto"><table><thead><tr><th>User</th><th>Status</th><th>Tier</th><th>Apps</th><th>Plan</th>' + cols.map(c => '<th title="' + esc(c.title) + '">' + c.icon + '</th>').join('') + '</tr></thead><tbody>' +
      members().map(x => {
        const appCnt = apps.filter(a => W.can(x, 'app', a.id, 'view')).length;
        return '<tr><td>' + esc(x.name) + '</td><td><span class="chip">' + esc(W.STATUS_LABEL[x.status]) + '</span></td><td><span class="chip warn">' + esc(x.accessTier || 'CUSTOMER_RESTRICTED') + '</span></td><td><b>' + appCnt + '/' + apps.length + '</b></td><td>' + (x.plan.base ? '$5' : '—') + (x.plan.addons.length ? ' +' + x.plan.addons.length : '') + '</td>' +
        cols.map(c => { const s = x.pages[c.id]; return '<td>' + (s === 'ready' ? '✅' : s === 'pending' ? '⏳' : '·') + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table><p>✅ ready · ⏳ being built · · not granted. Customers default to <b>CUSTOMER_RESTRICTED (2/8 apps unlocked)</b>; grant additional apps in the Sharing tab.</p></div>';
  }

  function sharing() {
    const elements = [['kpi-strip', 'Element: KPI strip (read-only)'], ['radar-feed', 'Element: Contract feed (read-only)'], ['roadmap', 'Element: Roadmap view']];
    const projects = Object.values(S().projects);
    const apps = W.APPS_CATALOG || [];
    const sh = S().shares;
    return '<div class="card"><h2>Share an App, Project, Page or Single Element</h2><p>Customer logins default to <b>Restricted App Access</b> (only Client Turnkey Forge &amp; Sterling Auto Repair unlocked). Granting an App or Project here unlocks only that specific resource for that customer.</p>' +
      '<div class="row" style="justify-content:flex-start"><select id="shUser">' + members().map(x => '<option value="' + x.id + '">' + esc(x.name) + ' (' + esc(x.email) + ')</option>').join('') + '</select>' +
      '<select id="shRes">' +
      apps.map(a => '<option value="app|' + a.id + '">App: ' + a.icon + ' ' + esc(a.title) + (a.defaultCustomer ? ' (Default Unlocked)' : ' (Restricted SCORM)') + '</option>').join('') +
      projects.map(p => '<option value="project|' + p.id + '">Project: ' + esc(p.name) + '</option>').join('') +
      elements.map(e => '<option value="element|' + e[0] + '">' + e[1] + '</option>').join('') + '</select>' +
      '<select id="shPerm"><option value="view">view / launch</option><option value="view,edit">view + edit (projects)</option></select><button class="btn pri" id="shGo">Grant Access</button></div></div>' +
      '<div class="card" style="margin-top:10px"><h2>Active shares &amp; app entitlements (' + sh.length + ')</h2>' + (sh.length ? sh.map(s => '<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>' + esc(s.type) + ' · <b>' + esc(s.resource) + '</b> → <b>' + esc(name(s.grantee)) + '</b> <span class="chip">' + esc(s.perms.join('+')) + '</span></span><button class="btn" data-rv="' + esc(s.id) + '">Revoke</button></div>').join('') : '<p>No shares yet.</p>') + '</div>';
  }

  function notifs() {
    const l = S().notifications.slice(0, 40);
    return '<div class="card"><h2>Notification outbox</h2><p>Prototype: shown here. Production: Cloud Function sends email/push on each event.</p>' + l.map(n => '<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><span><b>' + esc(name(n.toUid)) + '</b> · ' + esc(n.title) + '<br><span style="color:var(--mut);font-size:12px">' + esc(n.body) + '</span></span><span class="chip">' + esc(n.channel) + '</span></div>').join('') + '</div>';
  }
  function audit() {
    return '<div class="card"><h2>Audit log</h2><table><tbody>' + S().audit.slice(0, 60).map(a => '<tr><td>' + new Date(a.ts).toLocaleString() + '</td><td>' + esc(name(a.actor)) + '</td><td><span class="chip">' + esc(a.action) + '</span></td><td>' + esc(a.detail) + '</td></tr>').join('') + '</tbody></table>' + (S().audit.length ? '' : '<p>Empty.</p>') + '</div>';
  }

  const TABS = [['requests', 'Requests', requests], ['tasks', 'Build workflow', tasks], ['users', 'Users & entitlements', users], ['sharing', 'Sharing', sharing], ['notifs', 'Notifications', notifs], ['audit', 'Audit log', audit]];
  function render() {
    const nav = '<div class="row" style="margin:12px 0"><div class="nav">' + TABS.map(t => '<button class="btn' + (t[0] === tab ? ' pri' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>').join('') + '</div><select id="tabSel">' + TABS.map(t => '<option value="' + t[0] + '"' + (t[0] === tab ? ' selected' : '') + '>' + t[1] + '</option>').join('') + '</select></div>';
    app.innerHTML = '<h1>Access Admin</h1><p>Approve people, build their pages, share only what you choose.</p>' + kpis() + nav + TABS.find(t => t[0] === tab)[2]();
    W.header('access-admin.html'); bind();
  }
  function bind() {
    app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
    document.getElementById('tabSel').onchange = (e) => { tab = e.target.value; render(); };
    app.querySelectorAll('[data-ap]').forEach(b => b.onclick = () => { W.approve(b.dataset.ap); W.toast('Approved — build tasks created'); tab = 'tasks'; render(); });
    app.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => { W.deny(b.dataset.dn); render(); });
    app.querySelectorAll('[data-task]').forEach(c => c.onchange = () => { W.completeTask(c.dataset.task, c.checked); render(); });
    app.querySelectorAll('[data-rv]').forEach(b => b.onclick = () => { W.revoke(b.dataset.rv); render(); });
    const go = document.getElementById('shGo'); if (go) go.onclick = () => { const r = document.getElementById('shRes').value.split('|'); let p = document.getElementById('shPerm').value.split(','); if (r[0] === 'element' || r[0] === 'app') p = ['view']; W.share(document.getElementById('shUser').value, r[0], r[1], p); W.toast('Entitlement granted'); render(); };
  }
  render();
})();
</script>

    -webkit-backdrop-filter: blur(20px);
    border-color: rgba(148, 163, 184, 0.34) !important;

    z-index: 5;
  }
  #mgc-fix-bg-image {
    position: fixed;
    inset: -5%;
    z-index: -10 !important;

    background-image: url('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&q=80&w=2500');
    background-size: 118% 118%;
    background-position: 50% 50%;

    mix-blend-mode: normal !important;

  #mgc-fix-skyscraper-overlay {

    pointer-events: none;

  @keyframes waveFlagInjected {
    0%, 100% { transform: skewY(0deg) scaleX(1); }
    35% { transform: skewY(3.5deg) scaleX(0.93); }
    70% { transform: skewY(-2.5deg) scaleX(0.97); }
  }
  #mgc-scorm-floating-dock {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    background: rgba(11, 20, 38, 0.94);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(197, 179, 88, 0.48);
    border-radius: 999px;
    padding: 7px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 11.5px;
    color: #f8fafc;
    max-width: 96vw;
  }
  #mgc-scorm-floating-dock a, #mgc-scorm-floating-dock button, #mgc-scorm-floating-dock select {
    font-size: 11px;
    font-weight: 700;
    border-radius: 999px;
    padding: 4px 10px;
    cursor: pointer;
    text-decoration: none;
  }
</style>
<div id="mgc-fix-bg-image" aria-hidden="true"></div>
<div id="mgc-fix-skyscraper-overlay" aria-hidden="true">
  <div style="position:absolute;top:0;left:0;width:100%;height:65vh;background:linear-gradient(180deg,rgba(249,115,22,0.18),rgba(197,179,88,0.10),transparent);"></div>

    <div style="position:relative;width:3px;height:74px;background:#cbd5e1;margin-bottom:-4px;">

        <svg viewBox="0 0 60 40" style="width:100%;height:100%;border-radius:2px;">
          <rect width="60" height="40" fill="#fff"/>

    <div style="width:45px;height:60px;background:rgba(11,20,38,0.9);border-top:1px solid rgba(197,179,88,0.4);"></div>
    <div style="width:110px;height:100px;background:rgba(11,20,38,0.92);border-top:1px solid rgba(197,179,88,0.4);"></div>
    <div style="width:180px;flex:1;background:rgba(11,20,38,0.95);border-top:1px solid rgba(197,179,88,0.5);"></div>
  </div>
</div>
<div id="mgc-scorm-floating-dock">
  <span style="color:#fbbf24;font-weight:800;">● SCORM 2004 4th Ed.</span>
  <span style="color:#94a3b8;" id="mgc-dock-label">Access Admin • F.I.X. Cityscape</span>
  <select onchange="window.switchInjectedCityscape(this.value)" style="background:#0B1426;color:#fbbf24;border:1px solid rgba(197,179,88,0.5);">
    <option value="fix-cityscape">🎨 Switch Cityscape / Filter ▾</option>
    <option value="fix-cityscape">🏙️ F.I.X. Cityscape (Mission Navy &amp; Gold)</option>
    <option value="mgc-cityscape">🇺🇸 miltongroupsecurity.org Cityscape (Flag + Sunset)</option>
    <option value="noir-greyscale">🎬 Tactical Noir 100% Greyscale</option>
    <option value="emerald-matrix">🌱 Tactical Emerald Luminosity</option>
  </select>
  <a href="saas-apps-and-lms-showcase.html" style="background:linear-gradient(135deg,#C5B358,#a38f36);color:#060B16;">🚀 Multi-Page SCORM OS</a>
  <a href="projects/samgov-contract-matchmaker/exports/samgov_scorm_2004_4th_edition.zip" download style="background:rgba(16,185,129,0.2);color:#34d399;border:1px solid rgba(16,185,129,0.45);">📦 SCORM .ZIP</a>
  <button onclick="window.commitInjectedScorm()" style="background:rgba(30,41,59,0.9);color:#e2e8f0;border:1px solid rgba(197,179,88,0.35);">Complete SCO ✓</button>
</div>
<script src="projects/spanish-acquisition-os/src/modules/scorm_adapter.js"></script>
<script>
  window.switchInjectedCityscape = function(mode) {
    var bg = document.getElementById('mgc-fix-bg-image');
    var sky = document.getElementById('mgc-fix-skyscraper-overlay');
    if (!bg || !sky) return;
    if (mode === 'mgc-cityscape') {
      sky.style.opacity = '1';
      bg.style.filter = 'contrast(122%) brightness(65%) saturate(130%)';
    } else if (mode === 'noir-greyscale') {
      sky.style.opacity = '0';
      bg.style.filter = 'grayscale(100%) contrast(138%) brightness(52%)';
    } else if (mode === 'emerald-matrix') {
      sky.style.opacity = '1';
      bg.style.filter = 'grayscale(55%) sepia(40%) hue-rotate(115deg) saturate(190%) contrast(122%) brightness(54%)';
    } else {
      sky.style.opacity = '0';
      bg.style.filter = 'grayscale(30%) contrast(118%) brightness(58%) sepia(24%) hue-rotate(185deg)';
    }
    bg.style.backgroundPosition = (30 + Math.floor(Math.random() * 45)) + '% ' + (30 + Math.floor(Math.random() * 45)) + '%';
  };
  window.commitInjectedScorm = function() {
    if (typeof SAOS_SCORM !== 'undefined') {
      SAOS_SCORM.set('cmi.completion_status', 'completed');
      SAOS_SCORM.set('cmi.success_status', 'passed');
      SAOS_SCORM.commit();
    }
    alert('✓ SCORM 2004 4th Edition Completion committed (MGC_ACCESS_ADMIN_SCO)!');
  };
</script>
