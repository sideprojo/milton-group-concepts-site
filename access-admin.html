<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Active Directory &amp; RBAC Console | MGC Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  @keyframes adFadeSlide {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes adInspectorSlide {
    from { opacity: 0; transform: translateX(16px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .ad-console {
    display: grid;
    grid-template-columns: 205px minmax(0, 1fr) 340px;
    gap: 12px;
    align-items: start;
    transition: grid-template-columns .24s cubic-bezier(.16,1,.3,1);
  }
  .ad-console.no-inspector {
    grid-template-columns: 205px minmax(0, 1fr);
  }
  .ad-console.tree-collapsed {
    grid-template-columns: 54px minmax(0, 1fr) 340px;
  }
  .ad-console.tree-collapsed.no-inspector {
    grid-template-columns: 54px minmax(0, 1fr);
  }
  .ad-tree {
    background: rgba(8, 13, 26, 0.96);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    transition: width .22s cubic-bezier(.16,1,.3,1), opacity .2s ease, box-shadow .2s ease;
    overflow: hidden;
  }
  .ad-console.tree-collapsed .ad-tree {
    padding: 10px 6px;
  }
  .ad-console.tree-collapsed .ad-tree:not(:hover) .ad-tree-label,
  .ad-console.tree-collapsed .ad-tree:not(:hover) .ad-tree-count,
  .ad-console.tree-collapsed .ad-tree:not(:hover) .ad-tree-section {
    opacity: 0;
    width: 0;
    height: 0;
    overflow: hidden;
    display: none;
  }
  .ad-console.tree-collapsed .ad-tree:hover {
    width: 235px;
    position: relative;
    z-index: 40;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
  }
  .ad-tree-root {
    font-size: 11.5px;
    font-weight: 600;
    color: #fde047;
    letter-spacing: .01em;
    padding: 6px 8px 10px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ad-tree-section {
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: #64748b;
    padding: 10px 8px 4px;
  }
  .ad-tree-item {
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    color: #cbd5e1;
    padding: 7px 10px;
    border-radius: 7px;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    transition: all .14s;
  }
  .ad-tree-item:hover {
    background: rgba(59, 130, 246, 0.12);
    color: #fff;
  }
  .ad-tree-item.active {
    background: rgba(37, 99, 235, 0.22);
    border-color: rgba(96, 165, 250, 0.45);
    color: #fff;
    font-weight: 600;
  }
  .ad-tree-count {
    font-size: 11px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    padding: 1px 7px;
    border-radius: 6px;
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid rgba(148, 163, 184, 0.22);
    color: #94a3b8;
  }
  .ad-center {
    background: rgba(8, 13, 26, 0.96);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  .ad-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    background: rgba(15, 23, 42, 0.92);
    border-bottom: 1px solid var(--line);
  }
  .ad-table-wrap {
    overflow-x: auto;
  }
  table.ad-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }
  table.ad-table th {
    background: rgba(4, 8, 20, 0.88);
    padding: 9px 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: #94a3b8;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  table.ad-table td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.14);
    vertical-align: middle;
  }
  table.ad-table tbody tr {
    cursor: pointer;
    transition: background .12s;
  }
  table.ad-table tbody tr:hover {
    background: rgba(59, 130, 246, 0.1);
  }
  table.ad-table tbody tr.selected {
    background: rgba(37, 99, 235, 0.2);
  }
  .ad-inspector {
    background: rgba(8, 13, 26, 0.97);
    border: 1px solid rgba(197, 179, 88, 0.42);
    border-radius: 12px;
    overflow: hidden;
    position: sticky;
    top: 12px;
  }
  .ad-inspector-hdr {
    padding: 12px 14px;
    background: rgba(15, 23, 42, 0.95);
    border-bottom: 1px solid var(--line);
  }
  .ad-prop-tabs {
    display: flex;
    border-bottom: 1px solid var(--line);
    background: rgba(4, 8, 20, 0.9);
  }
  .ad-prop-tab {
    flex: 1;
    text-align: center;
    padding: 8px 6px;
    font-size: 11.5px;
    font-weight: 600;
    color: #94a3b8;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
  }
  .ad-prop-tab.active {
    color: #fde047;
    border-bottom-color: #fde047;
    background: rgba(197, 179, 88, 0.08);
  }
  .ad-prop-body {
    padding: 12px 14px;
    max-height: 74vh;
    overflow-y: auto;
  }
  .ad-check-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid rgba(148, 163, 184, 0.16);
    margin-bottom: 5px;
    background: rgba(4, 8, 20, 0.65);
    font-size: 11.5px;
  }
  .ad-check-row.granted {
    border-color: rgba(16, 185, 129, 0.48);
    background: rgba(16, 185, 129, 0.11);
  }
  @media (max-width: 1160px) {
    .ad-console {
      grid-template-columns: 210px minmax(0, 1fr);
    }
    .ad-inspector {
      grid-column: 1 / -1;
      position: static;
    }
  }
  @media (max-width: 780px) {
    .ad-console, .ad-console.no-inspector {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script src="mgc-workspace-core.js"></script>
<script>
(function () {
  const W = MGCW, S = () => W.S, esc = W.esc, app = document.getElementById('app');
  const me = W.me();
  let tab = 'users';
  let ouFilter = 'all'; // 'all' | 'internal' | 'external'
  let searchQuery = '';
  let selectedUserId = '';
  let propTab = 'rbac'; // 'rbac' | 'apps' | 'account' | 'billing'
  let showNewUserDrawer = false;
  let treeCollapsed = false;
  let inspectorHidden = false;

  if (!me || me.role !== 'owner' || me.id !== 'owner' || String(me.email || '').toLowerCase() !== 'malik.khabir@miltongroupsecurity.org') {
    app.innerHTML = '<div class="card lock"><span class="chip warn">Active Directory Domain Controller</span><h1 style="margin-top:10px">Administrator authentication required</h1><p>This Active Directory &amp; RBAC console is restricted to the Domain Administrator account.</p><div style="margin-top:14px"><a class="btn pri" href="login.html?next=access-admin.html">Sign In</a></div></div>';
    W.header('access-admin.html');
    return;
  }

  const members = () => Object.values(S().users).filter(x => x.role !== 'owner');
  const name = (id) => (S().users[id] || {}).name || id;
  const getUserOu = (u) => u.ou === 'internal' ? 'internal' : 'external';
  const getUserGroup = (u) => u.securityGroup || (getUserOu(u) === 'internal' ? 'INTERNAL_ANALYST' : 'EXTERNAL_SAAS_LMS');

  const SECURITY_GROUPS = [
    { id: 'EXTERNAL_SAAS_LMS',     ou: 'external', label: 'External · SaaS & LMS Subscribers (Default)', desc: 'Scoped strictly to SaaS Apps & LMS (2/8 default apps) + PCI Payment Submission.' },
    { id: 'EXTERNAL_FULL_CLIENT',  ou: 'external', label: 'External · Turnkey Enterprise Client',        desc: 'SaaS Apps & LMS + Agile Board + Curated Resources + SCORM Academy + Invoicing.' },
    { id: 'INTERNAL_ANALYST',      ou: 'internal', label: 'Internal · Operations & Cyber Analyst',       desc: 'Internal staff access to Agile Board, Contract Radar, Compliance, Academy & Apps.' },
    { id: 'INTERNAL_OPERATIONS',   ou: 'internal', label: 'Internal · Full Operations Officer',          desc: 'All 10 Workspace Views & all 8 SCORM / SaaS Applications (Non-Admin).' }
  ];

  function ensureSelectedUser(list) {
    if (selectedUserId && S().users[selectedUserId] && S().users[selectedUserId].role !== 'owner') {
      return S().users[selectedUserId];
    }
    const first = (list && list[0]) || members()[0] || null;
    selectedUserId = first ? first.id : '';
    return first;
  }

  function renderNewUserModal() {
    if (!showNewUserDrawer) return '';
    return '<div style="padding:12px 16px;background:rgba(4,8,20,0.92);border-bottom:1px solid rgba(197,179,88,0.4)">' +
      '<div class="row" style="margin-bottom:8px"><strong>New Active Directory User Object</strong><button type="button" class="btn" id="btnCloseNewUser" style="padding:4px 10px;font-size:11.5px">Close</button></div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;align-items:center">' +
        '<input id="admRegName" placeholder="Display Name" style="padding:7px 10px;font-size:12px">' +
        '<input id="admRegEmail" placeholder="Logon Email (UPN)" style="padding:7px 10px;font-size:12px">' +
        '<input id="admRegPass" type="password" placeholder="Password" style="padding:7px 10px;font-size:12px">' +
        '<input id="admRegOrg" placeholder="Organization / Dept" style="padding:7px 10px;font-size:12px">' +
        '<select id="admRegOu" style="padding:7px 10px;font-size:12px"><option value="external">OU=External (Client)</option><option value="internal">OU=Internal (Staff)</option></select>' +
        '<select id="admRegProvider" style="padding:7px 10px;font-size:12px"><option value="password">Password + UPN</option><option value="google">Google OIDC</option><option value="microsoft">Microsoft Entra</option><option value="apple">Apple OIDC</option></select>' +
        '<select id="admRegInterest" style="padding:7px 10px;font-size:12px"><option value="ai-web">Turnkey SaaS</option><option value="federal">Federal SDVOSB</option><option value="cyber">Zero-Trust Cyber</option><option value="training">SCORM Academy</option></select>' +
        '<button class="btn pri" id="admRegGo" type="button" style="padding:7px 12px;font-size:12px;justify-content:center">Create Object</button>' +
      '</div>' +
    '</div>';
  }

  function renderUsersDirectoryView() {
    const cols = W.CATALOG;
    const apps = W.APPS_CATALOG || [];
    const allM = members();
    const filtered = allM.filter(u => {
      if (ouFilter !== 'all' && getUserOu(u) !== ouFilter) return false;
      if (!searchQuery) return true;
      const q = searchQuery.toLowerCase();
      return String(u.name || '').toLowerCase().includes(q) ||
             String(u.email || '').toLowerCase().includes(q) ||
             String(u.username || '').toLowerCase().includes(q) ||
             String(u.org || '').toLowerCase().includes(q);
    });
    const sel = ensureSelectedUser(filtered);

    return '<div class="ad-center">' +
      '<div class="ad-toolbar">' +
        '<div style="display:flex;align-items:center;gap:10px;flex:1;min-width:220px">' +
          '<span style="font-size:13px;font-weight:600;color:#fff">' +
            (ouFilter === 'internal' ? 'OU=Internal Users' : ouFilter === 'external' ? 'OU=External Users' : 'All Directory Users') +
            ' (' + filtered.length + ')' +
          '</span>' +
          '<input id="adSearchInput" type="search" value="' + esc(searchQuery) + '" placeholder="Filter by name, UPN/email, username, or org" style="flex:1;max-width:290px;padding:7px 11px;font-size:12.5px">' +
        '</div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
          '<button type="button" class="btn pri" id="btnToggleNewUser" style="padding:6px 11px;font-size:12px">New User</button>' +
          (sel ? '<button type="button" class="btn" data-preset="' + esc(sel.id) + '|grant_all_features" style="padding:6px 11px;font-size:12px">Grant All</button>' : '') +
          (sel ? '<button type="button" class="btn" data-preset="' + esc(sel.id) + '|reset_saas_only" style="padding:6px 11px;font-size:12px">SaaS &amp; LMS Only</button>' : '') +
        '</div>' +
      '</div>' +
      renderNewUserModal() +
      '<div class="ad-table-wrap">' +
        '<table class="ad-table">' +
          '<thead><tr>' +
            '<th>Object Name</th>' +
            '<th>Logon Name (UPN)</th>' +
            '<th>Scope</th>' +
            '<th>Views</th>' +
            '<th>Apps</th>' +
            '<th>Billing</th>' +
          '</tr></thead>' +
          '<tbody>' +
            (filtered.length ? filtered.map(x => {
              const isSel = sel && sel.id === x.id;
              const ou = getUserOu(x);
              const grp = getUserGroup(x);
              const pay = x.paymentProfile;
              const grantedPages = cols.filter(c => W.can(x, 'page', c.id, 'view')).length;
              const grantedApps = apps.filter(a => W.can(x, 'app', a.id, 'view')).length;
              return '<tr class="' + (isSel ? 'selected' : '') + '" data-select-user="' + esc(x.id) + '" data-user-card="' + esc(x.id) + '">' +
                '<td>' +
                  '<div style="font-weight:600;color:#fff">' + esc(x.name) + '</div>' +
                  '<div style="font-size:11px;color:#94a3b8">' + esc(x.org || 'External Partner') + '</div>' +
                '</td>' +
                '<td>' +
                  '<div style="font-family:\'JetBrains Mono\',monospace;font-size:11.5px;color:#e2e8f0">' + esc(x.email) + '</div>' +
                  '<div style="font-size:10.5px;color:#64748b">SAM: ' + esc(x.username || x.email.split('@')[0]) + '</div>' +
                '</td>' +
                '<td>' +
                  '<span class="chip ' + (ou === 'internal' ? 'ok' : '') + '">' + (ou === 'internal' ? 'Internal' : 'External') + '</span>' +
                  '<div style="font-size:10px;color:#64748b;margin-top:3px">' + esc(grp) + '</div>' +
                '</td>' +
                '<td><span class="chip ' + (grantedPages > 1 ? 'ok' : '') + '">' + grantedPages + '/' + cols.length + '</span></td>' +
                '<td><span class="chip">' + grantedApps + '/' + apps.length + '</span></td>' +
                '<td>' +
                  ((pay && pay.verified)
                    ? '<span class="chip ok" title="' + esc(pay.receiptId) + '">Verified · ' + esc(pay.last4) + '</span>'
                    : '<span class="chip warn">Pending</span>') +
                '</td>' +
              '</tr>';
            }).join('') : '<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--mut)">No directory user objects match the current filter.</td></tr>') +
          '</tbody>' +
        '</table>' +
      '</div>' +
    '</div>';
  }

  function renderObjectInspector() {
    if (inspectorHidden) return '';
    const sel = ensureSelectedUser();
    if (!sel || tab !== 'users') return '';
    const cols = W.CATALOG;
    const apps = W.APPS_CATALOG || [];
    const ou = getUserOu(sel);
    const grp = getUserGroup(sel);
    const pay = sel.paymentProfile;

    let bodyHtml = '';
    if (propTab === 'rbac') {
      bodyHtml =
        '<div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)">' +
          '<label style="display:block;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#94a3b8;margin-bottom:5px">Organizational Unit (OU) &amp; Security Group</label>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px">' +
            '<select id="propUserOu" style="padding:6px 8px;font-size:12px">' +
              '<option value="external"' + (ou === 'external' ? ' selected' : '') + '>OU=External (Client)</option>' +
              '<option value="internal"' + (ou === 'internal' ? ' selected' : '') + '>OU=Internal (Staff)</option>' +
            '</select>' +
            '<select id="propUserGroup" style="padding:6px 8px;font-size:12px">' +
              SECURITY_GROUPS.map(g => '<option value="' + g.id + '"' + (grp === g.id ? ' selected' : '') + '>' + esc(g.id) + '</option>').join('') +
            '</select>' +
          '</div>' +
          '<button type="button" class="btn pri" id="btnApplyGroupPolicy" style="width:100%;justify-content:center;padding:6px 10px;font-size:12px">Apply OU &amp; Group Policy</button>' +
        '</div>' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">' +
          '<span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#cbd5e1">Workspace View Permissions</span>' +
          '<div style="display:flex;gap:4px">' +
            '<button type="button" class="btn pri" data-preset="' + esc(sel.id) + '|grant_all_features" style="padding:3px 8px;font-size:10.5px">All</button>' +
            '<button type="button" class="btn" data-preset="' + esc(sel.id) + '|reset_saas_only" style="padding:3px 8px;font-size:10.5px">SaaS Only</button>' +
          '</div>' +
        '</div>' +
        cols.map(c => {
          const on = W.can(sel, 'page', c.id, 'view');
          const isDef = c.id === 'saasapps';
          return '<div class="ad-check-row ' + (on ? 'granted' : '') + '">' +
            '<span><b>' + esc(c.title) + '</b>' + (isDef ? ' <small style="color:#34d399">(Base)</small>' : '') + '</span>' +
            '<button type="button" class="btn ' + (on ? 'ok' : '') + '" data-toggle-page="' + esc(sel.id) + '|' + esc(c.id) + '|' + (!on) + '" style="padding:4px 9px;font-size:11px">' +
              (on ? 'Granted' : 'Grant') +
            '</button>' +
          '</div>';
        }).join('');
    } else if (propTab === 'apps') {
      bodyHtml =
        '<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#cbd5e1;margin-bottom:6px">Application Entitlements (8)</div>' +
        apps.map(a => {
          const on = W.can(sel, 'app', a.id, 'view');
          return '<div class="ad-check-row ' + (on ? 'granted' : '') + '">' +
            '<span><b>' + esc(a.title) + '</b></span>' +
            '<button type="button" class="btn ' + (on ? 'ok' : '') + '" data-toggle-app="' + esc(sel.id) + '|' + esc(a.id) + '|' + (!on) + '" style="padding:4px 9px;font-size:11px">' +
              (on ? 'Unlocked' : 'Unlock') +
            '</button>' +
          '</div>';
        }).join('');
    } else if (propTab === 'account') {
      bodyHtml =
        '<div style="display:flex;flex-direction:column;gap:8px;font-size:12px">' +
          '<div><small style="color:#94a3b8;display:block">User Principal Name (Case-Insensitive Email)</small><code style="color:#fde047">' + esc(sel.email) + '</code></div>' +
          '<div><small style="color:#94a3b8;display:block;margin-bottom:3px">sAMAccountName (Case-Insensitive Username)</small><input id="propUsername" value="' + esc(sel.username || sel.email.split('@')[0]) + '" style="width:100%;padding:6px 9px;font-size:12px"></div>' +
          '<div><small style="color:#94a3b8;display:block;margin-bottom:3px">Organization / Department</small><input id="propOrg" value="' + esc(sel.org || '') + '" style="width:100%;padding:6px 9px;font-size:12px"></div>' +
          '<div><small style="color:#94a3b8;display:block;margin-bottom:3px">Account Status</small>' +
            '<select id="propStatus" style="width:100%;padding:6px 9px;font-size:12px">' +
              '<option value="active"' + (sel.status === 'active' ? ' selected' : '') + '>Active (Enabled)</option>' +
              '<option value="suspended"' + (sel.status === 'suspended' ? ' selected' : '') + '>Suspended / Locked</option>' +
              '<option value="requested"' + (sel.status === 'requested' ? ' selected' : '') + '>Pending Approval</option>' +
            '</select>' +
          '</div>' +
          '<button type="button" class="btn pri" id="btnSaveAccountProfile" style="justify-content:center;padding:7px 10px">Save Account Attributes</button>' +
          '<div style="border-top:1px solid var(--line);padding-top:8px;margin-top:4px">' +
            '<small style="color:#94a3b8;display:block;margin-bottom:4px">Reset User Password</small>' +
            '<div style="display:flex;gap:6px">' +
              '<input id="propNewPass" type="password" placeholder="New password (min 4 chars)" style="flex:1;padding:6px 9px;font-size:12px">' +
              '<button type="button" class="btn" id="btnResetUserPass" style="padding:6px 10px;font-size:11.5px">Set Password</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    } else if (propTab === 'billing') {
      bodyHtml = (pay && pay.verified)
        ? '<div style="display:flex;flex-direction:column;gap:6px;font-size:12px">' +
            '<span class="chip ok" style="align-self:flex-start">PCI-DSS Tokenized &amp; Verified</span>' +
            '<div><small style="color:#94a3b8">Receipt ID:</small> <b>' + esc(pay.receiptId) + '</b></div>' +
            '<div><small style="color:#94a3b8">Instrument:</small> <b>' + esc(pay.cardBrand || pay.method) + ' · ' + esc(pay.last4) + '</b></div>' +
            '<div><small style="color:#94a3b8">Token:</small> <code style="font-size:11px;color:#38bdf8">' + esc(pay.paymentToken) + '</code></div>' +
            '<div><small style="color:#94a3b8">Verified At:</small> ' + new Date(pay.verifiedAt || Date.now()).toLocaleString() + '</div>' +
          '</div>'
        : '<p style="font-size:12px">No verified payment submission on file for this user yet. User can submit payment via <b>Billing &amp; Payment</b> in their workspace.</p>';
    }

    return '<aside class="ad-inspector">' +
      '<div class="ad-inspector-hdr">' +
        '<div class="row">' +
          '<span class="chip ' + (ou === 'internal' ? 'ok' : '') + '">' + (ou === 'internal' ? 'OU=Internal' : 'OU=External') + '</span>' +
          '<button type="button" class="btn" id="btnHideInspector" title="Auto-hide Object Properties (Esc)" style="padding:3px 9px;font-size:11px">Close</button>' +
        '</div>' +
        '<h3 style="margin:6px 0 2px;font-size:14.5px;font-weight:600;color:#fff">' + esc(sel.name) + '</h3>' +
        '<div style="font-size:11.5px;color:#94a3b8;font-family:\'JetBrains Mono\',monospace">' + esc(sel.email) + '</div>' +
      '</div>' +
      '<div class="ad-prop-tabs">' +
        [['rbac', 'Member Of / RBAC'], ['apps', 'Apps (8)'], ['account', 'Account'], ['billing', 'PCI Billing']].map(t =>
          '<button type="button" class="ad-prop-tab ' + (propTab === t[0] ? 'active' : '') + '" data-prop-tab="' + t[0] + '">' + t[1] + '</button>'
        ).join('') +
      '</div>' +
      '<div class="ad-prop-body">' + bodyHtml + '</div>' +
    '</aside>';
  }

  function renderAdminIdentityView() {
    const ownerObj = (S().users && S().users.owner) || {};
    return '<div class="ad-center" style="padding:18px 20px">' +
      '<div class="row" style="margin-bottom:14px"><h2 style="margin:0;font-size:15px;font-weight:600">malik.khabir@Miltongroupsecurity.org</h2><span class="chip ok">Builtin\\Administrator</span></div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;max-width:640px;margin-bottom:14px">' +
        '<div><label style="display:block;font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:5px">Username (sAMAccountName)</label>' +
          '<input id="admUsernameInput" value="' + esc(ownerObj.username || 'malik.khabir') + '" placeholder="malik.khabir" style="width:100%;padding:8px 11px;font-size:13px">' +
        '</div>' +
        '<div><label style="display:block;font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:5px">New Password (Case-Sensitive)</label>' +
          '<input id="admNewPassInput" type="password" placeholder="Enter new password" style="width:100%;padding:8px 11px;font-size:13px">' +
        '</div>' +
      '</div>' +
      '<button class="btn pri" id="admSavePassBtn" type="button">Save Credentials</button>' +
    '</div>';
  }

  function renderSecurityGroupsView() {
    return '<div class="ad-center" style="padding:18px 20px">' +
      '<h2 style="margin:0 0 12px;font-size:15px;font-weight:600">Security Groups</h2>' +
      '<table class="ad-table"><thead><tr><th>Group CN</th><th>Scope</th><th>Entitlements</th><th>Members</th></tr></thead><tbody>' +
        '<tr style="cursor:default"><td><b>DOMAIN_ADMIN</b></td><td><span class="chip ok">Builtin</span></td><td>All Portals, Directory &amp; PCI Gateway</td><td>1</td></tr>' +
        SECURITY_GROUPS.map(g => {
          const count = members().filter(u => getUserGroup(u) === g.id).length;
          return '<tr style="cursor:default"><td><b>' + esc(g.id) + '</b></td><td><span class="chip">' + (g.ou === 'internal' ? 'OU=Internal' : 'OU=External') + '</span></td><td>' + esc(g.label) + '</td><td><b>' + count + '</b></td></tr>';
        }).join('') +
      '</tbody></table>' +
    '</div>';
  }

  function renderPaymentsAndPciView() {
    const list = S().payments || [];
    const gw = S().pciGatewayConfig || { activeProcessor: 'stripe_saq_a', mgcOption: 'stripe_saq_a', fixOptions: ['stripe_saq_a', 'wawf_piee_eft'], mercuryAchEnabled: true, wawfPieeEnabled: true };
    return '<div class="ad-center" style="padding:18px 20px">' +
      '<div style="margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line)">' +
        '<div class="row" style="margin-bottom:12px">' +
          '<h2 style="margin:0;font-size:15px;font-weight:600">Payment Gateways (MGC &amp; F.I.X)</h2>' +
          '<div style="display:flex;gap:6px"><span class="chip ok">MGC: Option 1 (Stripe)</span><span class="chip ok">FIX: Options 1 &amp; 4 (Stripe + WAWF)</span></div>' +
        '</div>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:12px">' +
          '<div><label style="display:block;font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:5px">Default Rail</label>' +
            '<select id="pciActiveProcessor" style="width:100%;padding:8px 10px;font-size:12.5px">' +
              '<option value="stripe_saq_a"' + (gw.activeProcessor === 'stripe_saq_a' ? ' selected' : '') + '>Option 1: Stripe SAQ-A (MGC &amp; FIX)</option>' +
              '<option value="wawf_piee_eft"' + (gw.activeProcessor === 'wawf_piee_eft' ? ' selected' : '') + '>Option 4: DoD WAWF / PIEE EFT (FIX)</option>' +
              '<option value="mercury_plaid_ach"' + (gw.activeProcessor === 'mercury_plaid_ach' ? ' selected' : '') + '>Option 3: Mercury + Plaid ACH</option>' +
              '<option value="authorizenet_accept_js"' + (gw.activeProcessor === 'authorizenet_accept_js' ? ' selected' : '') + '>Option 2: Authorize.Net Accept.js</option>' +
            '</select>' +
          '</div>' +
          '<div><label style="display:block;font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:5px">MGC Stripe Key</label>' +
            '<input id="pciStripePk" value="' + esc(gw.stripePublishableKey || '') + '" placeholder="pk_live_mgc_..." style="width:100%;padding:8px 10px;font-size:12.5px">' +
          '</div>' +
          '<div><label style="display:block;font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:5px">FIX Key / CAGE</label>' +
            '<input id="pciAuthNetKey" value="' + esc(gw.authorizeNetClientKey || '') + '" placeholder="pk_live_fix_... / CAGE" style="width:100%;padding:8px 10px;font-size:12.5px">' +
          '</div>' +
        '</div>' +
        '<button type="button" class="btn pri" id="btnSavePciGateway" style="padding:8px 16px;font-size:12.5px">Save Gateways</button>' +
      '</div>' +
      '<h2 style="margin:0 0 12px;font-size:15px;font-weight:600">Ledger (' + list.length + ')</h2>' +
      (list.length
        ? '<table class="ad-table"><thead><tr><th>Receipt</th><th>Entity</th><th>Customer</th><th>Plan</th><th>Instrument</th><th>Status</th><th>Date</th></tr></thead><tbody>' +
          list.map(p => '<tr style="cursor:default"><td><span class="chip ok">' + esc(p.receiptId) + '</span></td><td><span class="chip ' + (p.merchantEntity === 'FIX' ? '' : 'ok') + '">' + esc(p.merchantEntity || 'MGC') + '</span></td><td><b>' + esc(p.billingName || name(p.uid)) + '</b></td><td>$' + Number(p.amountUsd || 0).toLocaleString() + '</td><td><b>' + esc(p.cardBrand || p.method) + ' · ' + esc(p.last4) + '</b></td><td><span class="chip ok">Verified</span></td><td style="font-size:11.5px;color:var(--mut)">' + new Date(p.createdAt || Date.now()).toLocaleDateString() + '</td></tr>').join('') +
          '</tbody></table>'
        : '<p style="font-size:12.5px">No payments recorded yet.</p>') +
    '</div>';
  }

  function renderRequestsView() {
    const list = members().filter(x => x.status === 'requested');
    const reqLog = (S().requests || []).slice(0, 20);
    return '<div class="ad-center" style="padding:18px 20px">' +
      '<h2 style="margin:0 0 12px;font-size:15px;font-weight:600">Pending Requests (' + list.length + ')</h2>' +
      (list.length
        ? list.map(x => '<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><div><b>' + esc(x.name) + '</b> (' + esc(x.email) + ')</div><div style="display:flex;gap:6px"><button class="btn pri" data-ap="' + x.id + '">Approve</button><button class="btn" data-dn="' + x.id + '">Deny</button></div></div>').join('')
        : '') +
      (reqLog.length
        ? '<table class="ad-table"><thead><tr><th>Receipt</th><th>Name</th><th>Email</th><th>Status</th></tr></thead><tbody>' +
          reqLog.map(r => '<tr style="cursor:default"><td><span class="chip">' + esc(r.receipt || r.id) + '</span></td><td>' + esc(r.name || name(r.uid)) + '</td><td>' + esc(r.email || '') + '</td><td><span class="chip ok">' + esc(r.status || 'active') + '</span></td></tr>').join('') +
          '</tbody></table>'
        : '<p style="font-size:12.5px">Queue empty.</p>') +
    '</div>';
  }

  function renderAuditView() {
    return '<div class="ad-center" style="padding:18px 20px"><h2 style="margin:0 0 12px;font-size:15px;font-weight:600">Event Log</h2><table class="ad-table"><thead><tr><th>Time</th><th>Actor</th><th>Event</th><th>Detail</th></tr></thead><tbody>' +
      S().audit.slice(0, 50).map(a => '<tr style="cursor:default"><td style="font-size:11.5px;color:var(--mut)">' + new Date(a.ts).toLocaleString() + '</td><td>' + esc(name(a.actor)) + '</td><td><span class="chip">' + esc(a.action) + '</span></td><td>' + esc(a.detail) + '</td></tr>').join('') +
      '</tbody></table></div>';
  }

  function render() {
    const allM = members();
    const intCount = allM.filter(u => getUserOu(u) === 'internal').length;
    const extCount = allM.filter(u => getUserOu(u) === 'external').length;
    const payCount = (S().payments || []).length;

    const treeHtml =
      '<aside class="ad-tree">' +
        '<div class="ad-tree-root" style="justify-content:space-between">' +
          '<span class="ad-tree-label">miltongroupsecurity.org</span>' +
          '<button type="button" class="btn" id="btnToggleTreeCollapse" title="Auto-hide / Pin Directory Tree" style="padding:2px 7px;font-size:10.5px">' + (treeCollapsed ? 'Expand' : 'Hide') + '</button>' +
        '</div>' +
        '<div class="ad-tree-section">Organizational Units</div>' +
        '<button type="button" class="ad-tree-item ' + (tab === 'users' && ouFilter === 'all' ? 'active' : '') + '" data-ou="all" data-tab="users"><span class="ad-tree-label">All Directory Users</span><span class="ad-tree-count">' + allM.length + '</span></button>' +
        '<button type="button" class="ad-tree-item ' + (tab === 'users' && ouFilter === 'internal' ? 'active' : '') + '" data-ou="internal" data-tab="users"><span class="ad-tree-label">OU=Internal (Staff)</span><span class="ad-tree-count">' + intCount + '</span></button>' +
        '<button type="button" class="ad-tree-item ' + (tab === 'users' && ouFilter === 'external' ? 'active' : '') + '" data-ou="external" data-tab="users"><span class="ad-tree-label">OU=External (Clients)</span><span class="ad-tree-count">' + extCount + '</span></button>' +
        '<button type="button" class="ad-tree-item ' + (tab === 'admin_identity' ? 'active' : '') + '" data-tab="admin_identity"><span class="ad-tree-label">Builtin Administrator</span><span class="ad-tree-count">1</span></button>' +
        '<div class="ad-tree-section">RBAC &amp; Policy</div>' +
        '<button type="button" class="ad-tree-item ' + (tab === 'groups' ? 'active' : '') + '" data-tab="groups"><span class="ad-tree-label">Security Groups</span><span class="ad-tree-count">5</span></button>' +
        '<button type="button" class="ad-tree-item ' + (tab === 'payments' ? 'active' : '') + '" data-tab="payments"><span class="ad-tree-label">PCI-DSS &amp; Billing</span><span class="ad-tree-count">' + payCount + '</span></button>' +
        '<button type="button" class="ad-tree-item ' + (tab === 'requests' ? 'active' : '') + '" data-tab="requests"><span class="ad-tree-label">Intake Queue</span><span class="ad-tree-count">' + (S().requests || []).length + '</span></button>' +
        '<button type="button" class="ad-tree-item ' + (tab === 'audit' ? 'active' : '') + '" data-tab="audit"><span class="ad-tree-label">Event Viewer</span><span class="ad-tree-count">' + (S().audit || []).length + '</span></button>' +
      '</aside>';

    let centerHtml = '';
    if (tab === 'users') centerHtml = renderUsersDirectoryView();
    else if (tab === 'admin_identity') centerHtml = renderAdminIdentityView();
    else if (tab === 'groups') centerHtml = renderSecurityGroupsView();
    else if (tab === 'payments') centerHtml = renderPaymentsAndPciView();
    else if (tab === 'requests') centerHtml = renderRequestsView();
    else if (tab === 'audit') centerHtml = renderAuditView();

    const inspectorHtml = tab === 'users' ? renderObjectInspector() : '';
    const cls = ['ad-console'];
    if (!inspectorHtml) cls.push('no-inspector');
    if (treeCollapsed) cls.push('tree-collapsed');
    app.innerHTML = '<div class="' + cls.join(' ') + '">' + treeHtml + centerHtml + inspectorHtml + '</div>';
    W.header('access-admin.html');
    bind();
  }

  function bind() {
    const btnTreeCollapse = document.getElementById('btnToggleTreeCollapse');
    if (btnTreeCollapse) {
      btnTreeCollapse.onclick = (e) => {
        e.stopPropagation();
        treeCollapsed = !treeCollapsed;
        render();
      };
    }
    const btnHideInsp = document.getElementById('btnHideInspector');
    if (btnHideInsp) {
      btnHideInsp.onclick = () => {
        inspectorHidden = true;
        render();
      };
    }
    app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
      tab = b.dataset.tab;
      if (b.dataset.ou) ouFilter = b.dataset.ou;
      render();
    });
    app.querySelectorAll('[data-select-user]').forEach(row => row.onclick = () => {
      selectedUserId = row.dataset.selectUser;
      inspectorHidden = false;
      render();
    });
    app.querySelectorAll('[data-prop-tab]').forEach(b => b.onclick = () => {
      propTab = b.dataset.propTab;
      render();
    });

    const searchEl = document.getElementById('adSearchInput');
    if (searchEl) {
      searchEl.oninput = () => {
        searchQuery = searchEl.value;
        const pos = searchEl.selectionStart;
        render();
        const nextSearch = document.getElementById('adSearchInput');
        if (nextSearch) { nextSearch.focus(); try { nextSearch.setSelectionRange(pos, pos); } catch (_) {} }
      };
    }

    const btnToggleNew = document.getElementById('btnToggleNewUser');
    if (btnToggleNew) btnToggleNew.onclick = () => { showNewUserDrawer = !showNewUserDrawer; render(); };
    const btnCloseNew = document.getElementById('btnCloseNewUser');
    if (btnCloseNew) btnCloseNew.onclick = () => { showNewUserDrawer = false; render(); };

    app.querySelectorAll('[data-toggle-page]').forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      const [uidVal, pageId, enStr] = b.dataset.togglePage.split('|');
      const en = enStr === 'true';
      selectedUserId = uidVal;
      W.toggleUserFeature(uidVal, 'page', pageId, en);
      W.toast((en ? 'Granted ' : 'Revoked ') + pageId + ' for ' + name(uidVal));
      render();
    });
    app.querySelectorAll('[data-toggle-app]').forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      const [uidVal, appId, enStr] = b.dataset.toggleApp.split('|');
      const en = enStr === 'true';
      selectedUserId = uidVal;
      W.toggleUserFeature(uidVal, 'app', appId, en);
      W.toast((en ? 'Unlocked ' : 'Locked ') + appId + ' for ' + name(uidVal));
      render();
    });
    app.querySelectorAll('[data-preset]').forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      const [uidVal, presetId] = b.dataset.preset.split('|');
      selectedUserId = uidVal;
      W.toggleUserFeature(uidVal, 'preset', presetId, true);
      W.toast((presetId === 'grant_all_features' ? 'Granted all features to ' : 'Reset to SaaS & LMS Only for ') + name(uidVal));
      render();
    });

    const btnApplyGrp = document.getElementById('btnApplyGroupPolicy');
    if (btnApplyGrp && selectedUserId) {
      btnApplyGrp.onclick = () => {
        const ouVal = document.getElementById('propUserOu').value;
        const grpVal = document.getElementById('propUserGroup').value;
        W.setUserDirectoryProfile({ userId: selectedUserId, ou: ouVal, securityGroup: grpVal, applyGroupPolicy: true });
        W.toast('Applied ' + grpVal + ' (' + ouVal.toUpperCase() + ') to ' + name(selectedUserId));
        render();
      };
    }

    const btnSaveAcct = document.getElementById('btnSaveAccountProfile');
    if (btnSaveAcct && selectedUserId) {
      btnSaveAcct.onclick = () => {
        const username = document.getElementById('propUsername').value.trim();
        const org = document.getElementById('propOrg').value.trim();
        const status = document.getElementById('propStatus').value;
        W.setUserDirectoryProfile({ userId: selectedUserId, username, org, status });
        W.toast('Saved Active Directory attributes for ' + name(selectedUserId));
        render();
      };
    }

    const btnResetPass = document.getElementById('btnResetUserPass');
    if (btnResetPass && selectedUserId) {
      btnResetPass.onclick = () => {
        const np = document.getElementById('propNewPass').value.trim();
        if (!np || np.length < 4) { W.toast('Password must be at least 4 characters'); return; }
        W.setUserPassword(selectedUserId, np);
        W.toast('Password reset for ' + name(selectedUserId));
        document.getElementById('propNewPass').value = '';
      };
    }

    const admSavePassBtn = document.getElementById('admSavePassBtn');
    if (admSavePassBtn) {
      admSavePassBtn.onclick = () => {
        const un = (document.getElementById('admUsernameInput') && document.getElementById('admUsernameInput').value || 'malik.khabir').trim();
        const np = (document.getElementById('admNewPassInput').value || '').trim();
        if (!np || np.length < 8) { W.toast('Administrator password must be at least 8 characters and non-generic'); return; }
        W.postServerAction({ action: 'updateAdminPassword', username: un, newPassword: np });
        W.toast('Administrator username & case-sensitive password updated');
        document.getElementById('admNewPassInput').value = '';
      };
    }

    const btnSavePci = document.getElementById('btnSavePciGateway');
    if (btnSavePci) {
      btnSavePci.onclick = () => {
        const activeProcessor = document.getElementById('pciActiveProcessor').value;
        const stripePublishableKey = document.getElementById('pciStripePk').value.trim();
        const authorizeNetClientKey = document.getElementById('pciAuthNetKey').value.trim();
        W.savePciGatewayConfig({ activeProcessor, stripePublishableKey, authorizeNetClientKey });
        W.toast('Saved PCI-DSS Gateway Configuration (' + activeProcessor + ')');
        render();
      };
    }

    const admRegGo = document.getElementById('admRegGo');
    if (admRegGo) {
      admRegGo.onclick = () => {
        const n = document.getElementById('admRegName').value.trim();
        const em = document.getElementById('admRegEmail').value.trim().toLowerCase();
        const pw = (document.getElementById('admRegPass') && document.getElementById('admRegPass').value || '').trim();
        const org = document.getElementById('admRegOrg').value.trim();
        const ou = (document.getElementById('admRegOu') && document.getElementById('admRegOu').value) || 'external';
        const prov = document.getElementById('admRegProvider').value;
        const intr = document.getElementById('admRegInterest').value;
        if (!n || !/^\S+@\S+\.\S+$/.test(em)) { W.toast('Enter valid Name & Email'); return; }
        const newId = W.submitRequest({
          name: n,
          email: em,
          username: em.split('@')[0],
          password: pw,
          org: org || (ou === 'internal' ? 'MGC Internal Operations' : 'External Partner'),
          ou,
          securityGroup: ou === 'internal' ? 'INTERNAL_ANALYST' : 'EXTERNAL_SAAS_LMS',
          ssoProvider: prov,
          interest: intr,
          brand: 'FIX',
          ndaAccepted: true,
          mfaVerified: true
        });
        if (!newId) { W.toast((W.lastIntakeResult && W.lastIntakeResult.error) || 'Could not create object'); return; }
        selectedUserId = newId;
        showNewUserDrawer = false;
        W.toast('Created ' + n + ' in OU=' + ou.toUpperCase());
        render();
      };
    }

    app.querySelectorAll('[data-ap]').forEach(b => b.onclick = () => { W.approve(b.dataset.ap); W.toast('Approved'); render(); });
    app.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => { W.deny(b.dataset.dn); render(); });
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (showNewUserDrawer) { showNewUserDrawer = false; render(); }
      else if (!inspectorHidden) { inspectorHidden = true; render(); }
    }
  });

  render();
})();
</script>
</body>
</html>
