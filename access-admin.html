<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Access Admin | MGC Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body>
<main class="wrap" id="app"></main>
<script src="mgc-workspace-core.js"></script>
<script>
(function () {
  const W = MGCW, S = () => W.S, esc = W.esc, app = document.getElementById('app');
  const me = W.me();
  let tab = 'users';

  if (!me || me.role !== 'owner' || me.id !== 'owner' || String(me.email || '').toLowerCase() !== 'malik.khabir@miltongroupsecurity.org') {
    app.innerHTML = '<div class="card lock"><span class="chip warn">🔒 Sole Administrator Authorization Enforced</span><h1 style="margin-top:10px">Administrator authentication required</h1><p>This administrative control center is restricted exclusively to the sole Administrator account (Malik A. Khabir).</p><div style="margin-top:14px"><a class="btn pri" href="login.html?next=access-admin.html">Sign In as Administrator →</a></div></div>';
    W.header('access-admin.html'); return;
  }
  const members = () => Object.values(S().users).filter(x => x.role !== 'owner');
  const name = (id) => (S().users[id] || {}).name || id;

  function kpis() {
    const m = members(); const c = (s) => m.filter(x => x.status === s).length;
    const paid = m.filter(x => x.paymentProfile && x.paymentProfile.verified).length;
    return '<div class="kpi-strip">' +
      [['Sole Administrator', '1 (Malik)'], ['Registered Users', m.length], ['Active Users', c('active')], ['Verified Payments', paid], ['Total Receipts', (S().payments || []).length]]
      .map(k => '<div class="kpi-tile"><small>' + k[0] + '</small><strong>' + k[1] + '</strong></div>').join('') +
      '</div>';
  }

  function requests() {
    const list = members().filter(x => x.status === 'requested');
    const reqLog = (S().requests || []).slice(0, 12);
    const pendingHtml = !list.length
      ? '<div class="compact-card" style="margin-bottom:12px"><h3>Pending Queue</h3><p>All registered accounts are provisioned and active (restricted by default to <b>SaaS Apps &amp; LMS</b> + <b>Payment Submission</b>). Use the <b>Fluid User Access &amp; Features</b> tab to grant or revoke additional views.</p></div>'
      : list.map(x => '<div class="compact-card" style="margin-bottom:10px"><div class="row"><div><h3>' + esc(x.name) + ' · ' + esc(x.email) + '</h3><p>' + (x.brand === 'FIX' ? 'F.I.X Solutions' : 'MGC') + ' · Track: <b>' + esc(((W.TAILOR[x.quote && x.quote.interest] || {}).label) || (x.quote && x.quote.interest) || 'SaaS') + '</b></p></div><div class="nav"><button class="btn pri" data-ap="' + x.id + '">Approve → Build Pages</button><button class="btn" data-dn="' + x.id + '">Deny</button></div></div></div>').join('');
    const logHtml = reqLog.length
      ? '<div class="card"><h2>Verified Intake &amp; Registration Ledger (' + reqLog.length + ')</h2><table><thead><tr><th>Receipt</th><th>Name &amp; Org</th><th>Email / SSO</th><th>Track</th><th>Status</th></tr></thead><tbody>' +
        reqLog.map(r => '<tr><td><span class="chip">' + esc(r.receipt || r.id) + '</span></td><td><b>' + esc(r.name) + '</b><br><span style="font-size:11px;color:var(--mut)">' + esc(r.org || 'External') + '</span></td><td>' + esc(r.email) + ' <span class="chip">' + esc((r.ssoProvider || 'google').toUpperCase()) + '</span></td><td>' + esc(r.interest || 'saas') + '</td><td><span class="chip ok">' + esc(r.status || 'active') + '</span></td></tr>').join('') +
        '</tbody></table></div>'
      : '';
    return pendingHtml + logHtml;
  }

  function tasks() {
    const t = S().tasks;
    if (!t.length) return '<div class="card"><p>No build tasks. Approve a request to generate the page-creation workflow.</p></div>';
    const by = {}; t.forEach(x => (by[x.uid] = by[x.uid] || []).push(x));
    return '<div class="bento-2">' + Object.keys(by).map(id => { const done = by[id].filter(x => x.done).length;
      return '<div class="compact-card"><div class="row"><h3>' + esc(name(id)) + '</h3><span class="chip ' + (done === by[id].length ? 'ok' : 'warn') + '">' + done + '/' + by[id].length + ' built</span></div>' +
        by[id].map(x => '<label class="row" style="justify-content:flex-start;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer"><input type="checkbox" data-task="' + x.id + '"' + (x.done ? ' checked' : '') + '><span>' + esc(x.title) + '</span></label>').join('') +
        '</div>'; }).join('') + '</div>';
  }

  function users() {
    const cols = W.CATALOG;
    const apps = W.APPS_CATALOG || [];
    return '<div class="card" style="margin-bottom:12px"><h2>+ Provision &amp; Register New Account (Defaults to SaaS Apps &amp; LMS Only)</h2><div class="row" style="justify-content:flex-start;gap:8px;margin-top:8px"><input id="admRegName" placeholder="Full Name" style="flex:1;min-width:150px"><input id="admRegEmail" placeholder="work@organization.org" style="flex:1;min-width:180px"><input id="admRegOrg" placeholder="Organization" style="flex:1;min-width:140px"><select id="admRegProvider"><option value="google">Google SSO</option><option value="microsoft">Microsoft Entra</option><option value="apple">Apple ID</option></select><select id="admRegInterest"><option value="saas">Turnkey SaaS</option><option value="federal">Federal SDVOSB</option><option value="ai">Agentic AI</option><option value="cyber">Zero-Trust Cyber</option></select><button class="btn pri" id="admRegGo">Register User</button></div></div>' +
      '<div class="card" style="margin-bottom:12px"><h2>Fluid User Access &amp; Feature Control (' + members().length + ' Non-Admin Users)</h2><p style="margin-bottom:12px">New users only see <b>⚡ SaaS Apps &amp; LMS</b> and <b>💳 Submit Payment &amp; Billing</b> in their Left Side Pane and Top Menu. Click any feature pill below to fluidly grant or revoke access for that user in real time.</p>' +
      members().map(x => {
        const pay = x.paymentProfile;
        const payBadge = (pay && pay.verified)
          ? '<span class="chip ok">✅ Payment Verified (' + esc(pay.cardBrand || pay.method) + ' •••• ' + esc(pay.last4) + ' · ' + esc(pay.receiptId) + ')</span>'
          : '<span class="chip warn">⏳ Awaiting Payment Submission</span>';
        const grantedPages = cols.filter(c => W.can(x, 'page', c.id, 'view')).length;
        const grantedApps = apps.filter(a => W.can(x, 'app', a.id, 'view')).length;
        return '<div class="compact-card" data-user-card="' + esc(x.id) + '" style="margin-bottom:12px;border-color:rgba(197,179,88,0.38)">' +
          '<div class="row" style="margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)">' +
            '<div>' +
              '<h3 style="font-size:15px">' + esc(x.name) + ' <span style="font-weight:500;color:var(--mut)">(' + esc(x.email) + ')</span></h3>' +
              '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">' +
                '<span class="chip">' + esc((x.ssoProvider || 'google').toUpperCase()) + ' SSO</span>' +
                '<span class="chip ok">' + grantedPages + '/' + cols.length + ' Features</span>' +
                '<span class="chip">' + grantedApps + '/' + apps.length + ' Apps</span>' +
                payBadge +
              '</div>' +
            '</div>' +
            '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
              '<button type="button" class="btn pri" data-preset="' + esc(x.id) + '|grant_all_features" style="font-size:11px;padding:6px 10px">🔓 Grant All Features</button>' +
              '<button type="button" class="btn" data-preset="' + esc(x.id) + '|reset_saas_only" style="font-size:11px;padding:6px 10px">🛡️ Reset to SaaS &amp; LMS Only</button>' +
            '</div>' +
          '</div>' +
          '<div style="margin-bottom:8px">' +
            '<div style="font-size:11px;font-weight:800;color:#cbd5e1;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Portal Views &amp; Left/Top Menu Features (Click to Grant / Revoke):</div>' +
            '<div style="display:flex;flex-wrap:wrap;gap:6px">' +
              cols.map(c => {
                const on = W.can(x, 'page', c.id, 'view');
                const isDefaultSaas = c.id === 'saasapps';
                return '<button type="button" class="btn ' + (on ? 'ok' : '') + '" data-toggle-page="' + esc(x.id) + '|' + esc(c.id) + '|' + (!on) + '" style="font-size:11.5px;padding:6px 10px;' + (on ? 'border-color:rgba(16,185,129,0.65);background:rgba(16,185,129,0.18);color:#6ee7b7' : 'opacity:0.75') + '">' +
                  c.icon + ' ' + esc(c.title) + ' · <b>' + (on ? (isDefaultSaas ? '✅ Default' : '✅ Granted') : '+ Grant') + '</b>' +
                '</button>';
              }).join('') +
            '</div>' +
          '</div>' +
          '<div>' +
            '<div style="font-size:11px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">SCORM 2004 / SaaS App Entitlements (Click to Grant / Revoke):</div>' +
            '<div style="display:flex;flex-wrap:wrap;gap:6px">' +
              apps.map(a => {
                const on = W.can(x, 'app', a.id, 'view');
                return '<button type="button" class="btn" data-toggle-app="' + esc(x.id) + '|' + esc(a.id) + '|' + (!on) + '" style="font-size:11px;padding:5px 9px;' + (on ? 'border-color:rgba(56,189,248,0.6);background:rgba(56,189,248,0.16);color:#bae6fd' : 'opacity:0.7') + '">' +
                  a.icon + ' ' + esc(a.title) + ' · <b>' + (on ? '✅ On' : '+ Unlock') + '</b>' +
                '</button>';
              }).join('') +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('') +
      '</div>';
  }

  function paymentsTab() {
    const list = S().payments || [];
    return '<div class="card"><h2>💳 Verified Customer Payment &amp; Billing Submissions (' + list.length + ')</h2>' +
      '<p style="margin-bottom:12px">All customer payment instruments are tokenized under <b>PCI-DSS v4.0 SAQ-A</b> (zero raw PAN storage) with <b>EFTA / Reg E / NACHA</b> legal authorization.</p>' +
      (list.length
        ? '<table><thead><tr><th>Receipt</th><th>Customer</th><th>Plan / Amount</th><th>Tokenized Instrument</th><th>Legal Attestation</th><th>Timestamp</th></tr></thead><tbody>' +
          list.map(p => '<tr><td><span class="chip ok">' + esc(p.receiptId) + '</span><br><code style="font-size:10px;color:var(--mut)">' + esc(p.signature || '') + '</code></td><td><b>' + esc(p.billingName || name(p.uid)) + '</b><br><span style="font-size:11px;color:var(--mut)">' + esc(p.email || '') + ' · ' + esc(p.billingOrg || '') + '</span></td><td><b>' + esc(p.planLabel || p.planId) + '</b><br><span class="chip">$' + Number(p.amountUsd || 0).toLocaleString() + ' USD</span></td><td><b>' + esc(p.cardBrand || p.method) + ' •••• ' + esc(p.last4) + '</b><br><code style="font-size:10px;color:#38bdf8">' + esc(p.paymentToken || '') + '</code></td><td><span class="chip ok">EFTA + PCI + MSA</span></td><td style="font-size:11px;color:var(--mut)">' + new Date(p.createdAt || Date.now()).toLocaleString() + '</td></tr>').join('') +
          '</tbody></table>'
        : '<p>No customer payment submissions recorded yet.</p>') +
      '</div>';
  }

  function sharing() {
    const elements = [['kpi-strip', 'Element: KPI strip (read-only)'], ['radar-feed', 'Element: Contract feed (read-only)'], ['roadmap', 'Element: Roadmap view']];
    const projects = Object.values(S().projects);
    const apps = W.APPS_CATALOG || [];
    const sh = S().shares;
    return '<div class="card"><h2>Grant Granular Entitlement</h2><p style="margin-bottom:10px">Customers default to <b>CUSTOMER_RESTRICTED (2/8 apps)</b>. Granting an App or Project unlocks only that resource.</p>' +
      '<div class="row" style="justify-content:flex-start"><select id="shUser">' + members().map(x => '<option value="' + x.id + '">' + esc(x.name) + ' (' + esc(x.email) + ')</option>').join('') + '</select>' +
      '<select id="shRes">' +
      apps.map(a => '<option value="app|' + a.id + '">App: ' + a.icon + ' ' + esc(a.title) + (a.defaultCustomer ? ' (Default)' : ' (Restricted)') + '</option>').join('') +
      projects.map(p => '<option value="project|' + p.id + '">Project: ' + esc(p.name) + '</option>').join('') +
      elements.map(e => '<option value="element|' + e[0] + '">' + e[1] + '</option>').join('') + '</select>' +
      '<select id="shPerm"><option value="view">view / launch</option><option value="view,edit">view + edit (projects)</option></select><button class="btn pri" id="shGo">Grant Access</button></div></div>' +
      '<div class="card" style="margin-top:10px"><h2>Active Entitlements (' + sh.length + ')</h2>' + (sh.length ? sh.map(s => '<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>' + esc(s.type) + ' · <b>' + esc(s.resource) + '</b> → <b>' + esc(name(s.grantee)) + '</b> <span class="chip">' + esc(s.perms.join('+')) + '</span></span><button class="btn" data-rv="' + esc(s.id) + '">Revoke</button></div>').join('') : '<p>No custom shares yet.</p>') + '</div>';
  }

  function notifs() {
    const l = S().notifications.slice(0, 40);
    return '<div class="card"><h2>Notification Outbox (' + l.length + ')</h2>' + l.map(n => '<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><span><b>' + esc(name(n.toUid)) + '</b> · ' + esc(n.title) + '<br><span style="color:var(--mut);font-size:12px">' + esc(n.body) + '</span></span><span class="chip">' + esc(n.channel) + '</span></div>').join('') + '</div>';
  }
  function audit() {
    return '<div class="card"><h2>Audit Ledger</h2><table><tbody>' + S().audit.slice(0, 50).map(a => '<tr><td>' + new Date(a.ts).toLocaleString() + '</td><td>' + esc(name(a.actor)) + '</td><td><span class="chip">' + esc(a.action) + '</span></td><td>' + esc(a.detail) + '</td></tr>').join('') + '</tbody></table>' + (S().audit.length ? '' : '<p>Empty.</p>') + '</div>';
  }

  const TABS = [['users', '👥 Fluid User Access & Features', users], ['payments', '💳 Verified Payments', paymentsTab], ['requests', '📥 Intake & Requests', requests], ['sharing', '🔑 Granular Shares', sharing], ['tasks', '🛠 Build Workflow', tasks], ['notifs', '🔔 Outbox', notifs], ['audit', '📜 Audit Log', audit]];
  function render() {
    const sideHtml =
      '<aside class="ws-side">' +
        '<span class="chip ok">👑 Sole Administrator</span>' +
        '<h2 style="margin:8px 0 4px;font-size:17px">Access &amp; Feature Control</h2>' +
        '<p style="font-size:12px;margin-bottom:12px">Fluidly grant or revoke views, features, and apps for any user, and verify PCI-DSS / EFTA payments.</p>' +
        '<div style="display:flex;flex-direction:column;gap:6px">' +
          TABS.map(t => '<button class="btn' + (t[0] === tab ? ' pri' : '') + '" data-tab="' + t[0] + '" style="text-align:left;justify-content:flex-start">' + t[1] + '</button>').join('') +
        '</div>' +
        '<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:10px;display:flex;flex-direction:column;gap:6px">' +
          '<a class="btn" href="login.html?mode=register">+ Open Public Registration ↗</a>' +
          '<a class="btn" href="request-access.html">📋 Client Intake Form ↗</a>' +
        '</div>' +
      '</aside>';
    app.innerHTML = '<div class="ws-layout">' + sideHtml + '<div class="ws-main">' + kpis() + TABS.find(t => t[0] === tab)[2]() + '</div></div>';
    W.header('access-admin.html'); bind();
  }
  function bind() {
    app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
    app.querySelectorAll('[data-ap]').forEach(b => b.onclick = () => { W.approve(b.dataset.ap); W.toast('Approved — build tasks created'); tab = 'tasks'; render(); });
    app.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => { W.deny(b.dataset.dn); render(); });
    app.querySelectorAll('[data-task]').forEach(c => c.onchange = () => { W.completeTask(c.dataset.task, c.checked); render(); });
    app.querySelectorAll('[data-rv]').forEach(b => b.onclick = () => { W.revoke(b.dataset.rv); render(); });
    app.querySelectorAll('[data-toggle-page]').forEach(b => b.onclick = () => {
      const [uidVal, pageId, enStr] = b.dataset.togglePage.split('|');
      const en = enStr === 'true';
      W.toggleUserFeature(uidVal, 'page', pageId, en);
      W.toast((en ? '✓ Granted ' : '🔒 Revoked ') + pageId + ' for ' + name(uidVal));
      render();
    });
    app.querySelectorAll('[data-toggle-app]').forEach(b => b.onclick = () => {
      const [uidVal, appId, enStr] = b.dataset.toggleApp.split('|');
      const en = enStr === 'true';
      W.toggleUserFeature(uidVal, 'app', appId, en);
      W.toast((en ? '✓ Unlocked app ' : '🔒 Locked app ') + appId + ' for ' + name(uidVal));
      render();
    });
    app.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
      const [uidVal, presetId] = b.dataset.preset.split('|');
      W.toggleUserFeature(uidVal, 'preset', presetId, true);
      W.toast(presetId === 'grant_all_features' ? '✓ All features & apps granted for ' + name(uidVal) : '🛡️ Reset ' + name(uidVal) + ' to SaaS & LMS Only');
      render();
    });
    const regBtn = document.getElementById('admRegGo');
    if (regBtn) regBtn.onclick = async () => {
      const nm = document.getElementById('admRegName').value.trim();
      const em = document.getElementById('admRegEmail').value.trim().toLowerCase();
      const og = document.getElementById('admRegOrg').value.trim() || 'Client Organization';
      const pv = document.getElementById('admRegProvider').value;
      const tr = document.getElementById('admRegInterest').value;
      if (!nm || !/^\S+@\S+\.\S+$/.test(em)) { W.toast('Enter valid name and email'); return; }
      try {
        await fetch('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: nm, email: em, org: og, ssoProvider: pv, interest: tr, brand: 'MGC', ndaAccepted: true }) });
      } catch (_) {}
      W.submitRequest({ name: nm, email: em, org: og, ssoProvider: pv, interest: tr, brand: 'MGC', ndaAccepted: true, mfaVerified: true });
      W.toast('Registered ' + nm + ' (' + em + ') — Restricted to SaaS Apps & LMS');
      render();
    };
    const go = document.getElementById('shGo'); if (go) go.onclick = () => { const r = document.getElementById('shRes').value.split('|'); let p = document.getElementById('shPerm').value.split(','); if (r[0] === 'element' || r[0] === 'app') p = ['view']; W.share(document.getElementById('shUser').value, r[0], r[1], p); W.toast('Entitlement granted'); render(); };
  }
  window.addEventListener('mgcw:remote-sync', () => render());
  render();
})();
</script>

<!-- SCORM 2004 4TH EDITION + DUAL CITYSCAPE (F.I.X. & MILTONGROUPSECURITY.ORG) LAYER -->
<style id="mgc-fix-scorm-cityscape-style">
  body { position: relative; isolation: isolate; }
  body > *:not(#mgc-fix-bg-image):not(#mgc-fix-skyscraper-overlay):not(#mgc-scorm-floating-dock):not(#dual-cityscape-bg):not(#dual-cityscape-overlay):not(#mgc-skyscraper-layer):not(.thematic-city-backdrop):not(script):not(style):not(link) {
    position: relative;
    z-index: 5;
  }
  header, nav, main, section, .container, .wrap, .main-grid, .portal-grid, .stepper, .hero, .hero-banner, .top-nav, .topbar {
    position: relative;
    z-index: 5;
  }
  header, .hero, .hero-banner, .top-nav, .topbar {
    background-color: rgba(7, 12, 24, 0.96) !important;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }
  .card, .panel, .portal-item, .step, .stat-card, .hub-card, .glass-card, .module-card, .section-card, .eveng-console-pane, .theory-box, .kpi-card, .box, .tile, .feature-card, .metric-card, .control-card, .workflow-card, .product-card, .radar-card {
    background-color: rgba(9, 16, 32, 0.96) !important;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-color: rgba(148, 163, 184, 0.34) !important;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    position: relative;
    z-index: 5;
  }
  #mgc-fix-bg-image {
    position: fixed;
    inset: -5%;
    z-index: -10 !important;
    pointer-events: none;
    background-image: url('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&q=80&w=2500');
    background-size: 118% 118%;
    background-position: 50% 50%;
    opacity: 0.20;
    mix-blend-mode: normal !important;
    filter: grayscale(30%) contrast(118%) brightness(50%) sepia(24%) hue-rotate(185deg);
    transition: filter 0.8s ease, background-position 1s ease, opacity 0.5s ease;
  }
  #mgc-fix-skyscraper-overlay {
    position: fixed;
    inset: 0;
    z-index: -9 !important;
    pointer-events: none;
    opacity: 0.75;
    mix-blend-mode: normal !important;
    transition: opacity 0.6s ease;
  }
  @keyframes waveFlagInjected {
    0%, 100% { transform: skewY(0deg) scaleX(1); }
    35% { transform: skewY(3.5deg) scaleX(0.93); }
    70% { transform: skewY(-2.5deg) scaleX(0.97); }
  }
  #mgc-scorm-floating-dock {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    background: rgba(11, 20, 38, 0.94);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(197, 179, 88, 0.48);
    border-radius: 999px;
    padding: 7px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 11.5px;
    color: #f8fafc;
    max-width: 96vw;
  }
  #mgc-scorm-floating-dock a, #mgc-scorm-floating-dock button, #mgc-scorm-floating-dock select {
    font-size: 11px;
    font-weight: 700;
    border-radius: 999px;
    padding: 4px 10px;
    cursor: pointer;
    text-decoration: none;
  }
</style>
<div id="mgc-fix-bg-image" aria-hidden="true"></div>
<div id="mgc-fix-skyscraper-overlay" aria-hidden="true">

<script src="projects/spanish-acquisition-os/src/modules/scorm_adapter.js"></script>
<script>
  window.switchInjectedCityscape = function(mode) {
    var bg = document.getElementById('mgc-fix-bg-image');
    var sky = document.getElementById('mgc-fix-skyscraper-overlay');
    if (!bg || !sky) return;
    if (mode === 'mgc-cityscape') {
      sky.style.opacity = '1';
      bg.style.filter = 'contrast(122%) brightness(65%) saturate(130%)';
    } else if (mode === 'noir-greyscale') {
      sky.style.opacity = '0';
      bg.style.filter = 'grayscale(100%) contrast(138%) brightness(52%)';
    } else if (mode === 'emerald-matrix') {
      sky.style.opacity = '1';
      bg.style.filter = 'grayscale(55%) sepia(40%) hue-rotate(115deg) saturate(190%) contrast(122%) brightness(54%)';
    } else {
      sky.style.opacity = '0';
      bg.style.filter = 'grayscale(30%) contrast(118%) brightness(58%) sepia(24%) hue-rotate(185deg)';
    }
    bg.style.backgroundPosition = (30 + Math.floor(Math.random() * 45)) + '% ' + (30 + Math.floor(Math.random() * 45)) + '%';
  };
  window.commitInjectedScorm = function() {
    if (typeof SAOS_SCORM !== 'undefined') {
      SAOS_SCORM.set('cmi.completion_status', 'completed');
      SAOS_SCORM.set('cmi.success_status', 'passed');
      SAOS_SCORM.commit();
    }
    alert('✓ SCORM 2004 4th Edition Completion committed (MGC_ACCESS_ADMIN_SCO)!');
  };
</script>
