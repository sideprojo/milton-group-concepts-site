<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Active Directory &amp; RBAC Console | MGC Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  @keyframes adFadeSlide {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes adInspectorSlide {
    from { opacity: 0; transform: translateX(16px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .ad-console {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr) 340px;
    gap: 14px;
    align-items: start;
    transition: grid-template-columns .24s cubic-bezier(.16,1,.3,1);
  }
  .ad-console.no-inspector {
    grid-template-columns: 220px minmax(0, 1fr);
  }
  .ad-console.tree-collapsed {
    grid-template-columns: 54px minmax(0, 1fr) 340px;
  }
  .ad-console.tree-collapsed.no-inspector {
    grid-template-columns: 54px minmax(0, 1fr);
  }
  .ad-tree {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px;
    position: sticky;
    top: 64px;
    transition: width .22s cubic-bezier(.16,1,.3,1), opacity .2s ease, box-shadow .2s ease;
    overflow: hidden;
  }
  .ad-console.tree-collapsed .ad-tree {
    padding: 10px 6px;
  }
  .ad-console.tree-collapsed .ad-tree:not(:hover) .ad-tree-label,
  .ad-console.tree-collapsed .ad-tree:not(:hover) .ad-tree-count,
  .ad-console.tree-collapsed .ad-tree:not(:hover) .ad-tree-section {
    opacity: 0;
    width: 0;
    height: 0;
    overflow: hidden;
    display: none;
  }
  .ad-console.tree-collapsed .ad-tree:hover {
    width: 235px;
    position: relative;
    z-index: 40;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
  }
  .ad-tree-root {
    font-size: 11.5px;
    font-weight: 600;
    color: #fde047;
    letter-spacing: .01em;
    padding: 6px 8px 10px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ad-tree-section {
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: #64748b;
    padding: 10px 8px 4px;
  }
  .ad-tree-item {
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    color: #cbd5e1;
    padding: 7px 10px;
    border-radius: 7px;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    transition: all .14s;
  }
  .ad-tree-item:hover {
    background: rgba(59, 130, 246, 0.12);
    color: #fff;
  }
  .ad-tree-item.active {
    background: rgba(37, 99, 235, 0.22);
    border-color: rgba(96, 165, 250, 0.45);
    color: #fff;
    font-weight: 600;
  }
  .ad-tree-count {
    font-size: 11px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    padding: 1px 7px;
    border-radius: 6px;
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid rgba(148, 163, 184, 0.22);
    color: #94a3b8;
  }
  .ad-center {
    background: rgba(8, 13, 26, 0.96);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  .ad-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    background: rgba(15, 23, 42, 0.92);
    border-bottom: 1px solid var(--line);
  }
  .ad-table-wrap {
    overflow-x: auto;
  }
  table.ad-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }
  table.ad-table th {
    background: rgba(4, 8, 20, 0.88);
    padding: 9px 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: #94a3b8;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  table.ad-table td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.14);
    vertical-align: middle;
  }
  #iseTrustSecMatrixTable th {
    padding: 8px 6px;
    font-size: 10px;
    white-space: normal;
    line-height: 1.25;
  }
  #iseTrustSecMatrixTable td {
    padding: 7px 6px;
  }
  table.ad-table tbody tr {
    cursor: pointer;
    transition: background .12s;
  }
  table.ad-table tbody tr:hover {
    background: rgba(59, 130, 246, 0.1);
  }
  table.ad-table tbody tr.selected {
    background: rgba(37, 99, 235, 0.2);
  }
  .ad-inspector {
    background: rgba(8, 13, 26, 0.97);
    border: 1px solid rgba(197, 179, 88, 0.42);
    border-radius: 12px;
    overflow: hidden;
    position: sticky;
    top: 12px;
  }
  .ad-inspector-hdr {
    padding: 12px 14px;
    background: rgba(15, 23, 42, 0.95);
    border-bottom: 1px solid var(--line);
  }
  .ad-prop-tabs {
    display: flex;
    border-bottom: 1px solid var(--line);
    background: rgba(4, 8, 20, 0.9);
  }
  .ad-prop-tab {
    flex: 1;
    text-align: center;
    padding: 8px 6px;
    font-size: 11.5px;
    font-weight: 600;
    color: #94a3b8;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
  }
  .ad-prop-tab.active {
    color: #fde047;
    border-bottom-color: #fde047;
    background: rgba(197, 179, 88, 0.08);
  }
  .ad-prop-body {
    padding: 12px 14px;
    max-height: 74vh;
    overflow-y: auto;
  }
  .ad-check-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid rgba(148, 163, 184, 0.16);
    margin-bottom: 5px;
    background: rgba(4, 8, 20, 0.65);
    font-size: 11.5px;
  }
  .ad-check-row.granted {
    border-color: rgba(16, 185, 129, 0.48);
    background: rgba(16, 185, 129, 0.11);
  }
  @media (max-width: 1160px) {
    .ad-console {
      grid-template-columns: 210px minmax(0, 1fr);
    }
    .ad-inspector {
      grid-column: 1 / -1;
      position: static;
    }
  }
  @media (max-width: 780px) {
    .ad-console, .ad-console.no-inspector {
      grid-template-columns: 1fr;
    }
  }
</style>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <meta property="og:image" content="assets/og-mgc-banner.jpg">
</head>
<body>
<main class="wrap" id="app"></main>
<script src="mgc-workspace-core.js"></script>
<script>
(function () {
  const W = MGCW, S = () => W.S, esc = W.esc, app = document.getElementById('app');
  const me = W.me();
  const isOwner = W.isOwner(me);
  const isEmp = W.isEmployee(me);
  const urlParams = new URLSearchParams(location.search);
  let tab = urlParams.get('tab') || 'users';
  let ouFilter = urlParams.get('ou') || (isEmp ? 'external' : 'all'); // 'all' | 'internal' | 'external'
  let groupFilter = 'all';
  let statusFilter = 'all';
  let appFilter = 'all';
  let resourceFilter = 'all';
  let searchQuery = '';
  let selectedUserId = '';
  let propTab = 'rbac'; // 'rbac' | 'apps' | 'resources' | 'account' | 'billing'
  let showNewUserDrawer = false;
  let treeCollapsed = false;
  let inspectorHidden = false;
  let showAdvancedFilters = false;
  let selectedMatrixCell = 'EXTERNAL_SAAS_LMS|turnkey';
  let accEntityFilter = 'ALL';
  let activeOttoTool = 'route_client_workspace';
  let lastOttoToolResult = null;
  let adminSmlOutput = null;
  let adminSmlPrompt = "";
  let adminSmlTarget = "all";
  let sentinelSpeech = "Sentinel active. Guiding you through external client accounts and open requests.";

  const getResourcesList = () => W.getResourcesCatalog ? W.getResourcesCatalog() : (W.RESOURCES_CATALOG || []);

  if (!me || (!isOwner && !isEmp)) {
    app.innerHTML = '<div class="card lock"><h1 style="margin-top:4px">Directory Authorization Required</h1><p>This MGC Directory console is restricted to authorized Domain Administrators and Internal Staff.</p><div style="margin-top:14px"><a class="btn pri" href="login.html?next=access-admin.html">Sign In</a></div></div>';
    W.header('access-admin.html');
    return;
  }

  // Enforce strict Employee scoping: Employees ONLY see Client (OU=External) users and Client Consultations/Requests.
  if (isEmp) {
    ouFilter = 'external';
    if (!['users', 'requests'].includes(tab)) tab = 'users';
    if (propTab === 'billing') propTab = 'rbac';
  }

  const getUserOu = (u) => u.ou === 'internal' ? 'internal' : 'external';
  const getUserGroup = (u) => u.securityGroup || (getUserOu(u) === 'internal' ? 'INTERNAL_ANALYST' : 'EXTERNAL_SAAS_LMS');
  const members = () => Object.values(S().users).filter(x => {
    if (x.role === 'owner' || x.id === 'owner') return false;
    if (isEmp && getUserOu(x) !== 'external') return false;
    return true;
  });
  const name = (id) => (S().users[id] || {}).name || id;

  const SECURITY_GROUPS = [
    { id: 'EXTERNAL_SAAS_LMS',     ou: 'external', label: 'External · SaaS & LMS Subscribers (Default)', desc: 'Scoped strictly to SaaS Apps & LMS (3/9 default apps) + PCI Payment Submission.' },
    { id: 'EXTERNAL_FULL_CLIENT',  ou: 'external', label: 'External · Turnkey Enterprise Client',        desc: 'SaaS Apps & LMS + Agile Board + Curated Resources + SCORM Academy + Invoicing.' },
    { id: 'INTERNAL_ANALYST',      ou: 'internal', label: 'Internal · Operations & Cyber Analyst',       desc: 'Internal staff access to Agile Board, Contract Radar, Compliance, Academy & Apps.' },
    { id: 'INTERNAL_OPERATIONS',   ou: 'internal', label: 'Internal · Full Operations Officer',          desc: 'All 10 Workspace Views & all 9 SCORM / SaaS Applications (Non-Admin).' }
  ];
  const visibleSecurityGroups = () => isEmp ? SECURITY_GROUPS.filter(g => g.ou === 'external') : SECURITY_GROUPS;

  function ensureSelectedUser(list) {
    if (selectedUserId && S().users[selectedUserId] && S().users[selectedUserId].role !== 'owner') {
      if (!isEmp || getUserOu(S().users[selectedUserId]) === 'external') {
        return S().users[selectedUserId];
      }
    }
    const first = (list && list[0]) || members()[0] || null;
    selectedUserId = first ? first.id : '';
    return first;
  }

  function renderNewUserModal() {
    if (!showNewUserDrawer) return '';
    const resCatalog = getResourcesList();
    return '<div id="admNewUserDrawer" style="padding:14px 16px;background:rgba(4,8,20,0.95);border-bottom:1px solid rgba(197,179,88,0.45)">' +
      '<div class="row" style="margin-bottom:10px">' +
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
          '<strong>Guided Directory User Provisioning' + (isEmp ? ' (Client Scope)' : '') + '</strong>' +
          '<span id="admRegSecurityBadge" style="font-size:11px;color:#34d399;font-weight:600">Username, Password, Recovery &amp; Phone Enforced</span>' +
        '</div>' +
        '<button type="button" class="btn" id="btnCloseNewUser" style="padding:4px 10px;font-size:11.5px">Close</button>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:8px;align-items:center;margin-bottom:10px">' +
        '<input id="admRegUsername" placeholder="Username (Required · 4-32 chars)" style="padding:7px 10px;font-size:12px">' +
        '<input id="admRegPass" type="password" placeholder="Password (8+ Upper/Lower/#/Sym)" style="padding:7px 10px;font-size:12px">' +
        '<input id="admRegName" placeholder="Full Name (Required)" style="padding:7px 10px;font-size:12px">' +
        '<input id="admRegEmail" placeholder="Logon Email / UPN (Required)" style="padding:7px 10px;font-size:12px">' +
        '<input id="admRegRecoveryEmail" placeholder="Recovery Email (Required)" style="padding:7px 10px;font-size:12px">' +
        '<input id="admRegPhone" placeholder="Phone Number (Required)" style="padding:7px 10px;font-size:12px">' +
        '<input id="admRegOrg" placeholder="Organization / Dept" style="padding:7px 10px;font-size:12px">' +
        '<select id="admRegOu" style="padding:7px 10px;font-size:12px">' +
          '<option value="external">OU=External (Client · Address Optional)</option>' +
          (isOwner ? '<option value="internal">OU=Internal (Employee · Address Required)</option>' : '') +
        '</select>' +
        '<select id="admRegProvider" style="padding:7px 10px;font-size:12px"><option value="password">Password + UPN</option><option value="google">Google OIDC</option><option value="microsoft">Microsoft Entra</option><option value="apple">Apple OIDC</option></select>' +
        '<select id="admRegInterest" style="padding:7px 10px;font-size:12px"><option value="ai-web">Turnkey SaaS</option><option value="federal">Federal SDVOSB</option><option value="cyber">Zero-Trust Cyber</option><option value="training">SCORM Academy</option></select>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:center;margin-bottom:10px;padding:8px 10px;border-radius:8px;background:rgba(15,23,42,0.75);border:1px solid rgba(148,163,184,0.2)">' +
        '<span id="admRegAddressLabel" style="font-size:11px;font-weight:600;color:#cbd5e1">Physical Address (Optional for Clients):</span>' +
        '<input id="admRegStreet" placeholder="Street Address" style="padding:6px 9px;font-size:12px">' +
        '<input id="admRegCity" placeholder="City" style="padding:6px 9px;font-size:12px">' +
        '<input id="admRegState" placeholder="State / Region" style="padding:6px 9px;font-size:12px">' +
        '<input id="admRegZip" placeholder="Postal / ZIP Code" style="padding:6px 9px;font-size:12px">' +
        '<button class="btn pri" id="admRegGo" type="button" style="padding:7px 12px;font-size:12px;justify-content:center">Create Directory User</button>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:8px;border-top:1px solid rgba(148,163,184,0.16)">' +
        '<span style="font-size:11px;font-weight:600;color:#fde047;text-transform:uppercase;letter-spacing:.04em">Note Qualified Resources at Onboarding (Includes Milton UI/UX + Fast-Track):</span>' +
        resCatalog.map(r =>
          '<label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#e2e8f0;cursor:pointer;padding:4px 10px;border-radius:8px;background:rgba(15,23,42,0.85);border:1px solid rgba(197,179,88,0.35)">' +
            '<input type="checkbox" data-onboard-res="' + esc(r.id) + '">' +
            '<span><b>' + esc(r.title) + '</b> <small style="color:#93c5fd">(Resource + Milton UI/UX &amp; AI Tools)</small></span>' +
          '</label>'
        ).join('') +
      '</div>' +
    '</div>';
  }

  function renderUsersDirectoryView() {
    const cols = W.CATALOG.filter(c => !isEmp || c.id !== 'finance');
    const apps = W.APPS_CATALOG || [];
    const resCatalog = getResourcesList();
    const allM = members();
    const filtered = allM.filter(u => {
      if (ouFilter !== 'all' && getUserOu(u) !== ouFilter) return false;
      if (groupFilter !== 'all' && getUserGroup(u) !== groupFilter) return false;
      if (statusFilter !== 'all' && (u.status || 'active') !== statusFilter) return false;
      if (appFilter !== 'all' && !W.can(u, 'app', appFilter, 'view')) return false;
      if (resourceFilter !== 'all' && !W.can(u, 'resource', resourceFilter, 'view')) return false;
      if (!searchQuery) return true;
      const q = searchQuery.toLowerCase();
      return String(u.name || '').toLowerCase().includes(q) ||
             String(u.email || '').toLowerCase().includes(q) ||
             String(u.username || '').toLowerCase().includes(q) ||
             String(u.org || '').toLowerCase().includes(q);
    });
    const sel = ensureSelectedUser(filtered);
    const colSpan = isOwner ? 7 : 6;
    const activeAdvFilterCount = [ouFilter !== 'all' && !isEmp, groupFilter !== 'all', statusFilter !== 'all', appFilter !== 'all', resourceFilter !== 'all'].filter(Boolean).length;

    return '<div class="ad-center">' +
      '<div class="ad-toolbar" style="flex-direction:column;align-items:stretch;gap:10px">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">' +
          '<div style="display:flex;align-items:center;gap:10px;flex:1;min-width:220px">' +
            '<span style="font-size:13px;font-weight:600;color:#fff">' +
              (isEmp ? 'Client Directory (OU=External)' : (ouFilter === 'internal' ? 'OU=Internal Users' : ouFilter === 'external' ? 'OU=External Users' : 'All Directory Users')) +
              ' (' + filtered.length + ')' +
            '</span>' +
            '<input id="adSearchInput" type="search" value="' + esc(searchQuery) + '" placeholder="Search name, email, username, group, or org..." style="flex:1;max-width:310px;padding:7px 11px;font-size:12.5px">' +
          '</div>' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">' +
            '<button type="button" class="btn ' + ((showAdvancedFilters || activeAdvFilterCount > 0) ? 'pri' : '') + '" id="btnToggleAdvFilters" style="padding:6px 11px;font-size:12px">Filters' + (activeAdvFilterCount > 0 ? ' (' + activeAdvFilterCount + ')' : '') + '</button>' +
            (isOwner ? '<button type="button" class="btn" id="btnOpenTrustSecMatrix" style="padding:6px 11px;font-size:12px;border-color:rgba(197,179,88,0.45);color:#fde047">Access Matrix</button>' : '') +
            '<button type="button" class="btn pri" id="btnToggleNewUser" style="padding:6px 11px;font-size:12px">' + (isEmp ? 'New Client' : 'New User') + '</button>' +
            '<div class="wgw-dropdown">' +
              '<button type="button" class="btn wgw-trigger" aria-expanded="false" aria-controls="adBulkMenu" style="padding:6px 11px;font-size:12px">Quick Actions <span class="wgw-caret" aria-hidden="true"></span></button>' +
              '<div class="wgw-menu" id="adBulkMenu" role="region" aria-label="Directory Quick Actions" style="right:0;left:auto;min-width:220px">' +
                '<div class="wgw-menu-hdr">Selected Object Policy</div>' +
                (sel ? '<button type="button" class="wgw-item" data-preset="' + esc(sel.id) + '|grant_all_features" style="width:100%;text-align:left;background:transparent;border:0;cursor:pointer"><span>Grant Eligible Views &amp; Apps</span><small>Unlock client/staff modules</small></button>' : '') +
                (sel ? '<button type="button" class="wgw-item" data-preset="' + esc(sel.id) + '|reset_saas_only" style="width:100%;text-align:left;background:transparent;border:0;cursor:pointer"><span>Reset to SaaS &amp; LMS Only</span><small>Default least-privilege</small></button>' : '') +
                '<div class="wgw-menu-hdr">Workspace Layout</div>' +
                '<button type="button" class="wgw-item" id="btnQuickToggleTree" style="width:100%;text-align:left;background:transparent;border:0;cursor:pointer"><span>' + (treeCollapsed ? 'Expand Directory Tree' : 'Collapse Directory Tree') + '</span></button>' +
                '<button type="button" class="wgw-item" id="btnQuickToggleInspector" style="width:100%;text-align:left;background:transparent;border:0;cursor:pointer"><span>' + (inspectorHidden ? 'Show Object Inspector' : 'Hide Object Inspector') + '</span></button>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div id="adProgressiveFilterBar" style="display:' + ((showAdvancedFilters || activeAdvFilterCount > 0) ? 'grid' : 'none') + ';grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;align-items:center;padding-top:8px;border-top:1px solid rgba(148,163,184,0.16)">' +
          (isOwner
            ? '<select id="adOuDropdown" aria-label="Filter by Organizational Unit" style="padding:6px 9px;font-size:12px">' +
                '<option value="all"' + (ouFilter === 'all' ? ' selected' : '') + '>All Organizational Units</option>' +
                '<option value="external"' + (ouFilter === 'external' ? ' selected' : '') + '>OU=External (Clients)</option>' +
                '<option value="internal"' + (ouFilter === 'internal' ? ' selected' : '') + '>OU=Internal (Staff)</option>' +
              '</select>'
            : '<div style="font-size:11.5px;color:#cbd5e1;padding:6px 9px">Scope: OU=External (Clients Only)</div>') +
          '<select id="adGroupFilter" aria-label="Filter by Security Group" style="padding:6px 9px;font-size:12px">' +
            '<option value="all"' + (groupFilter === 'all' ? ' selected' : '') + '>All Security Groups</option>' +
            visibleSecurityGroups().map(g => '<option value="' + esc(g.id) + '"' + (groupFilter === g.id ? ' selected' : '') + '>' + esc(g.id) + '</option>').join('') +
          '</select>' +
          '<select id="adStatusFilter" aria-label="Filter by Account Status" style="padding:6px 9px;font-size:12px">' +
            '<option value="all"' + (statusFilter === 'all' ? ' selected' : '') + '>All Account Statuses</option>' +
            '<option value="active"' + (statusFilter === 'active' ? ' selected' : '') + '>Status: Active</option>' +
            '<option value="requested"' + (statusFilter === 'requested' ? ' selected' : '') + '>Status: Pending Approval</option>' +
            '<option value="suspended"' + (statusFilter === 'suspended' ? ' selected' : '') + '>Status: Suspended</option>' +
          '</select>' +
          '<select id="adAppFilter" aria-label="Filter by Application Entitlement" style="padding:6px 9px;font-size:12px">' +
            '<option value="all"' + (appFilter === 'all' ? ' selected' : '') + '>All Application Entitlements</option>' +
            apps.map(a => '<option value="' + esc(a.id) + '"' + (appFilter === a.id ? ' selected' : '') + '>App: ' + esc(a.title) + '</option>').join('') +
          '</select>' +
          '<select id="adResourceFilter" aria-label="Filter by Qualified Resource" style="padding:6px 9px;font-size:12px">' +
            '<option value="all"' + (resourceFilter === 'all' ? ' selected' : '') + '>All Qualified Resources</option>' +
            resCatalog.map(r => '<option value="' + esc(r.id) + '"' + (resourceFilter === r.id ? ' selected' : '') + '>Resource: ' + esc(r.title) + '</option>').join('') +
          '</select>' +
        '</div>' +
      '</div>' +
      renderNewUserModal() +
      '<div class="ad-table-wrap">' +
        '<table class="ad-table">' +
          '<thead><tr>' +
            '<th>Object Name</th>' +
            '<th>Logon Name (UPN)</th>' +
            '<th>Scope</th>' +
            '<th>Views</th>' +
            '<th>Apps</th>' +
            '<th>Resources</th>' +

  function bind() {

        const val = inp ? inp.value.trim() : '';
        adminSmlTarget = sel ? sel.value : 'all';
        if (!val) return;
        adminSmlPrompt = val;
        try {
          const r = await fetch('/api/admin/sml', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: val, targetAgent: adminSmlTarget })
          });
          const d = await r.json();
          if (d && d.ok) {
            adminSmlOutput = d;
            W.toast('Sovereign SML updated ' + (d.updatedAgents || []).join(', '));
          }

        render();
      };
    }
    app.querySelectorAll('[data-sentinel-step]').forEach(btn => {

          sentinelSpeech = 'Viewing open client consultations and account requests.';

        const ouVal = isEmp ? 'external' : document.getElementById('propUserOu').value;
        const grpVal = document.getElementById('propUserGroup').value;
        W.setUserDirectoryProfile({ userId: selectedUserId, ou: ouVal, securityGroup: grpVal, applyGroupPolicy: true });
        W.toast('Applied ' + grpVal + ' (' + ouVal.toUpperCase() + ') to ' + name(selectedUserId));
        render();
      };
    }

    const btnSaveAcct = document.getElementById('btnSaveAccountProfile');
    if (btnSaveAcct && selectedUserId) {
      btnSaveAcct.onclick = () => {
        const targetObj = S().users[selectedUserId] || {};
        const targetOu = getUserOu(targetObj);
        const username = (document.getElementById('propUsername').value || '').trim().toLowerCase();
        const recoveryEmail = (document.getElementById('propRecoveryEmail') && document.getElementById('propRecoveryEmail').value || '').trim().toLowerCase();
        const phone = (document.getElementById('propPhone') && document.getElementById('propPhone').value || '').trim();
        const org = (document.getElementById('propOrg').value || '').trim();
        const status = document.getElementById('propStatus').value;
        const address = {
          streetAddress: (document.getElementById('propStreet') && document.getElementById('propStreet').value || '').trim(),
          city: (document.getElementById('propCity') && document.getElementById('propCity').value || '').trim(),
          stateRegion: (document.getElementById('propState') && document.getElementById('propState').value || '').trim(),
          postalCode: (document.getElementById('propZip') && document.getElementById('propZip').value || '').trim()
        };
        if (W.validateUsernameStandard) {
          const unChk = W.validateUsernameStandard(username, selectedUserId);
          if (!unChk.ok) { W.toast(unChk.error); return; }
        } else if (!username) {
          W.toast('Username is mandatory.'); return;
        }
        if (recoveryEmail && !/^\S+@\S+\.\S+$/.test(recoveryEmail)) {
          W.toast('Enter a valid Recovery Email address.'); return;
        }
        if (phone && W.validatePhoneStandard && !W.validatePhoneStandard(phone).ok) {
          W.toast('Enter a valid 10–15 digit phone number.'); return;
        }
        if (targetOu === 'internal' && (!address.streetAddress || !address.city || !address.stateRegion || !address.postalCode)) {
          W.toast('Employee (OU=Internal) accounts require a complete physical address.'); return;
        }
        const res = W.setUserDirectoryProfile({ userId: selectedUserId, username, recoveryEmail, phone, address, org, status });
        if (res && res.error) { W.toast(res.error); return; }
        W.toast('Saved Account, Recovery, Phone & Address for ' + name(selectedUserId));
        render();
      };
    }

    const btnResetPass = document.getElementById('btnResetUserPass');
    if (btnResetPass && selectedUserId) {
      btnResetPass.onclick = () => {
        const targetObj = S().users[selectedUserId] || {};
        const np = (document.getElementById('propNewPass').value || '').trim();
        if (W.validatePasswordStandard) {
          const pwChk = W.validatePasswordStandard(np, targetObj.username || '');
          if (!pwChk.ok) { W.toast(pwChk.error); return; }
        } else if (!np || np.length < 8) {
          W.toast('Password must be 8+ characters with upper, lower, number, and symbol.'); return;
        }
        W.setUserPassword(selectedUserId, np);
        W.toast('Password reset for ' + name(selectedUserId));
        document.getElementById('propNewPass').value = '';
      };
    }

    const admSavePassBtn = document.getElementById('admSavePassBtn');
    if (admSavePassBtn && isOwner) {
      admSavePassBtn.onclick = () => {
        const un = (document.getElementById('admUsernameInput') && document.getElementById('admUsernameInput').value || 'malik.khabir').trim();
        const np = (document.getElementById('admNewPassInput').value || '').trim();
        if (!np || np.length < 8) { W.toast('Administrator password must be at least 8 characters and non-generic'); return; }
        W.postServerAction({ action: 'updateAdminPassword', username: un, newPassword: np });
        W.toast('Administrator username & case-sensitive password updated');
        document.getElementById('admNewPassInput').value = '';
      };
    }

    const btnSavePci = document.getElementById('btnSavePciGateway');
    if (btnSavePci && isOwner) {
      btnSavePci.onclick = () => {
        const activeProcessor = document.getElementById('pciActiveProcessor').value;
        const stripePublishableKey = document.getElementById('pciStripePk').value.trim();
        const authorizeNetClientKey = document.getElementById('pciAuthNetKey').value.trim();
        W.savePciGatewayConfig({ activeProcessor, stripePublishableKey, authorizeNetClientKey });
        W.toast('Saved PCI-DSS Gateway Configuration (' + activeProcessor + ')');
        render();
      };
    }

    const admRegGo = document.getElementById('admRegGo');
    if (admRegGo) {
      admRegGo.onclick = () => {
        const un = (document.getElementById('admRegUsername') && document.getElementById('admRegUsername').value || '').trim().toLowerCase();
        const pw = (document.getElementById('admRegPass') && document.getElementById('admRegPass').value || '').trim();
        const n = document.getElementById('admRegName').value.trim();
        const em = document.getElementById('admRegEmail').value.trim().toLowerCase();
        const recEm = (document.getElementById('admRegRecoveryEmail') && document.getElementById('admRegRecoveryEmail').value || '').trim().toLowerCase();
        const ph = (document.getElementById('admRegPhone') && document.getElementById('admRegPhone').value || '').trim();
        const org = document.getElementById('admRegOrg').value.trim();
        const ou = isEmp ? 'external' : ((document.getElementById('admRegOu') && document.getElementById('admRegOu').value) || 'external');
        const prov = document.getElementById('admRegProvider').value;
        const intr = document.getElementById('admRegInterest').value;
        const address = {
          streetAddress: (document.getElementById('admRegStreet') && document.getElementById('admRegStreet').value || '').trim(),
          city: (document.getElementById('admRegCity') && document.getElementById('admRegCity').value || '').trim(),
          stateRegion: (document.getElementById('admRegState') && document.getElementById('admRegState').value || '').trim(),
          postalCode: (document.getElementById('admRegZip') && document.getElementById('admRegZip').value || '').trim()
        };
        const qualifiedResources = Array.from(app.querySelectorAll('[data-onboard-res]:checked')).map(cb => cb.getAttribute('data-onboard-res'));

        if (W.validateUsernameStandard) {
          const unChk = W.validateUsernameStandard(un);
          if (!unChk.ok) { W.toast(unChk.error); return; }
        } else if (!un) {
          W.toast('Username is mandatory.'); return;
        }
        if (W.validatePasswordStandard) {
          const pwChk = W.validatePasswordStandard(pw, un);
          if (!pwChk.ok) { W.toast(pwChk.error); return; }
        } else if (!pw || pw.length < 8) {
          W.toast('Password must meet security standards (8+ chars, upper, lower, number, symbol).'); return;
        }
        if (!n || !/^\S+@\S+\.\S+$/.test(em)) { W.toast('Enter valid Full Name & Logon Email'); return; }
        if (!recEm || !/^\S+@\S+\.\S+$/.test(recEm)) { W.toast('Recovery Email is mandatory.'); return; }
        if (!ph || (W.validatePhoneStandard && !W.validatePhoneStandard(ph).ok)) { W.toast('Valid 10–15 digit Phone Number is mandatory.'); return; }
        if (ou === 'internal' && (!address.streetAddress || !address.city || !address.stateRegion || !address.postalCode)) {
          W.toast('Employee (OU=Internal) accounts require a complete physical address (Street, City, State, ZIP).'); return;
        }

        const newId = W.submitRequest({
          guidedRegistration: true,
          name: n,
          email: em,
          username: un,
          password: pw,
          recoveryEmail: recEm,
          phone: ph,
          address,
          org: org || (ou === 'internal' ? 'MGC Internal Operations' : 'External Partner'),
          ou,
          securityGroup: ou === 'internal' ? 'INTERNAL_ANALYST' : 'EXTERNAL_SAAS_LMS',
          ssoProvider: prov,
          interest: intr,
          qualifiedResources,
          brand: 'FIX',
          ndaAccepted: true,
          mfaVerified: true
        });
        if (!newId) { W.toast((W.lastIntakeResult && W.lastIntakeResult.error) || 'Could not create object'); return; }
        selectedUserId = newId;
        showNewUserDrawer = false;
        W.toast('Created ' + n + ' (' + un + ') in OU=' + ou.toUpperCase());
        render();
      };
    }

    const accEntitySel = document.getElementById('accEntitySelect');
    if (accEntitySel && isOwner) {
      accEntitySel.onchange = () => {
        accEntityFilter = accEntitySel.value;
        render();
      };
    }

    const btnPostAcc = document.getElementById('btnPostAccEntry');
    if (btnPostAcc && isOwner) {
      btnPostAcc.onclick = () => {
        const entity = document.getElementById('accPostEntity').value;
        const entryType = document.getElementById('accPostType').value;
        const accountCode = document.getElementById('accPostAccount').value;
        const rail = document.getElementById('accPostRail').value;
        const grossAmount = Number(document.getElementById('accPostAmount').value || 0);
        const clientName = (document.getElementById('accPostCounterparty').value || '').trim();
        const memo = (document.getElementById('accPostDesc').value || '').trim();
        if (!grossAmount || grossAmount <= 0) {
          W.toast('Enter a valid positive amount ($)');
          return;
        }
        W.postAccountingEntry({
          entity,
          entryType,
          accountCode,
          rail,
          grossUsd: grossAmount,
          grossAmount,
          counterparty: clientName || (entity === 'MGC' ? 'Federal / Commercial Counterparty' : 'F.I.X SaaS Counterparty'),
          clientName: clientName || (entity === 'MGC' ? 'Federal / Commercial Counterparty' : 'F.I.X SaaS Counterparty'),
          description: memo || (entryType + ' via ' + rail),
          memo: memo || (entryType + ' via ' + rail),
          status: entryType === 'INVOICE_AR' ? 'ISSUED' : 'SETTLED',
          reconciledStatus: entryType === 'INVOICE_AR' ? 'ISSUED' : 'SETTLED'
        });
        W.toast('Posted balanced Double-Entry Journal (' + entity + ' • $' + grossAmount.toFixed(2) + ')');
        render();
      };
    }

    app.querySelectorAll('[data-reconcile-journal]').forEach(selEl => {
      selEl.onchange = () => {
        const jid = selEl.getAttribute('data-reconcile-journal');
        W.reconcileAccountingEntry(jid, selEl.value);
        W.toast('Updated reconciliation status for ' + jid + ' to ' + selEl.value);
        render();
      };
    });

    app.querySelectorAll('[data-consult-status]').forEach(selEl => {
      selEl.onchange = () => {
        const cid = selEl.getAttribute('data-consult-status');
        W.updateConsultationStatus(cid, selEl.value);
        W.toast('Consultation status updated to ' + selEl.value.toUpperCase());
        render();
      };
    });

    app.querySelectorAll('[data-ap]').forEach(b => b.onclick = () => { W.approve(b.dataset.ap); W.toast('Approved'); render(); });
    app.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => { W.deny(b.dataset.dn); render(); });
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (showNewUserDrawer) { showNewUserDrawer = false; render(); }
      else if (!inspectorHidden) { inspectorHidden = true; render(); }
    }
  });

  render();
})();
</script>
</body>
</html>
