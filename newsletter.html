  <style>
    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: nlOut 0.24s cubic-bezier(0.22, 1, 0.36, 1) both; }
    ::view-transition-new(root) { animation: nlIn 0.32s cubic-bezier(0.22, 1, 0.36, 1) both; }
    @keyframes nlOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-6px); } }
    @keyframes nlIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .nl-grid { display: grid; grid-template-columns: 390px 1fr; gap: 20px; align-items: start; }
    @media (max-width: 900px) { .nl-grid { grid-template-columns: 1fr; } }
    .issue-card {
      background: rgba(9, 16, 32, 0.96);
      border: 1.5px solid rgba(148, 163, 184, 0.32);
      border-radius: 18px;
      padding: 20px 22px;
      margin-bottom: 14px;
      transition: transform 0.22s ease, border-color 0.22s ease;
    }
    .issue-card:hover {
      transform: translateY(-2px);
      border-color: rgba(96, 165, 250, 0.6);
    }
    #nlConsultationForm input,
    #nlConsultationForm select,
    #nlConsultationForm textarea {
      width: 100%;
      box-sizing: border-box;
    }
    @keyframes mgcVerticalNewsScroll {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(0, -50%, 0); }
    }
    @keyframes mgcLiveDotPing {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.45); opacity: 0.45; }
    }
    .mgc-live-stream-shell {
      background: linear-gradient(180deg, rgba(8, 15, 30, 0.96), rgba(5, 10, 22, 0.98));
      border: 1.5px solid rgba(197, 179, 88, 0.42);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.65);
      position: relative;
    }
    .mgc-vertical-viewport {
      height: 760px;
      overflow: hidden;
      position: relative;
      padding: 16px 18px;
      mask-image: linear-gradient(180deg, transparent 0%, #000 3.5%, #000 96.5%, transparent 100%);
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 3.5%, #000 96.5%, transparent 100%);
    }
    .mgc-vertical-track {
      display: flex;
      flex-direction: column;
      gap: 14px;
      will-change: transform;
      animation: mgcVerticalNewsScroll 72s linear infinite;
    }
    .mgc-vertical-viewport:hover .mgc-vertical-track,
    .mgc-vertical-track[data-stream-paused="true"] {
      animation-play-state: paused !important;
    }
    @media (prefers-reduced-motion: reduce) {
      .mgc-vertical-track { animation: none !important; }
      .mgc-vertical-viewport { height: auto; max-height: 760px; overflow-y: auto; mask-image: none; -webkit-mask-image: none; }
    }
    .mgc-live-article-card {
      background: linear-gradient(135deg, rgba(16, 28, 52, 0.95), rgba(8, 15, 30, 0.98));
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }
    .mgc-live-article-card.is-key-story {
      background: linear-gradient(135deg, rgba(19, 32, 59, 0.96), rgba(24, 21, 14, 0.95));
      border: 1.5px solid rgba(197, 179, 88, 0.68);
      box-shadow: 0 10px 28px rgba(197, 179, 88, 0.14);
    }
    .mgc-live-article-card:hover {
      transform: translateY(-2px);
      border-color: rgba(197, 179, 88, 0.95);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.8), 0 0 22px rgba(197, 179, 88, 0.22);
    }
    .mgc-broadsheet-dropcap::first-letter {
      float: left;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 3.35em;
      line-height: 0.84;
      padding-top: 4px;
      padding-right: 12px;
      padding-bottom: 2px;
      font-weight: 800;
      color: #C5B358;
    }
    /* Watched Broadsheet Paper Theme Transition System */
    #nlReaderSheet {
      --r-bg: #070d19;
      --r-surface: rgba(12, 21, 39, 0.96);
      --r-elevated: rgba(15, 25, 48, 0.92);
      --r-cell: rgba(8, 15, 30, 0.85);

      animation: nlThemeWash 0.78s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      background: radial-gradient(circle at 60% 25%, rgba(251, 247, 239, 0.9) 0%, rgba(244, 239, 228, 0.58) 55%, rgba(197, 179, 88, 0.2) 100%);

      background: radial-gradient(circle at 60% 25%, rgba(7, 13, 25, 0.92) 0%, rgba(12, 21, 39, 0.62) 55%, rgba(56, 189, 248, 0.18) 100%);

      ],

      liveStream: [
        {

          source: 'Reuters',

          title: 'Enterprise Teams Shift AI Budgets Toward Focused Task Agents and Lower Cloud Spend',
          dek: 'Technology buyers are moving past expensive general chat subscriptions in favor of lean, task specific automation that runs at near zero idle cost.',
          summary: 'Companies are moving away from expensive general chat tools and putting their money into smaller agents that handle specific daily workflows like customer intake, scheduling, and billing checks.',
          pullQuote: 'Keeping cloud costs near zero at idle and giving each agent one clear job helps staff finish work faster without bloating monthly infrastructure bills.',
          paragraphs: [
            'Companies across North America and Europe are recalibrating their software budgets, shifting capital away from sprawling, general purpose chat subscriptions and toward compact task agents built for specific daily operations. Chief information officers report that while open ended chat tools sparked initial curiosity, measurable productivity gains are coming from focused workflows that handle customer intake, appointment routing, and automated billing checks behind the scenes.',
            'A major driver of this transition is cloud cost discipline. Traditional always on inference clusters can rack up thousands of dollars in monthly overhead even when traffic is quiet. By contrast, modern scale to zero cloud architectures and lightweight task agents execute only when a customer or employee triggers an action, cutting baseline infrastructure spend by more than seventy percent while improving response speed.',

          accentColor: '#38bdf8',
          title: 'Federal Agencies Expand Fast Track Cloud and Cyber Awards for Small Veteran Contractors',
          dek: 'Streamlined procurement pathways are helping verified veteran owned engineering firms deliver secure cloud portals directly to mission teams.',
          summary: 'Acquisition offices are cutting paperwork delays so verified small businesses can deliver secure cloud portals and identity tools directly to program teams.',
          pullQuote: 'Speed and operational readiness win modern contracts. Having security controls and live working demonstrations ready before the solicitation drops puts agile teams first in line.',

            'Rather than evaluating hundred page conceptual proposals alone, contracting teams are increasingly requesting live technical demonstrations, pre configured zero trust portals, and verifiable compliance mappings during the initial review window. Service Disabled Veteran Owned Small Businesses that maintain production ready environments and clear architectural blueprints are shortening award timelines from quarters to weeks.',
            'Industry analysts note that this procurement shift rewards disciplined engineering over bureaucracy. Teams that pair battle tested operational experience with clean, self service cloud platforms are capturing both prime set aside awards and high value teaming roles across defense and civilian agencies.'
          ],
          impactMetrics: {
            costImpact: 'SDVOSB Set-Aside Priority',

            'Position for both direct SDVOSB sole-source/set-aside awards and prime contractor technical teaming.'
          ],
          deliverableArtifact: 'Federal Set-Aside Readiness & Teaming Brief',
          time: 'LIVE • 24m ago',
          readTime: '3 min read',
          agency: 'Federal Acquisition',
          track: 'federal',
          trackLabel: 'FEDERAL & SDVOSB',
          url: 'https://news.google.com/',
          isKeyStory: true,
          curatedBy: 'Executive Dispatch Desk'
        },
        {
          id: 'mgc-live-3',
          source: 'CISA Advisories',
          sourceCode: 'CISA',
          accentColor: '#f87171',
          title: 'CISA Directs Immediate Identity Hardening Against Session and Token Theft',
          dek: 'New federal cybersecurity directives target browser session hijacking with mandatory federated sign on, strict idle lockouts, and token binding.',
          summary: 'Federal security teams issued fresh guidance requiring verified single sign on, strict session timeouts, and hardware backed login checks across cloud portals.',
          pullQuote: 'Passwords alone are no longer a sufficient boundary. Verified federated sign in paired with automatic inactivity lockouts stops session hijacking cold.',
          paragraphs: [
            'The Cybersecurity and Infrastructure Security Agency has issued updated operational guidance directing federal agencies and critical infrastructure partners to immediately harden web portals against session token theft. Recent incident response investigations revealed that adversaries are increasingly bypassing traditional login screens by extracting active session cookies from unmanaged or idle endpoints.',
            'To neutralize the threat, security architects are enforcing verified federated authentication through trusted identity providers alongside aggressive session lifecycle controls. Key measures include short lived session tokens, automatic screen and session lockouts after brief periods of inactivity, and strict role separation between public showcase views and administrative consoles.',

          time: 'LIVE • 41m ago',
          readTime: '3 min read',
          agency: 'DHS / CISA',
          track: 'cyber',
          trackLabel: 'SECURITY & COMPLIANCE',
          url: 'https://www.cisa.gov/news-events/cybersecurity-advisories',
          isKeyStory: true,
          curatedBy: 'Executive Dispatch Desk'

          id: 'mgc-live-4',

          sourceCode: 'DSCOOP',
          accentColor: '#C5B358',
          title: 'Defense Commands Prioritize Real Time Readiness Dashboards and Automated Field Training',
          dek: 'Browser based simulation labs and SCORM telemetry are replacing static classroom slides across joint operational training commands.',
          summary: 'Operational units are adopting browser based training labs and live status boards so personnel can practice and deploy without waiting on local server installs.',
          pullQuote: 'Training and live operations belong in the same environment. When personnel can practice a technical workflow in the browser and deploy it the same day, readiness jumps immediately.',
          paragraphs: [
            'Joint training commands and operational readiness directorates are overhauling how technical personnel prepare for network, cyber, and data missions. Instead of relying on static slide decks or waiting weeks to provision dedicated classroom servers, units are rolling out browser accessible simulation studios that run on demand from any authorized workstation.',
            'These modern training environments combine hands on command line drills, network topology validation, and interactive language or analytical modules with automated SCORM 2004 completion tracking. Commanders can view real time proficiency across cohorts while individual operators receive instant diagnostic feedback on every exercise.',
            'The convergence of live operational dashboards and interactive browser labs is closing the gap between instruction and field execution. Units that train inside realistic, self contained web workspaces build muscle memory faster and maintain higher certification readiness year round.'
          ],
          impactMetrics: {
            costImpact: 'Zero Classroom Server Overhead',
            deploySpeed: 'Instant Browser Provisioning',
            readinessScore: 'SCORM 2004 4th Ed. Verified'
          },
          actionPlaybook: [
            'Break complex training curricula into 5-stage paginated browser modules to eliminate cognitive overload.',
            'Pair interactive simulation labs (network, cyber, and language acquisition) with live mastery telemetry.',
            'Export verifiable SCORM 2004 and LTI 1.3 completion packets directly to command readiness boards.'
          ],
          deliverableArtifact: 'Interactive SCORM 2004 & Readiness Lab Architecture Guide',
          time: 'LIVE • 1h ago',
          readTime: '3 min read',
          agency: 'Pentagon / DoD',
          track: 'federal',
          trackLabel: 'FEDERAL & SDVOSB',
          url: 'https://defensescoop.com/',
          isKeyStory: false,
          curatedBy: 'Executive Dispatch Desk'
        },
        {
          id: 'mgc-live-5',
          source: 'Reuters',
          sourceCode: 'REUTERS',
          accentColor: '#f97316',
          title: 'Service Businesses Adopt Automated Reception and Instant Customer Status Tracking',
          dek: 'Automotive, fleet, and commercial service operators are turning missed phone calls into booked jobs with 24/7 digital intake and live bay tracking.',
          summary: 'Independent shops and regional service providers are replacing phone tag with live digital intake forms and real time progress updates for customers.',
          pullQuote: 'Every missed phone call is lost revenue. Giving customers a single link to book, track live bay progress, and settle invoices keeps schedules full and owners focused.',
          paragraphs: [
            'Independent automotive repair centers, regional fleet operators, and commercial service businesses are rapidly modernizing their front office workflows to capture revenue that used to slip through the cracks. Industry surveys show that busy service counters miss up to thirty percent of incoming phone inquiries during peak morning and afternoon rush hours.',
            'By deploying automated digital receptionists paired with instant repair estimators and live bay status trackers, shops allow customers to describe their issue, select an available time slot, and follow their vehicle or work order in real time from their phone. Service writers spend less time repeating routine status updates over the phone and more time coordinating parts and approvals.',
            'Shop owners who have made the switch report faster turnaround times, higher average repair order values, and a noticeable jump in five star customer reviews. In a competitive local market, frictionless digital convenience has become just as important as mechanical craftsmanship.'
          ],

            costImpact: '+30% Recovered Rush-Hour Leads',

            readinessScore: '5-Star Customer Velocity'
          },
          actionPlaybook: [

            'Give every customer a live repair-order bay tracker link to eliminate status check phone tag.',

          ],
          deliverableArtifact: 'Turnkey Service Reception & Live Bay Tracker Blueprint',
          time: 'LIVE • 2h ago',
          readTime: '3 min read',
          agency: 'Commercial Ops',
          track: 'logistics',
          trackLabel: 'OPERATIONS & SUPPLY',
          url: 'https://www.reuters.com/business/',
          isKeyStory: false,
          curatedBy: 'Executive Dispatch Desk'
        }
      ]
    };

    let selectedDonationAmount = 25;
    let selectedDonationMethod = 'card';
    let activeStreamTrack = 'all';
    let streamPaused = false;
    let streamRefreshCountdown = 60;
    let lastDeliveryPacket = null;
    let activeReaderStory = null;
    let readerFontScale = 1; // 0 = 19px, 1 = 21.5px, 2 = 24.5px
    let readerPaperTheme = 'obsidian'; // 'obsidian' | 'ivory'
    let subInputDraft = { name: '', email: '', topic: 'all', smsOptIn: false, phone: '', carrier: 'tmomail.net' };
    const urlParams = new URLSearchParams(location.search);
    let settledDonationReceipt = urlParams.get('checkout_status') === 'settled' ? (urlParams.get('receipt') || '') : '';
    let showConsultationForm = location.hash === '#consultation' || urlParams.get('consultation') === '1';
    let lastConsultationReceipt = null;
    let consultationError = '';

    async function fetchNewsletter(forceRefreshStream) {
      try {
        const [rNl, rStream] = await Promise.all([
          fetch('/api/newsletter'),
          fetch('/api/newsletter/live-stream' + (forceRefreshStream ? '?refresh=1' : ''))
        ]);
        if (rNl.ok) {
          const d = await rNl.json();
          if (d && d.ok) nlState = Object.assign({}, nlState, d);
        }
        if (rStream.ok) {
          const ds = await rStream.json();
          if (ds && ds.ok && Array.isArray(ds.items) && ds.items.length) {
            nlState.liveStream = ds.items;
          }
        }
        render();
      } catch (_) {}
    }

    setInterval(() => {
      if (streamPaused) return;
      streamRefreshCountdown = streamRefreshCountdown <= 1 ? 60 : streamRefreshCountdown - 1;
      const badge = document.getElementById('mgcStreamCountdownVal');
      if (badge) badge.textContent = streamRefreshCountdown + 's';
      if (streamRefreshCountdown === 60) {
        fetchNewsletter(true);
      }
    }, 1000);

    function captureFormDrafts() {
      const elName = document.getElementById('nlName');
      const elEmail = document.getElementById('nlEmail');
      const elTopic = document.getElementById('nlTopic');
      const elSms = document.getElementById('nlSmsOptIn');
      const elPhone = document.getElementById('nlPhone');
      const elCarrier = document.getElementById('nlCarrier');
      if (elName) subInputDraft.name = elName.value;
      if (elEmail) subInputDraft.email = elEmail.value;
      if (elTopic) subInputDraft.topic = elTopic.value;
      if (elSms) subInputDraft.smsOptIn = elSms.checked;
      if (elPhone) subInputDraft.phone = elPhone.value;
      if (elCarrier) subInputDraft.carrier = elCarrier.value;

    function normalizeStoryItem(item) {
      if (!item) return null;
      const cleanSummary = String(item.summary || item.mgcSummation || '')
        .replace(/^MGC\s+(Summation|Summary):\s*/i, '')
        .trim();
      const cleanQuote = String(item.pullQuote || item.mgcComment || '')
        .replace(/^MGC\s+(Take|Summation|Summary):\s*/i, '')
        .trim();
      const paras = (Array.isArray(item.paragraphs) && item.paragraphs.length >= 2)
        ? item.paragraphs
        : [
            cleanSummary || 'Enterprise and public sector teams are accelerating cloud, security, and workflow modernization to lower overhead and improve operational speed.',
            'Across commercial operators and federal agencies alike, leaders are replacing disconnected manual processes with focused, browser accessible tools that deliver measurable results from day one.',
            cleanQuote || 'Practical execution, transparent unit economics, and verified identity controls separate high performing organizations from the rest of the field.'
          ];
      const defaultMetrics = item.track === 'cyber'
        ? { costImpact: '$0 Native Identity Hardening', deploySpeed: 'Same-Day Policy Rollout', readinessScore: '99.4% Session Protection' }
        : item.track === 'federal'
        ? { costImpact: 'SDVOSB Set-Aside Priority', deploySpeed: '2–4 Week Award Velocity', readinessScore: 'NAICS 541512 / 541519 Ready' }
        : item.track === 'logistics'
        ? { costImpact: '+30% Recovered Rush-Hour Leads', deploySpeed: 'Turnkey 48-Hour Launch', readinessScore: '5-Star Customer Velocity' }
        : { costImpact: '-72% Idle Cloud Spend', deploySpeed: 'Scale-to-Zero Serverless', readinessScore: '98% Workflow Accuracy' };
      const defaultPlaybook = (Array.isArray(item.actionPlaybook) && item.actionPlaybook.length)
        ? item.actionPlaybook
        : [
            'Audit existing software and cloud workflows to eliminate idle compute and manual bottlenecks.',
            'Deploy focused, single-purpose browser workflows with strict role-based identity verification.',
            'Track measurable unit economics and operational readiness across every team sprint.'
          ];
      return Object.assign({}, item, {
        summary: cleanSummary,
        dek: item.dek || cleanSummary,
        pullQuote: cleanQuote,
        paragraphs: paras,
        impactMetrics: item.impactMetrics || defaultMetrics,
        actionPlaybook: defaultPlaybook,
        deliverableArtifact: item.deliverableArtifact || 'Executive Dispatch & Action Playbook Packet',
        readTime: item.readTime || '3 min read'
      });
    }

    function buildStoryMarkdownDeliverable(item) {
      const st = normalizeStoryItem(item);
      if (!st) return '';
      const dateIso = new Date().toISOString().slice(0, 10);
      return [
        `# THE EXECUTIVE DISPATCH — ${st.title}`,
        ``,
        `- **Date:** ${dateIso}`,
        `- **Source Wire:** ${st.source} (${st.agency || 'Executive Desk'})`,
        `- **Intelligence Track:** ${st.trackLabel || 'EXECUTIVE BRIEFING'}`,
        `- **Deliverable Artifact:** ${st.deliverableArtifact}`,
        `- **Original Source URL:** ${st.url}`,
        ``,
        `> *${st.dek}*`,
        ``,

    function downloadDeliverableBlob(filename, mimeType, content) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 200);
    }

      }

      app.querySelectorAll('[data-story-card-id]').forEach(cardEl => {
        cardEl.onclick = (ev) => {
          if (ev.target.closest('button') || ev.target.closest('a')) return;
          openStoryReaderById(cardEl.getAttribute('data-story-card-id'), true);
        };
      });

      function triggerModalWatchedTheme(targetTheme, label) {
        readerPaperTheme = targetTheme;
        const sheet = document.getElementById('nlReaderSheet');
        const wash = document.getElementById('nlReaderThemeWash');
        const toggleBtn = document.getElementById('btnReaderThemeToggle');
        if (sheet) {
          sheet.classList.toggle('theme-ivory', targetTheme === 'ivory');
        }
        if (wash) {
          wash.className = targetTheme === 'ivory' ? 'nl-theme-wash-ivory' : 'nl-theme-wash-obsidian';
          setTimeout(() => {
            if (wash) wash.className = '';
          }, 820);
        }
        if (toggleBtn) {
          toggleBtn.textContent = targetTheme === 'ivory' ? '🌙 Obsidian Paper' : '📰 Financial Ivory';
        }
        if (label) {
          W.toast(targetTheme === 'ivory' ? `📰 Financial Ivory Paper · ${label}` : `🌙 MGC Obsidian Thematic Colors · ${label}`);
        }
      }

      app.querySelectorAll('[data-switch-reader-story]').forEach(btn => {
        btn.onclick = () => {
          openStoryReaderById(btn.getAttribute('data-switch-reader-story'), false);
        };
      });

      const btnReaderFontSm = document.getElementById('btnReaderFontSm');
      if (btnReaderFontSm) btnReaderFontSm.onclick = () => { readerFontScale = 0; render(); };
      const btnReaderFontMd = document.getElementById('btnReaderFontMd');
      if (btnReaderFontMd) btnReaderFontMd.onclick = () => { readerFontScale = 1; render(); };
      const btnReaderFontLg = document.getElementById('btnReaderFontLg');
      if (btnReaderFontLg) btnReaderFontLg.onclick = () => { readerFontScale = 2; render(); };
      const btnReaderThemeToggle = document.getElementById('btnReaderThemeToggle');
      if (btnReaderThemeToggle) {
        btnReaderThemeToggle.onclick = () => {
          const nextTheme = readerPaperTheme === 'ivory' ? 'obsidian' : 'ivory';
          triggerModalWatchedTheme(nextTheme, 'Reader Theme Switch');
        };
      }
      const btnDetachReaderWindow = document.getElementById('btnDetachReaderWindow');
      if (btnDetachReaderWindow && activeReaderStory) {
        btnDetachReaderWindow.onclick = () => openStoryPopoutWindow(activeReaderStory);
      }
      const btnCloseReaderModal = document.getElementById('btnCloseReaderModal');
      if (btnCloseReaderModal) {
        btnCloseReaderModal.onclick = () => {
          activeReaderStory = null;
          streamPaused = false;
          render();
        };
      }
      const nlReaderPopoutBackdrop = document.getElementById('nlReaderPopoutBackdrop');
      if (nlReaderPopoutBackdrop) {
        nlReaderPopoutBackdrop.onclick = (ev) => {
          if (ev.target === nlReaderPopoutBackdrop) {
            activeReaderStory = null;
            streamPaused = false;
            render();
          }
        };
      }

      const btnPauseStream = document.getElementById('btnToggleStreamPause');
      if (btnPauseStream) {
        btnPauseStream.onclick = () => {
          streamPaused = !streamPaused;
          render();
        };
      }

      const btnRefreshStream = document.getElementById('btnRefreshLiveStream');
      if (btnRefreshStream) {
        btnRefreshStream.onclick = () => {
          streamRefreshCountdown = 60;
          W.toast('Refreshing Reuters & Google News AI Stream...');
          fetchNewsletter(true);
        };
      }

      app.querySelectorAll('[data-stream-track]').forEach(btn => {
        btn.onclick = () => {
          activeStreamTrack = btn.dataset.streamTrack || 'all';
          subInputDraft.topic = activeStreamTrack;
          render();
        };
      });

      const nlTopicSelect = document.getElementById('nlTopic');
      if (nlTopicSelect) {
        nlTopicSelect.onchange = () => {
          subInputDraft.topic = nlTopicSelect.value || 'all';
          activeStreamTrack = subInputDraft.topic;
          render();
        };
      }

      app.querySelectorAll('[data-deliver-single]').forEach(btn => {
        btn.onclick = (ev) => {
          ev.stopPropagation();
          const emailInput = document.getElementById('nlEmail');
          if (emailInput && !emailInput.value.trim()) {
            emailInput.focus();
            W.toast('Enter your email on the left to deliver this briefing');
            return;
          }
          const subFormEl = document.getElementById('nlSubForm');
          if (subFormEl) subFormEl.requestSubmit();
        };
      });

      const btnCopyDigest = document.getElementById('btnCopyDeliveredDigest');
      if (btnCopyDigest && lastDeliveryPacket) {
        btnCopyDigest.onclick = async () => {
          try {
            await navigator.clipboard.writeText(lastDeliveryPacket.plainTextDigest || '');
            W.toast('Copied Full Briefing Digest to Clipboard');
          } catch (_) {
            W.toast('Digest Ready (' + lastDeliveryPacket.receiptId + ')');
          }
        };
      }

      function launchPopoutConsultationWindow() {
        try {
          const targetUrl = location.protocol === 'file:' ? 'consultation.html' : '/consultation';
          window.open(targetUrl, 'MGCConsultationFormPopout', 'popup=yes,width=880,height=840,left=200,top=70,resizable=yes,scrollbars=yes');
        } catch (_) {}
      }

      document.querySelectorAll('[data-open-nl-consultation]').forEach(btn => {
        btn.onclick = (ev) => {
          if (ev) ev.preventDefault();
          launchPopoutConsultationWindow();
          showConsultationForm = true;
          consultationError = '';
          render();
        };
      });

      const btnOpenPopoutWin = document.getElementById('btnOpenConsultationPopoutWindow');
      if (btnOpenPopoutWin) {
        btnOpenPopoutWin.onclick = () => launchPopoutConsultationWindow();
      }

      const nlBackdrop = document.getElementById('nlConsultationBackdrop');
      if (nlBackdrop) {
        nlBackdrop.addEventListener('click', (ev) => {
          if (ev.target === nlBackdrop) {
            showConsultationForm = false;
            consultationError = '';
            render();
          }
        });
      }

      const btnCloseCons = document.getElementById('btnCloseNlConsultation');
      if (btnCloseCons) {
        btnCloseCons.onclick = () => {
          showConsultationForm = false;
          consultationError = '';
          render();
        };
      }

      const nlConsForm = document.getElementById('nlConsultationForm');
      if (nlConsForm) {
        nlConsForm.onsubmit = async (ev) => {
          ev.preventDefault();
          consultationError = '';
          const payload = {
            clientName: document.getElementById('reqClientName').value.trim(),
            clientEmail: document.getElementById('reqClientEmail').value.trim(),
            organization: document.getElementById('reqOrganization').value.trim(),
            roleTitle: document.getElementById('reqRoleTitle') ? document.getElementById('reqRoleTitle').value.trim() : '',
            scaleTier: document.getElementById('reqScaleTier') ? document.getElementById('reqScaleTier').value : 'Growth (Up to 25 Users)',
            phone: document.getElementById('reqPhone').value.trim(),
            architectureScope: document.getElementById('reqScope').value,
            consultationFormat: document.getElementById('reqFormat') ? document.getElementById('reqFormat').value : 'Video Briefing & Screen Share',
            timeline: document.getElementById('reqTimeline').value,
            preferredWindow: document.getElementById('reqPreferredWindow') ? document.getElementById('reqPreferredWindow').value : 'Next Available Executive Slot',
            integrationEnv: document.getElementById('reqIntegrationEnv') ? document.getElementById('reqIntegrationEnv').value : 'Google Cloud / Workspace',
            projectBrief: document.getElementById('reqBrief').value.trim()
          };
          if (!payload.clientName || !/^\S+@\S+\.\S+$/.test(payload.clientEmail)) {
            consultationError = 'Please provide your Full Name and a valid Email Address.';
            render();
            return;
          }
          if (W.hasInjectionPayload && W.hasInjectionPayload(payload)) {
            consultationError = 'Invalid characters detected in submission fields.';
            render();
            return;
          }
          try {
            const r = await fetch('/api/newsletter/consultation', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            const d = await r.json();
            if (d && d.ok && d.consultation) {
              lastConsultationReceipt = d.consultation;
              W.toast('Request Submitted (' + d.receiptId + ')');
              render();
              return;
            }
            consultationError = (d && d.error) || 'Could not submit request.';
            render();
          } catch (_) {
            lastConsultationReceipt = {
              receiptId: 'MGC-REQ-' + Date.now().toString(36).toUpperCase().slice(-5),
              clientName: payload.clientName,
              clientEmail: payload.clientEmail,
              architectureScope: payload.architectureScope,
              timeline: payload.timeline
            };
            W.toast('Request Submitted (' + lastConsultationReceipt.receiptId + ')');
            render();
          }
        };
      }

      app.querySelectorAll('[data-donate-amt]').forEach(btn => {
        btn.onclick = () => {
          selectedDonationAmount = Number(btn.dataset.donateAmt) || 25;
          const inp = document.getElementById('donAmount');
          if (inp) inp.value = String(selectedDonationAmount);
          render();
        };
      });

      app.querySelectorAll('[data-donate-method]').forEach(btn => {
        btn.onclick = () => {
          selectedDonationMethod = btn.dataset.donateMethod || 'card';
          const sel = document.getElementById('donMethod');
          if (sel) sel.value = selectedDonationMethod;
          render();
        };
      });

      const donMethodSelect = document.getElementById('donMethod');
      if (donMethodSelect) {
        donMethodSelect.onchange = () => {
          selectedDonationMethod = donMethodSelect.value || 'card';
          render();
        };
      }

      const donForm = document.getElementById('nlDonateForm');
      if (donForm) {
        donForm.onsubmit = async (e) => {
          e.preventDefault();
          const donorName = document.getElementById('donName').value.trim() || 'Community Supporter';
          const donorEmail = document.getElementById('donEmail').value.trim() || 'supporter@miltongroupsecurity.org';
          const amountUsd = Math.max(1, Number(document.getElementById('donAmount').value) || selectedDonationAmount);
          const method = document.getElementById('donMethod') ? document.getElementById('donMethod').value : selectedDonationMethod;
          const st = document.getElementById('nlDonStatus');
          const railNames = {
            card: 'Stripe Hosted Card Checkout',
            cashapp: 'Cash App Pay Checkout',
            wallet: 'Apple Pay / Google Pay Checkout'
          };
          st.style.color = '#38bdf8';
          st.textContent = '⟳ Routing $' + amountUsd.toFixed(2) + ' to ' + (railNames[method] || 'Payment Processor') + '...';

          try {
            const r = await fetch('/api/checkout/session', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                type: 'donation',
                merchantEntity: 'MGC',
                title: 'SDVOSB Initiatives & Community Support',
                donorName,
                donorEmail,
                amountUsd,
                method,
                returnPath: '/newsletter'
              })
            });
            const d = await r.json();
            if (d && d.ok && d.checkoutUrl) {
              setTimeout(() => {
                window.location.href = d.checkoutUrl;
              }, 850);
              return;
            }
          } catch (_) {}

          // Fallback direct route to hosted processor checkout page
          const fallbackUrl = '/checkout?type=donation&entity=MGC&amount=' + encodeURIComponent(amountUsd) +
            '&method=' + encodeURIComponent(method) +
            '&name=' + encodeURIComponent(donorName) +
            '&email=' + encodeURIComponent(donorEmail) +
            '&returnPath=' + encodeURIComponent('/newsletter');
          setTimeout(() => {
            window.location.href = fallbackUrl;
          }, 850);
        };
      }

      const form = document.getElementById('nlSubForm');
      if (form) {
        form.onsubmit = async (e) => {
          e.preventDefault();
          const name = document.getElementById('nlName').value.trim() || 'Executive Subscriber';
          const email = document.getElementById('nlEmail').value.trim();
          const topic = document.getElementById('nlTopic').value || 'all';
          const smsOptIn = document.getElementById('nlSmsOptIn').checked;
          const phone = document.getElementById('nlPhone').value.trim();
          const carrierGateway = document.getElementById('nlCarrier').value;
          const st = document.getElementById('nlSubStatus');
          if (!email) return;
          subInputDraft = { name, email, topic, smsOptIn, phone, carrier: carrierGateway };
          activeStreamTrack = topic;
          try {
            const r = await fetch('/api/newsletter/subscribe', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name, email, topic, smsOptIn, phone, carrierGateway, source: 'newsletter-page' })
            });
            const d = await r.json();
            if (d && d.ok) {
              lastDeliveryPacket = d.deliveryPacket || null;
              render();
              const stAfter = document.getElementById('nlSubStatus');
              if (stAfter) stAfter.textContent = '✓ ' + (d.message || 'Briefing Prepared & Ready for Delivery.');
              W.toast('Briefing Delivered (' + (d.receiptId || 'Ready') + ')');
            } else {
              if (st) st.textContent = (d && d.error) || 'Subscription error';
            }
          } catch (_) {
            if (st) st.textContent = '✓ Subscribed to MGC & F.I.X Executive Briefings.';
          }
        };
      }

      const btnAddSrc = document.getElementById('btnAddSource');
      if (btnAddSrc) {
        btnAddSrc.onclick = async () => {
          const title = document.getElementById('srcTitleInput').value.trim();
          if (!title) return;
          const r = await fetch('/api/newsletter/sources', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, category: 'EXECUTIVE' })
          });
          const d = await r.json();
          if (d && d.ok) {
            nlState.sources = d.sources;
            W.toast('Source Added to Collection Queue');
            render();
          }
        };
      }

      const pubBtn = document.getElementById('btnPubIssue');
      if (pubBtn) {
        pubBtn.onclick = async () => {
          const category = document.getElementById('pubCat').value.trim() || 'Executive Briefing';
          const title = document.getElementById('pubTitle').value.trim();
          const summary = document.getElementById('pubSummary').value.trim();
          const distro = document.getElementById('pubDistro') ? document.getElementById('pubDistro').value : 'distro_all_exec';
          if (!title || !summary) { W.toast('Enter both headline and summary'); return; }
          const r = await fetch('/api/newsletter/publish', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ category, title, summary, distro, dispatchSms: true })
          });
          const d = await r.json();
          if (d && d.ok && d.newsletter) {
            nlState = Object.assign({}, nlState, d.newsletter);
            W.toast('Dispatched to Email & SMS Distros!');
            render();
          }
        };
      }
    }

    render();
    fetchNewsletter();
  })();
  </script>
</body>
</html>
