<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Executive Intelligence Newsletter | Milton Group Concepts &amp; F.I.X Solutions</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: nlOut 0.24s cubic-bezier(0.22, 1, 0.36, 1) both; }
    ::view-transition-new(root) { animation: nlIn 0.32s cubic-bezier(0.22, 1, 0.36, 1) both; }
    @keyframes nlOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-6px); } }
    @keyframes nlIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .nl-grid { display: grid; grid-template-columns: 390px 1fr; gap: 20px; align-items: start; }
    @media (max-width: 900px) { .nl-grid { grid-template-columns: 1fr; } }
    .issue-card {
      background: rgba(9, 16, 32, 0.96);
      border: 1.5px solid rgba(148, 163, 184, 0.32);
      border-radius: 18px;
      padding: 20px 22px;
      margin-bottom: 14px;
      transition: transform 0.22s ease, border-color 0.22s ease;
    }
    .issue-card:hover {
      transform: translateY(-2px);
      border-color: rgba(96, 165, 250, 0.6);
    }
    #nlConsultationForm input,
    #nlConsultationForm select,
    #nlConsultationForm textarea {
      width: 100%;
      box-sizing: border-box;
    }
  </style>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <meta property="og:image" content="assets/og-mgc-banner.jpg">
</head>
<body>
  <main class="wrap" id="app"></main>
  <script src="mgc-workspace-core.js"></script>
  <script>
  (function () {
    const W = window.MGCW;
    const esc = W.esc;
    const app = document.getElementById('app');

    // Enforce minimalist mobile control deck on mobile devices
    if (window.innerWidth < 768 || /Mobile|Android|iP(hone|od|ad)|IEMobile/i.test(navigator.userAgent)) {
      location.replace('/mobile#briefings');
      return;
    }

    let nlState = {
      subscribersCount: 142,
      smsSubscribersCount: 38,
      donationsTotalUsd: 0,
      distros: [
        { id: 'distro_all_exec', label: 'All Executive Subscribers', count: 142 },
        { id: 'distro_federal', label: 'Federal & SDVOSB Distro', count: 49 },
        { id: 'distro_cyber', label: 'Zero-Trust & Cyber Distro', count: 52 },
        { id: 'distro_ai', label: 'AI & Automation Distro', count: 41 },
        { id: 'distro_sms', label: 'SMS / Text Alert Distro ($0 Gateway)', count: 38 }
      ],
      sources: [
        { id: 'src-01', title: 'SAM.gov NAICS 541512 / 541519 Set-Aside Feed', category: 'FEDERAL', status: 'collected' },
        { id: 'src-02', title: 'NIST SP 800-171 Rev 3 & CMMC 2.0 Advisory Feed', category: 'CYBER', status: 'collected' },
        { id: 'src-03', title: 'Otto Language & AI Receptionist Telemetry Digest', category: 'AI_WORKFLOW', status: 'collected' }
      ],
      distributions: [],
      issues: [
        {
                "id": "iss_2026_04",
                "issueNumber": "Briefing 04",
                "track": "OPERATIONS & IDENTITY",
                "date": "October 2026",
                "readTime": "2 min read",
                "title": "Unified Identity and Mobile Workflow Control",
                "summary": "How modern commercial and defense teams replace cluttered dashboards with focused approval workflows and single sign on.",
                "highlights": [
                        "Direct Google, Microsoft, and Apple sign in with verified session protection",
                        "Streamlined mobile approvals, access grants, and sprint tracking",
                        "Dedicated cloud infrastructure with automated cost controls"
                ]
        },
        {
                "id": "iss_2026_03",
                "issueNumber": "Briefing 03",
                "track": "FEDERAL CONTRACTING",
                "date": "October 2026",
                "readTime": "3 min read",
                "title": "Federal Readiness and Contract Alignment",
                "summary": "Practical steps for aligning technical capabilities with defense compliance standards and rapid proposal delivery.",
                "highlights": [
                        "Structured security control mapping and readiness documentation",
                        "Rapid capability brief preparation for federal notices",
                        "Direct milestone invoicing for predictable settlement"
                ]
        },
        {
                "id": "iss_2026_02",
                "issueNumber": "Briefing 02",
                "track": "COMMERCIAL OPERATIONS",
                "date": "September 2026",
                "readTime": "2 min read",
                "title": "Automated Reception and Live Service Tracking",
                "summary": "Field results from Sterling Auto Repair showing how instant intake and live bay tracking eliminate missed customer calls.",
                "highlights": [
                        "Immediate customer intake connected directly to calendar scheduling",
                        "Clear project board visibility from request through launch",
                        "Guided team training modules included for new staff"
                ]
        }
]
    };

    let selectedDonationAmount = 25;
    let selectedDonationMethod = 'card';
    const urlParams = new URLSearchParams(location.search);
    let settledDonationReceipt = urlParams.get('checkout_status') === 'settled' ? (urlParams.get('receipt') || '') : '';
    let showConsultationForm = location.hash === '#consultation' || urlParams.get('consultation') === '1';
    let lastConsultationReceipt = null;
    let consultationError = '';

    async function fetchNewsletter() {
      try {
        const r = await fetch('/api/newsletter');
        if (r.ok) {
          const d = await r.json();
          if (d && d.ok) {
            nlState = Object.assign({}, nlState, d);
            render();
          }
        }
      } catch (_) {}
    }

    function render() {
      const u = W.me();
      const issuesHtml = (nlState.issues || []).map(iss => `
        <article class="issue-card">
          <div class="row" style="margin-bottom:8px;gap:8px;flex-wrap:wrap">
            <span class="chip ok" style="font-size:10.5px;font-weight:700">${esc(iss.issueNumber || 'Briefing')} · ${esc(iss.date || 'October 2026')}</span>
            <span class="chip" style="font-size:10.5px;color:#fde047;border-color:rgba(197,179,88,0.45)">${esc(iss.track || iss.category || 'Executive Briefing')}</span>
          </div>
          <h2 style="font-size:18.5px;margin-bottom:6px">${esc(iss.title)}</h2>
          <p style="font-size:14px;color:#e2e8f0;margin-bottom:12px">${esc(iss.summary)}</p>
          ${Array.isArray(iss.highlights) && iss.highlights.length ? `
            <ul style="margin:0;padding-left:18px;color:#cbd5e1;font-size:13px;line-height:1.6">
              ${iss.highlights.map(h => `<li style="margin-bottom:4px">${esc(h)}</li>`).join('')}
            </ul>
          ` : ''}
        </article>
      `).join('');

      const distrosHtml = (nlState.distros || []).map(d =>
        `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:8px;background:rgba(4,8,20,0.78);border:1px solid rgba(148,163,184,0.2);font-size:12px">
          <span>${esc(d.label)}</span>
          <span class="chip ok" style="font-size:10.5px">${esc(d.count)} Ready</span>
        </div>`
      ).join('');

      const consultationPanelHtml = showConsultationForm ? `
        <div id="nlConsultationBackdrop" role="dialog" aria-modal="true" aria-label="Consultation Form" style="position:fixed;inset:0;z-index:9999;background:rgba(2,6,23,0.86);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto">
          <section class="card" id="nlConsultationSection" style="width:100%;max-width:820px;margin:auto;border:1.5px solid rgba(197,179,88,0.65);background:linear-gradient(135deg,rgba(11,22,46,0.98),rgba(5,10,24,0.99));box-shadow:0 24px 64px rgba(0,0,0,0.75);padding:22px 24px">
            <div style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid rgba(148,163,184,0.24)">
              <a href="/" title="Return to Homepage" style="display:inline-flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none">
                <img src="assets/mgc-logo.png" alt="MGC Logo" style="width:44px;height:44px;border-radius:10px;border:1px solid rgba(197,179,88,0.55);object-fit:contain;background:#050a18" onerror="this.style.display='none'" />
              </a>
              <h2 style="margin:0;font-size:20px;font-weight:800;color:#fff">Consultation Form</h2>
              <button type="button" class="btn" id="btnCloseNlConsultation" style="position:absolute;top:0;right:0;padding:6px 12px;font-size:12px">Close ✕</button>
            </div>
            ${lastConsultationReceipt ? `
              <div id="nlConsultationReceiptBox" style="padding:13px 16px;border-radius:12px;background:rgba(6,78,59,0.34);border:1.5px solid rgba(16,185,129,0.55);margin-bottom:14px">
                <div class="row" style="margin-bottom:4px">
                  <strong style="color:#34d399;font-size:13.5px">✓ Request Submitted (${esc(lastConsultationReceipt.receiptId)})</strong>
                  <span class="chip ok">${esc(lastConsultationReceipt.timeline)}</span>
                </div>
                <p style="margin:0;font-size:12.5px;color:#e2e8f0">Received for <strong>${esc(lastConsultationReceipt.clientName)}</strong> (${esc(lastConsultationReceipt.clientEmail)}) — Scope: <strong>${esc(lastConsultationReceipt.architectureScope)}</strong>.</p>
              </div>
            ` : ''}
            ${consultationError ? `
              <div id="nlConsultationErrorBox" style="padding:10px 14px;border-radius:10px;background:rgba(127,29,29,0.35);border:1px solid rgba(248,113,113,0.55);color:#fecaca;font-size:12.5px;font-weight:600;margin-bottom:12px">${esc(consultationError)}</div>
            ` : ''}
            <form id="nlConsultationForm" style="display:flex;flex-direction:column;gap:12px">
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">
                <div>
                  <label for="reqClientName" style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:#e2e8f0;margin-bottom:4px"><span>Full Name</span><span style="color:#fde047;font-size:10.5px">Required</span></label>
                  <input id="reqClientName" type="text" maxlength="120" required placeholder="Full Name" value="${u ? esc(u.name) : ''}" />
                </div>
                <div>
                  <label for="reqClientEmail" style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:#e2e8f0;margin-bottom:4px"><span>Email Address</span><span style="color:#fde047;font-size:10.5px">Required</span></label>
                  <input id="reqClientEmail" type="email" maxlength="160" required placeholder="Work Email" value="${u ? esc(u.email) : ''}" />
                </div>
                <div>
                  <label for="reqPhone" style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:#e2e8f0;margin-bottom:4px"><span>Phone Number</span><span style="color:#fde047;font-size:10.5px">Required</span></label>
                  <input id="reqPhone" type="tel" maxlength="24" required placeholder="Phone Number" />
                </div>
              </div>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">
                <div>
                  <label for="reqOrganization" style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:#e2e8f0;margin-bottom:4px"><span>Organization / Company</span><span style="color:#94a3b8;font-size:10.5px">Optional</span></label>
                  <input id="reqOrganization" type="text" maxlength="140" placeholder="Organization or Agency Name" value="${u && u.org ? esc(u.org) : ''}" />
                </div>
                <div>
                  <label for="reqRoleTitle" style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:#e2e8f0;margin-bottom:4px"><span>Role / Title</span><span style="color:#94a3b8;font-size:10.5px">Optional</span></label>
                  <input id="reqRoleTitle" type="text" maxlength="90" placeholder="Role or Title" />
                </div>
                <div>
                  <label for="reqScaleTier" style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:#e2e8f0;margin-bottom:4px"><span>Scope / Organization Tier</span><span style="color:#fde047;font-size:10.5px">Required</span></label>
                  <select id="reqScaleTier">
                    <option value="Starter / Single Team">Starter / Single Team</option>
                    <option value="Growth (Up to 25 Users)" selected>Growth (Up to 25 Users)</option>
                    <option value="Enterprise / Multi-Site">Enterprise / Multi-Site</option>
                    <option value="Federal / SDVOSB Agency Set-Aside">Federal / SDVOSB Agency Set-Aside</option>
                  </select>
                </div>
              </div>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">
                <div>
                  <label for="reqScope" style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:#e2e8f0;margin-bottom:4px"><span>Consultation Service Area</span><span style="color:#fde047;font-size:10.5px">Required</span></label>
                  <select id="reqScope">
                    <option value="Turnkey Web, Autonomous AI Receptionist & SaaS Portal">Turnkey Web, Autonomous AI Receptionist &amp; SaaS Portal</option>
                    <option value="SDVOSB Federal Teaming & Custom Engineering">SDVOSB Federal Teaming &amp; Custom Engineering</option>
                    <option value="Zero-Trust Cybersecurity & CMMC 2.0 Architecture">Zero-Trust Cybersecurity &amp; CMMC 2.0 Architecture</option>
                    <option value="SCORM 2004 LMS & Interactive Lab Studio">SCORM 2004 LMS &amp; Interactive Lab Studio</option>
                    <option value="General Information & Executive Inquiry">General Information &amp; Executive Inquiry</option>
                  </select>
                </div>
                <div>
                  <label for="reqFormat" style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:#e2e8f0;margin-bottom:4px"><span>Preferred Consultation Format</span><span style="color:#fde047;font-size:10.5px">Required</span></label>
                  <select id="reqFormat">
                    <option value="Video Briefing & Screen Share">Video Briefing &amp; Screen Share</option>
                    <option value="Phone Consultation">Phone Consultation</option>
                    <option value="Written Architecture & Scope Proposal">Written Architecture &amp; Scope Proposal</option>
                  </select>
                </div>
                <div>
                  <label for="reqTimeline" style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:#e2e8f0;margin-bottom:4px"><span>Target Timeline</span><span style="color:#fde047;font-size:10.5px">Required</span></label>
                  <select id="reqTimeline">
                    <option value="Immediate (1-2 Weeks)">Immediate (1–2 Weeks)</option>
                    <option value="Standard (2-4 Weeks)" selected>Standard (2–4 Weeks)</option>
                    <option value="Quarterly Planning">Quarterly Planning</option>
                    <option value="Exploratory Consultation">Exploratory Consultation</option>
                  </select>
                </div>
              </div>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px">
                <div>
                  <label for="reqPreferredWindow" style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:#e2e8f0;margin-bottom:4px"><span>Preferred Date / Time Window</span><span style="color:#94a3b8;font-size:10.5px">EST / EDT</span></label>
                  <select id="reqPreferredWindow">
                    <option value="Next Available Executive Slot">Next Available Executive Slot</option>
                    <option value="Morning Window (9:00 AM - 12:00 PM EST)">Morning Window (9:00 AM – 12:00 PM EST)</option>
                    <option value="Afternoon Window (1:00 PM - 5:00 PM EST)">Afternoon Window (1:00 PM – 5:00 PM EST)</option>
                    <option value="Flexible / Coordinate via Email">Flexible / Coordinate via Email</option>
                  </select>
                </div>
                <div>
                  <label for="reqIntegrationEnv" style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:#e2e8f0;margin-bottom:4px"><span>Primary Environment / Stack</span><span style="color:#94a3b8;font-size:10.5px">Optional</span></label>
                  <select id="reqIntegrationEnv">
                    <option value="Google Cloud / Workspace">Google Cloud / Workspace</option>
                    <option value="Microsoft Azure / Entra ID / M365">Microsoft Azure / Entra ID / M365</option>
                    <option value="AWS / Hybrid Cloud">AWS / Hybrid Cloud</option>
                    <option value="New Turnkey Deployment">New Turnkey Deployment</option>
                  </select>
                </div>
              </div>
              <div>
                <label for="reqBrief" style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:#e2e8f0;margin-bottom:4px"><span>Consultation Objectives &amp; Request Details</span><span style="color:#fde047;font-size:10.5px">Required (Max 600 chars)</span></label>
                <textarea id="reqBrief" rows="3" maxlength="600" placeholder="Describe your goals, project scope, or questions for the consultation..."></textarea>
              </div>
              <div class="row" style="justify-content:flex-end;gap:10px;margin-top:4px">
                <button type="submit" class="btn pri" id="btnSubmitNlConsultation" style="padding:10px 22px;font-size:13px">Submit Request &amp; Consultation →</button>
              </div>
            </form>
          </section>
        </div>
      ` : '';

      app.innerHTML = `
        ${consultationPanelHtml}

        <div class="nl-grid">
          <div style="display:flex;flex-direction:column;gap:14px">
            <aside class="card" style="margin:0;padding:12px;border-color:rgba(197,179,88,0.55);background:linear-gradient(180deg,rgba(10,16,32,0.96),rgba(5,9,20,0.98))">
              <div style="border-radius:10px;overflow:hidden;border:1px solid rgba(197,179,88,0.45);box-shadow:0 10px 28px rgba(0,0,0,0.65)">
                <img src="assets/mgc-logo-lockup.png" alt="Milton Group Concepts — Commercial, Defense, Government, Public Sectors" style="width:100%;display:block;object-fit:cover" />
              </div>
            </aside>
            <aside class="card" style="margin:0">
              <h2>Subscribe (Email + SMS Text)</h2>
              <p>Receive briefings by email and optional text alerts.</p>
              <form id="nlSubForm" style="margin-top:10px;display:flex;flex-direction:column;gap:8px">
                <label for="nlName" style="font-size:11.5px;font-weight:700;color:#cbd5e1">Full Name / Title</label>
                <input id="nlName" type="text" maxlength="100" placeholder="Role or Title" value="${u ? esc(u.name) : ''}" />
                <label for="nlEmail" style="font-size:11.5px;font-weight:700;color:#cbd5e1">Work or Federated Email *</label>
                <input id="nlEmail" type="email" maxlength="140" placeholder="Work Email" value="${u ? esc(u.email) : ''}" required />
                <label for="nlTopic" style="font-size:11.5px;font-weight:700;color:#cbd5e1">Intelligence Distro Track</label>
                <select id="nlTopic">
                  <option value="all">🌐 All Executive Briefings (MGC &amp; F.I.X)</option>
                  <option value="federal">🏛️ Federal &amp; SDVOSB Contracting</option>
                  <option value="cyber">🔒 Security &amp; Compliance</option>
                  <option value="ai-workflow">🤖 Workflow Automation</option>
                  <option value="logistics">🚚 Supply Chain &amp; Operations</option>
                </select>
                <div style="padding:9px 11px;border-radius:10px;background:rgba(4,8,20,0.82);border:1px solid rgba(59,130,246,0.32)">
                  <label style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#93c5fd;cursor:pointer;margin-bottom:6px">
                    <input type="checkbox" id="nlSmsOptIn" />
                    <span>📱 Also send Text Alerts</span>
                  </label>
                  <div style="display:grid;grid-template-columns:1.2fr 1fr;gap:6px">
                    <input id="nlPhone" type="tel" maxlength="16" placeholder="Mobile Number" style="padding:7px 9px;font-size:12px" />
                    <select id="nlCarrier" style="padding:7px 8px;font-size:11.5px">
                      <option value="tmomail.net">T-Mobile </option>
                      <option value="vtext.com">Verizon </option>
                      <option value="txt.att.net">AT&amp;T </option>
                      <option value="email.uscc.net">US Cellular </option>
                    </select>
                  </div>
                </div>
                <button type="submit" class="btn pri" id="btnSubmitNewsletterSub" style="justify-content:center;padding:10px;margin-top:2px">✉️ Subscribe to Distro →</button>
                <div id="nlSubStatus" role="status" aria-live="polite" style="font-size:12px;font-weight:700;color:#34d399;min-height:18px"></div>
              </form>
            </aside>

            <!-- DONATIONS CARD (Hosted Processor Checkout: Card, Cash App Pay & Apple/Google Pay) -->
            <aside class="card" id="donations" style="margin:0;border-color:rgba(197,179,88,0.55)">
              <div class="row" style="margin-bottom:6px">
                <h2 style="margin:0;font-size:16px">💝 Support &amp; Donations</h2>
                <span class="chip ok" style="font-size:10px">Card · Cash App · Apple/GPay</span>
              </div>
              <p style="font-size:12.5px;color:#cbd5e1;margin-bottom:10px">Support open executive briefings, veteran research, and community tools. Pay with Card, Cash App Pay, or Apple/Google Pay ($0 upfront processor fees).</p>
              ${settledDonationReceipt ? `
                <div id="nlDonSettledBanner" style="padding:10px 12px;border-radius:10px;background:rgba(6,78,59,0.42);border:1px solid rgba(16,185,129,0.55);color:#34d399;font-size:12px;font-weight:700;margin-bottom:10px">
                  ✓ Processor Checkout Complete · Receipt <code style="color:#a7f3d0">${esc(settledDonationReceipt)}</code>
                </div>
              ` : ''}
              <form id="nlDonateForm" style="display:flex;flex-direction:column;gap:8px">
                <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
                  ${[10, 25, 50, 100].map(amt =>
                    `<button type="button" class="btn ${selectedDonationAmount === amt ? 'pri' : ''}" data-donate-amt="${amt}" style="justify-content:center;padding:7px 4px;font-size:12px">$${amt}</button>`
                  ).join('')}
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                  <input id="donName" type="text" maxlength="100" placeholder="Your Name" value="${u ? esc(u.name) : ''}" style="padding:8px 10px;font-size:12px" />
                  <input id="donAmount" type="number" min="1" max="10000" value="${selectedDonationAmount}" placeholder="Amount ($)" style="padding:8px 10px;font-size:12px" />
                </div>
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">
                  ${[
                    { id: 'card', label: '💳 Card' },
                    { id: 'cashapp', label: '🟩 Cash App' },
                    { id: 'wallet', label: '🍎 Pay / GPay' }
                  ].map(m =>
                    `<button type="button" class="btn ${selectedDonationMethod === m.id ? 'pri' : ''}" data-donate-method="${m.id}" style="justify-content:center;padding:6px 4px;font-size:11px;${selectedDonationMethod === 'cashapp' && m.id === 'cashapp' ? 'background:linear-gradient(135deg,#00d632,#00b82b);border-color:#00d632;color:#041208;font-weight:800;' : ''}">${m.label}</button>`
                  ).join('')}
                </div>
                <select id="donMethod" aria-label="Payment Processor Method" style="padding:8px 10px;font-size:12px;width:100%">
                  <option value="card" ${selectedDonationMethod === 'card' ? 'selected' : ''}>💳 Credit or Debit Card (Stripe Hosted Checkout)</option>
                  <option value="cashapp" ${selectedDonationMethod === 'cashapp' ? 'selected' : ''}>🟩 Cash App Pay ($Cashtag / QR Instant Checkout)</option>
                  <option value="wallet" ${selectedDonationMethod === 'wallet' ? 'selected' : ''}>🍎 Apple Pay / Google Pay (Express Wallet)</option>
                </select>
                <input id="donEmail" type="email" maxlength="140" placeholder="Email for donation receipt" value="${u ? esc(u.email) : ''}" required style="padding:8px 10px;font-size:12px" />
                <button type="submit" class="btn pri" id="btnSubmitDonation" style="justify-content:center;padding:10px">💝 Continue to Processor Checkout →</button>
                <div id="nlDonStatus" role="status" aria-live="polite" style="font-size:12px;font-weight:700;color:#fde047;min-height:18px"></div>
              </form>
            </aside>

            ${u && u.role === 'owner' ? `
              <aside class="card" style="margin:0;border-color:rgba(16,185,129,0.5)">
                <h2>👑 Source Collection &amp; Distro Dishout</h2>
                <div style="margin-bottom:10px">
                  <div style="font-size:11px;font-weight:700;color:#93c5fd;text-transform:uppercase;margin-bottom:6px">1 · Collected Sources (${(nlState.sources || []).length})</div>
                  <div style="display:flex;gap:6px;margin-bottom:6px">
                    <input id="srcTitleInput" placeholder="Add source URL or brief note..." style="flex:1;padding:6px 9px;font-size:11.5px" />
                    <button type="button" class="btn" id="btnAddSource" style="padding:6px 10px;font-size:11.5px">+ Collect</button>
                  </div>
                </div>
                <div style="margin-bottom:10px">
                  <div style="font-size:11px;font-weight:700;color:#34d399;text-transform:uppercase;margin-bottom:6px">2 · Active Distro Segments</div>
                  <div style="display:flex;flex-direction:column;gap:4px">${distrosHtml}</div>
                </div>
                <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">
                  <div style="font-size:11px;font-weight:700;color:#fde047;text-transform:uppercase">3 · Dishout New Briefing (Email + SMS)</div>
                  <select id="pubDistro" style="padding:7px 9px;font-size:12px">
                    ${(nlState.distros || []).map(d => `<option value="${esc(d.id)}">${esc(d.label)} (${d.count})</option>`).join('')}
                  </select>
                  <input id="pubCat" placeholder="Briefing Category" value="Executive Briefing" />
                  <input id="pubTitle" placeholder="Issue Headline..." maxlength="140" />
                  <textarea id="pubSummary" rows="2" placeholder="Executive summary & SMS text digest..."></textarea>
                  <button type="button" class="btn pri" id="btnPubIssue" style="justify-content:center">🚀 Publish &amp; Dishout (Email + SMS)</button>
                </div>
              </aside>
            ` : ''}
          </div>

          <section aria-label="Published Newsletter Archive">
            ${issuesHtml}
          </section>
        </div>
      `;
      W.header('newsletter.html');

      function launchPopoutConsultationWindow() {
        try {
          const targetUrl = location.protocol === 'file:' ? 'consultation.html' : '/consultation';
          window.open(targetUrl, 'MGCConsultationFormPopout', 'popup=yes,width=880,height=840,left=200,top=70,resizable=yes,scrollbars=yes');
        } catch (_) {}
      }

      document.querySelectorAll('[data-open-nl-consultation]').forEach(btn => {
        btn.onclick = (ev) => {
          if (ev) ev.preventDefault();
          launchPopoutConsultationWindow();
          showConsultationForm = true;
          consultationError = '';
          render();
        };
      });

      const btnOpenPopoutWin = document.getElementById('btnOpenConsultationPopoutWindow');
      if (btnOpenPopoutWin) {
        btnOpenPopoutWin.onclick = () => launchPopoutConsultationWindow();
      }

      const nlBackdrop = document.getElementById('nlConsultationBackdrop');
      if (nlBackdrop) {
        nlBackdrop.addEventListener('click', (ev) => {
          if (ev.target === nlBackdrop) {
            showConsultationForm = false;
            consultationError = '';
            render();
          }
        });
      }

      const btnCloseCons = document.getElementById('btnCloseNlConsultation');
      if (btnCloseCons) {
        btnCloseCons.onclick = () => {
          showConsultationForm = false;
          consultationError = '';
          render();
        };
      }

      const nlConsForm = document.getElementById('nlConsultationForm');
      if (nlConsForm) {
        nlConsForm.onsubmit = async (ev) => {
          ev.preventDefault();
          consultationError = '';
          const payload = {
            clientName: document.getElementById('reqClientName').value.trim(),
            clientEmail: document.getElementById('reqClientEmail').value.trim(),
            organization: document.getElementById('reqOrganization').value.trim(),
            roleTitle: document.getElementById('reqRoleTitle') ? document.getElementById('reqRoleTitle').value.trim() : '',
            scaleTier: document.getElementById('reqScaleTier') ? document.getElementById('reqScaleTier').value : 'Growth (Up to 25 Users)',
            phone: document.getElementById('reqPhone').value.trim(),
            architectureScope: document.getElementById('reqScope').value,
            consultationFormat: document.getElementById('reqFormat') ? document.getElementById('reqFormat').value : 'Video Briefing & Screen Share',
            timeline: document.getElementById('reqTimeline').value,
            preferredWindow: document.getElementById('reqPreferredWindow') ? document.getElementById('reqPreferredWindow').value : 'Next Available Executive Slot',
            integrationEnv: document.getElementById('reqIntegrationEnv') ? document.getElementById('reqIntegrationEnv').value : 'Google Cloud / Workspace',
            projectBrief: document.getElementById('reqBrief').value.trim()
          };
          if (!payload.clientName || !/^\S+@\S+\.\S+$/.test(payload.clientEmail)) {
            consultationError = 'Please provide your Full Name and a valid Email Address.';
            render();
            return;
          }
          if (W.hasInjectionPayload && W.hasInjectionPayload(payload)) {
            consultationError = 'Invalid characters detected in submission fields.';
            render();
            return;
          }
          try {
            const r = await fetch('/api/newsletter/consultation', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            const d = await r.json();
            if (d && d.ok && d.consultation) {
              lastConsultationReceipt = d.consultation;
              W.toast('Request Submitted (' + d.receiptId + ')');
              render();
              return;
            }
            consultationError = (d && d.error) || 'Could not submit request.';
            render();
          } catch (_) {
            lastConsultationReceipt = {
              receiptId: 'MGC-REQ-' + Date.now().toString(36).toUpperCase().slice(-5),
              clientName: payload.clientName,
              clientEmail: payload.clientEmail,
              architectureScope: payload.architectureScope,
              timeline: payload.timeline
            };
            W.toast('Request Submitted (' + lastConsultationReceipt.receiptId + ')');
            render();
          }
        };
      }

      app.querySelectorAll('[data-donate-amt]').forEach(btn => {
        btn.onclick = () => {
          selectedDonationAmount = Number(btn.dataset.donateAmt) || 25;
          const inp = document.getElementById('donAmount');
          if (inp) inp.value = String(selectedDonationAmount);
          render();
        };
      });

      app.querySelectorAll('[data-donate-method]').forEach(btn => {
        btn.onclick = () => {
          selectedDonationMethod = btn.dataset.donateMethod || 'card';
          const sel = document.getElementById('donMethod');
          if (sel) sel.value = selectedDonationMethod;
          render();
        };
      });

      const donMethodSelect = document.getElementById('donMethod');
      if (donMethodSelect) {
        donMethodSelect.onchange = () => {
          selectedDonationMethod = donMethodSelect.value || 'card';
          render();
        };
      }

      const donForm = document.getElementById('nlDonateForm');
      if (donForm) {
        donForm.onsubmit = async (e) => {
          e.preventDefault();
          const donorName = document.getElementById('donName').value.trim() || 'Community Supporter';
          const donorEmail = document.getElementById('donEmail').value.trim() || 'supporter@miltongroupsecurity.org';
          const amountUsd = Math.max(1, Number(document.getElementById('donAmount').value) || selectedDonationAmount);
          const method = document.getElementById('donMethod') ? document.getElementById('donMethod').value : selectedDonationMethod;
          const st = document.getElementById('nlDonStatus');
          const railNames = {
            card: 'Stripe Hosted Card Checkout',
            cashapp: 'Cash App Pay Checkout',
            wallet: 'Apple Pay / Google Pay Checkout'
          };
          st.style.color = '#38bdf8';
          st.textContent = '⟳ Routing $' + amountUsd.toFixed(2) + ' to ' + (railNames[method] || 'Payment Processor') + '...';

          try {
            const r = await fetch('/api/checkout/session', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                type: 'donation',
                merchantEntity: 'MGC',
                title: 'Executive Briefings, Veteran Research & Community Support',
                donorName,
                donorEmail,
                amountUsd,
                method,
                returnPath: '/newsletter'
              })
            });
            const d = await r.json();
            if (d && d.ok && d.checkoutUrl) {
              setTimeout(() => {
                window.location.href = d.checkoutUrl;
              }, 850);
              return;
            }
          } catch (_) {}

          // Fallback direct route to hosted processor checkout page
          const fallbackUrl = '/checkout?type=donation&entity=MGC&amount=' + encodeURIComponent(amountUsd) +
            '&method=' + encodeURIComponent(method) +
            '&name=' + encodeURIComponent(donorName) +
            '&email=' + encodeURIComponent(donorEmail) +
            '&returnPath=' + encodeURIComponent('/newsletter');
          setTimeout(() => {
            window.location.href = fallbackUrl;
          }, 850);
        };
      }

      const form = document.getElementById('nlSubForm');
      if (form) {
        form.onsubmit = async (e) => {
          e.preventDefault();
          const name = document.getElementById('nlName').value.trim();
          const email = document.getElementById('nlEmail').value.trim();
          const topic = document.getElementById('nlTopic').value;
          const smsOptIn = document.getElementById('nlSmsOptIn').checked;
          const phone = document.getElementById('nlPhone').value.trim();
          const carrierGateway = document.getElementById('nlCarrier').value;
          const st = document.getElementById('nlSubStatus');
          if (!email) return;
          try {
            const r = await fetch('/api/newsletter/subscribe', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name, email, topic, smsOptIn, phone, carrierGateway, source: 'newsletter-page' })
            });
            const d = await r.json();
            if (d && d.ok) {
              st.textContent = '✓ ' + (d.message || 'Subscribed to MGC & F.I.X Executive Briefings.');
              W.toast('Subscribed to Executive Distro');
            } else {
              st.textContent = (d && d.error) || 'Subscription error';
            }
          } catch (_) {
            st.textContent = '✓ Subscribed to MGC & F.I.X Executive Briefings.';
          }
        };
      }

      const btnAddSrc = document.getElementById('btnAddSource');
      if (btnAddSrc) {
        btnAddSrc.onclick = async () => {
          const title = document.getElementById('srcTitleInput').value.trim();
          if (!title) return;
          const r = await fetch('/api/newsletter/sources', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, category: 'EXECUTIVE' })
          });
          const d = await r.json();
          if (d && d.ok) {
            nlState.sources = d.sources;
            W.toast('Source Added to Collection Queue');
            render();
          }
        };
      }

      const pubBtn = document.getElementById('btnPubIssue');
      if (pubBtn) {
        pubBtn.onclick = async () => {
          const category = document.getElementById('pubCat').value.trim() || 'Executive Briefing';
          const title = document.getElementById('pubTitle').value.trim();
          const summary = document.getElementById('pubSummary').value.trim();
          const distro = document.getElementById('pubDistro') ? document.getElementById('pubDistro').value : 'distro_all_exec';
          if (!title || !summary) { W.toast('Enter both headline and summary'); return; }
          const r = await fetch('/api/newsletter/publish', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ category, title, summary, distro, dispatchSms: true })
          });
          const d = await r.json();
          if (d && d.ok && d.newsletter) {
            nlState = Object.assign({}, nlState, d.newsletter);
            W.toast('Dispatched to Email & SMS Distros!');
            render();
          }
        };
      }
    }

    render();
    fetchNewsletter();
  })();
  </script>
</body>
</html>
