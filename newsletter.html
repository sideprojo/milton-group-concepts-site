<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Executive Intelligence Newsletter | Milton Group Concepts &amp; F.I.X Solutions</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: nlOut 0.24s cubic-bezier(0.22, 1, 0.36, 1) both; }
    ::view-transition-new(root) { animation: nlIn 0.32s cubic-bezier(0.22, 1, 0.36, 1) both; }
    @keyframes nlOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-6px); } }
    @keyframes nlIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .nl-grid { display: grid; grid-template-columns: 390px 1fr; gap: 20px; align-items: start; }
    @media (max-width: 900px) { .nl-grid { grid-template-columns: 1fr; } }
    .issue-card {
      background: rgba(9, 16, 32, 0.96);
      border: 1.5px solid rgba(148, 163, 184, 0.32);
      border-radius: 18px;
      padding: 20px 22px;
      margin-bottom: 14px;
      transition: transform 0.22s ease, border-color 0.22s ease;
    }
    .issue-card:hover {
      transform: translateY(-2px);
      border-color: rgba(96, 165, 250, 0.6);
    }
    #nlConsultationForm input,
    #nlConsultationForm select,
    #nlConsultationForm textarea {
      width: 100%;
      box-sizing: border-box;
    }
    @keyframes mgcVerticalNewsScroll {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(0, -50%, 0); }
    }
    @keyframes mgcLiveDotPing {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.45); opacity: 0.45; }
    }
    .mgc-live-stream-shell {
      background: linear-gradient(180deg, rgba(8, 15, 30, 0.96), rgba(5, 10, 22, 0.98));
      border: 1.5px solid rgba(197, 179, 88, 0.42);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.65);
      position: relative;
    }
    .mgc-vertical-viewport {
      height: 760px;
      overflow: hidden;
      position: relative;
      padding: 16px 18px;
      mask-image: linear-gradient(180deg, transparent 0%, #000 3.5%, #000 96.5%, transparent 100%);
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 3.5%, #000 96.5%, transparent 100%);
    }
    .mgc-vertical-track {
      display: flex;
      flex-direction: column;
      gap: 14px;
      will-change: transform;
      animation: mgcVerticalNewsScroll 72s linear infinite;
    }
    .mgc-vertical-viewport:hover .mgc-vertical-track,
    .mgc-vertical-track[data-stream-paused="true"] {
      animation-play-state: paused !important;
    }
    @media (prefers-reduced-motion: reduce) {
      .mgc-vertical-track { animation: none !important; }
      .mgc-vertical-viewport { height: auto; max-height: 760px; overflow-y: auto; mask-image: none; -webkit-mask-image: none; }
    }
    .mgc-live-article-card {
      background: linear-gradient(135deg, rgba(16, 28, 52, 0.95), rgba(8, 15, 30, 0.98));
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }
    .mgc-live-article-card.is-key-story {
      background: linear-gradient(135deg, rgba(19, 32, 59, 0.96), rgba(24, 21, 14, 0.95));
      border: 1.5px solid rgba(197, 179, 88, 0.68);
      box-shadow: 0 10px 28px rgba(197, 179, 88, 0.14);
    }
    .mgc-live-article-card:hover {
      transform: translateY(-2px);
      border-color: rgba(197, 179, 88, 0.95);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.8), 0 0 22px rgba(197, 179, 88, 0.22);
    }
  </style>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <meta property="og:image" content="assets/og-mgc-banner.jpg">
</head>
<body>
  <main class="wrap" id="app"></main>
  <script src="mgc-workspace-core.js"></script>
  <script>
  (function () {
    const W = window.MGCW;
    const esc = W.esc;
    const app = document.getElementById('app');

    // Enforce minimalist mobile control deck on mobile devices
    if (window.innerWidth < 768 || /Mobile|Android|iP(hone|od|ad)|IEMobile/i.test(navigator.userAgent)) {
      location.replace('/mobile#briefings');
      return;
    }

    let nlState = {
      subscribersCount: 142,
      smsSubscribersCount: 38,
      donationsTotalUsd: 0,
      distros: [
        { id: 'distro_all_exec', label: 'All Executive Subscribers', count: 142 },
        { id: 'distro_federal', label: 'Federal & SDVOSB Distro', count: 49 },
        { id: 'distro_cyber', label: 'Zero-Trust & Cyber Distro', count: 52 },
        { id: 'distro_ai', label: 'AI & Automation Distro', count: 41 },
        { id: 'distro_sms', label: 'SMS / Text Alert Distro ($0 Gateway)', count: 38 }
      ],
      sources: [
        { id: 'src-01', title: 'Reuters & Google News AI / Cloud Feed', category: 'AI_WORKFLOW', status: 'collected' },
        { id: 'src-02', title: 'SAM.gov NAICS 541512 / 541519 Set-Aside Feed', category: 'FEDERAL', status: 'collected' },
        { id: 'src-03', title: 'CISA & DefenseScoop Cyber Advisory Feed', category: 'CYBER', status: 'collected' }
      ],
      distributions: [],
      issues: [],
      liveStream: [
        {
          id: 'mgc-live-1',
          source: 'Reuters',
          sourceCode: 'REUTERS',
          accentColor: '#f97316',
          title: 'Enterprise Teams Shift AI Budgets Toward Focused Task Agents and Lower Cloud Spend',
          mgcSummation: 'Companies are moving away from expensive general chat tools and putting their money into smaller AI agents that handle specific daily workflows like customer intake, scheduling, and billing checks.',
          mgcComment: 'MGC Take: This matches exactly how we build at MGC. Keep cloud costs near zero at idle and give each agent one clear job that helps your staff finish work faster.',
          time: 'LIVE • 12m ago',
          agency: 'Reuters Tech Desk',
          track: 'ai-workflow',
          trackLabel: 'AI & AUTOMATION',
          url: 'https://www.reuters.com/technology/artificial-intelligence/',
          isKeyStory: true,
          curatedBy: 'MGC Cloud Briefing Agent (AI Studio)'
        },
        {
          id: 'mgc-live-2',
          source: 'Google News',
          sourceCode: 'GNEWS',
          accentColor: '#38bdf8',
          title: 'Federal Agencies Expand Fast Track Cloud and Cyber Awards for Small Veteran Contractors',
          mgcSummation: 'Acquisition offices are cutting paperwork delays so verified small businesses can deliver secure cloud portals and identity tools directly to program teams.',
          mgcComment: 'MGC Take: Speed and readiness win contracts. Having your security controls and live demos ready before the notice drops puts SDVOSB teams at the front of the line.',
          time: 'LIVE • 24m ago',
          agency: 'Federal Acquisition',
          track: 'federal',
          trackLabel: 'FEDERAL & SDVOSB',
          url: 'https://news.google.com/',
          isKeyStory: true,
          curatedBy: 'MGC Cloud Briefing Agent (AI Studio)'
        },
        {
          id: 'mgc-live-3',
          source: 'CISA Advisories',
          sourceCode: 'CISA',
          accentColor: '#f87171',
          title: 'CISA Directs Immediate Identity Hardening Against Session and Token Theft',
          mgcSummation: 'Federal security teams issued fresh guidance requiring verified single sign on, strict session timeouts, and hardware backed login checks across cloud portals.',
          mgcComment: 'MGC Take: Passwords alone are not enough anymore. Using verified Google, Microsoft, and Apple sign in with automatic inactivity lockouts stops attackers cold.',
          time: 'LIVE • 41m ago',
          agency: 'DHS / CISA',
          track: 'cyber',
          trackLabel: 'SECURITY & COMPLIANCE',
          url: 'https://www.cisa.gov/news-events/cybersecurity-advisories',
          isKeyStory: true,
          curatedBy: 'MGC Cloud Briefing Agent (AI Studio)'
        },
        {
          id: 'mgc-live-4',
          source: 'DefenseScoop',
          sourceCode: 'DSCOOP',
          accentColor: '#C5B358',
          title: 'Defense Commands Prioritize Real Time Readiness Dashboards and Automated Field Training',
          mgcSummation: 'Operational units are adopting browser based training labs and live status boards so personnel can practice and deploy without waiting on local server installs.',
          mgcComment: 'MGC Take: Training and operations belong in the same place. When teams can test a workflow in the browser and use it the same day, readiness jumps immediately.',
          time: 'LIVE • 1h ago',
          agency: 'Pentagon / DoD',
          track: 'federal',
          trackLabel: 'FEDERAL & SDVOSB',
          url: 'https://defensescoop.com/',
          isKeyStory: false,
          curatedBy: 'MGC Cloud Briefing Agent (AI Studio)'
        },
        {
          id: 'mgc-live-5',
          source: 'Reuters',
          sourceCode: 'REUTERS',
          accentColor: '#f97316',
          title: 'Service Businesses Adopt Automated Reception and Instant Customer Status Tracking',
          mgcSummation: 'Independent shops and regional service providers are replacing phone tag with live digital intake forms and real time progress updates for customers.',
          mgcComment: 'MGC Take: Every missed phone call is lost revenue. Giving customers a simple link to book, track progress, and settle invoices keeps bays full and owners focused.',
          time: 'LIVE • 2h ago',
          agency: 'Commercial Ops',
          track: 'logistics',
          trackLabel: 'OPERATIONS & SUPPLY',
          url: 'https://www.reuters.com/business/',
          isKeyStory: false,
          curatedBy: 'MGC Cloud Briefing Agent (AI Studio)'
        }
      ]
    };

    let selectedDonationAmount = 25;
    let selectedDonationMethod = 'card';
    let activeStreamTrack = 'all';
    let streamPaused = false;
    let streamRefreshCountdown = 60;
    let lastDeliveryPacket = null;
    let subInputDraft = { name: '', email: '', topic: 'all', smsOptIn: false, phone: '', carrier: 'tmomail.net' };
    const urlParams = new URLSearchParams(location.search);
    let settledDonationReceipt = urlParams.get('checkout_status') === 'settled' ? (urlParams.get('receipt') || '') : '';
    let showConsultationForm = location.hash === '#consultation' || urlParams.get('consultation') === '1';
    let lastConsultationReceipt = null;
    let consultationError = '';

    async function fetchNewsletter(forceRefreshStream) {
      try {
        const [rNl, rStream] = await Promise.all([
          fetch('/api/newsletter'),
          fetch('/api/newsletter/live-stream' + (forceRefreshStream ? '?refresh=1' : ''))
        ]);
        if (rNl.ok) {
          const d = await rNl.json();
          if (d && d.ok) nlState = Object.assign({}, nlState, d);
        }
        if (rStream.ok) {
          const ds = await rStream.json();
          if (ds && ds.ok && Array.isArray(ds.items) && ds.items.length) {
            nlState.liveStream = ds.items;
          }
        }
        render();
      } catch (_) {}
    }

    setInterval(() => {
      if (streamPaused) return;
      streamRefreshCountdown = streamRefreshCountdown <= 1 ? 60 : streamRefreshCountdown - 1;
      const badge = document.getElementById('mgcStreamCountdownVal');
      if (badge) badge.textContent = streamRefreshCountdown + 's';
      if (streamRefreshCountdown === 60) {
        fetchNewsletter(true);
      }
    }, 1000);

    function captureFormDrafts() {
      const elName = document.getElementById('nlName');
      const elEmail = document.getElementById('nlEmail');
      const elTopic = document.getElementById('nlTopic');
      const elSms = document.getElementById('nlSmsOptIn');
      const elPhone = document.getElementById('nlPhone');
      const elCarrier = document.getElementById('nlCarrier');
      if (elName) subInputDraft.name = elName.value;
      if (elEmail) subInputDraft.email = elEmail.value;
      if (elTopic) subInputDraft.topic = elTopic.value;
      if (elSms) subInputDraft.smsOptIn = elSms.checked;
      if (elPhone) subInputDraft.phone = elPhone.value;
      if (elCarrier) subInputDraft.carrier = elCarrier.value;
    }

    function render() {
      captureFormDrafts();
      const u = W.me();
      const rawStream = Array.isArray(nlState.liveStream) && nlState.liveStream.length ? nlState.liveStream : [];
      const filteredStream = (activeStreamTrack && activeStreamTrack !== 'all')
        ? rawStream.filter(it => it.track === activeStreamTrack)
        : rawStream;
      const displayStream = filteredStream.length ? filteredStream : rawStream;
      // Duplicate items so the 0% -> -50% vertical scroll loops seamlessly without any jump
      const loopedStream = displayStream.concat(displayStream);

      const renderStreamCard = (item, idx) => `
        <article class="mgc-live-article-card ${item.isKeyStory ? 'is-key-story' : ''}" data-stream-card-idx="${idx}">
          <div style="height:4px;width:100%;background:${item.isKeyStory ? 'linear-gradient(90deg,#C5B358,#FDE047,#C5B358)' : esc(item.accentColor || '#38bdf8')}"></div>
          <div style="padding:16px 18px;display:flex;flex-direction:column;gap:10px">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.08)">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                <span style="padding:2px 8px;border-radius:4px;font-size:10px;font-family:monospace;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:#050a18;background:${esc(item.accentColor || '#38bdf8')}">${esc(item.sourceCode || 'NEWS')}</span>
                <span style="font-size:11.5px;font-weight:700;color:#cbd5e1">${esc(item.source || 'News Wire')}</span>
                <span style="font-size:10.5px;padding:2px 8px;border-radius:999px;background:rgba(15,23,42,0.9);border:1px solid rgba(148,163,184,0.28);color:#93c5fd;font-weight:700">${esc(item.trackLabel || 'EXECUTIVE BRIEF')}</span>
              </div>
              <div style="display:flex;align-items:center;gap:8px">
                ${item.isKeyStory ? `
                  <span style="padding:2px 8px;border-radius:4px;background:#C5B358;color:#050a18;font-family:monospace;font-size:9.5px;font-weight:900;letter-spacing:0.06em;box-shadow:0 0 12px rgba(197,179,88,0.45)">★ KEY TODAY</span>
                ` : ''}
                <span style="font-size:11px;font-family:monospace;color:#fde047;font-weight:700">${esc(item.time || 'LIVE • TODAY')}</span>
              </div>
            </div>

            <h3 style="margin:0;font-size:16.5px;font-weight:800;color:#f8fafc;line-height:1.35">${esc(item.title)}</h3>

            <div style="font-size:13.5px;color:#e2e8f0;line-height:1.55">
              <strong style="color:#93c5fd;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;margin-right:6px">MGC Summation:</strong>${esc(item.mgcSummation || item.summary || '')}
            </div>

            <div style="padding:10px 13px;border-radius:10px;background:rgba(197,179,88,0.1);border-left:3px solid #C5B358;font-size:13px;color:#fef08a;line-height:1.5">
              ${esc(item.mgcComment || 'MGC Take: Practical execution and verified security controls keep teams ahead.')}
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr auto;align-items:center;gap:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.08);font-size:11px;font-family:monospace">
              <div>
                <span style="display:block;font-size:9px;color:#94a3b8;text-transform:uppercase">DESK / FOCUS</span>
                <span style="color:#f8fafc;font-weight:700">${esc(item.agency || 'MGC Intelligence')}</span>
              </div>
              <div>
                <span style="display:block;font-size:9px;color:#94a3b8;text-transform:uppercase">CURATED BY</span>
                <span style="color:#34d399;font-weight:700">MGC Agent · AI Studio</span>
              </div>
              <div style="display:flex;align-items:center;gap:8px">
                <button type="button" class="btn" data-deliver-single="${esc(item.id)}" style="padding:5px 10px;font-size:11px;border-color:rgba(56,189,248,0.45);color:#7dd3fc">✉️ Deliver This</button>
                <a href="${esc(item.url || 'https://news.google.com/')}" target="_blank" rel="noopener noreferrer" class="btn" style="padding:5px 10px;font-size:11px;border-color:rgba(197,179,88,0.55);color:#fde047;text-decoration:none">Read Source ↗</a>
              </div>
            </div>
          </div>
        </article>
      `;

      const liveStreamHtml = `
        <div class="mgc-live-stream-shell" id="mgcLiveVerticalStream">
          <div style="padding:14px 18px;background:linear-gradient(90deg,rgba(15,23,42,0.98),rgba(11,20,38,0.95));border-bottom:1px solid rgba(197,179,88,0.38);display:flex;flex-direction:column;gap:10px">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
              <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                <span style="width:9px;height:9px;border-radius:999px;background:#34d399;box-shadow:0 0 10px #34d399;display:inline-block;animation:mgcLiveDotPing 1.8s infinite"></span>
                <span style="font-size:13.5px;font-weight:900;letter-spacing:0.14em;text-transform:uppercase;color:#C5B358">Live AI &amp; News Briefing Stream</span>
                <span style="font-size:11px;font-family:monospace;color:#94a3b8;border-left:1px solid rgba(255,255,255,0.15);padding-left:10px">Reuters · Google News · DefenseScoop · CISA</span>
              </div>
              <div style="display:flex;align-items:center;gap:8px">
                <span style="padding:4px 9px;border-radius:999px;background:rgba(4,9,20,0.9);border:1px solid rgba(197,179,88,0.45);font-family:monospace;font-size:11px;color:#fde047">
                  Refresh <strong id="mgcStreamCountdownVal">${streamRefreshCountdown}s</strong>
                </span>
                <button type="button" class="btn" id="btnToggleStreamPause" style="padding:5px 10px;font-size:11px">
                  ${streamPaused ? '▶ Resume Scroll' : '⏸ Pause Scroll'}
                </button>
                <button type="button" class="btn" id="btnRefreshLiveStream" style="padding:5px 10px;font-size:11px;border-color:rgba(52,211,153,0.45);color:#34d399">
                  ↻ Refresh
                </button>
              </div>
            </div>

            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                ${[
                  { id: 'all', label: 'All Live Feeds' },
                  { id: 'ai-workflow', label: 'AI & Automation' },
                  { id: 'federal', label: 'Federal & SDVOSB' },
                  { id: 'cyber', label: 'Security & Compliance' },
                  { id: 'logistics', label: 'Operations' }
                ].map(t => `
                  <button type="button" class="btn ${activeStreamTrack === t.id ? 'pri' : ''}" data-stream-track="${t.id}" style="padding:4px 10px;font-size:11px;border-radius:999px">
                    ${t.label}
                  </button>
                `).join('')}
              </div>
              <span style="font-size:11px;color:#94a3b8">Hover any card to pause · Plain-language MGC Summation &amp; Take</span>
            </div>
          </div>

          <div class="mgc-vertical-viewport" id="mgcVerticalViewport">
            <div class="mgc-vertical-track" id="mgcVerticalTrack" data-stream-paused="${streamPaused ? 'true' : 'false'}">
              ${loopedStream.map((it, idx) => renderStreamCard(it, idx)).join('')}
            </div>
          </div>
        </div>
      `;

      const distrosHtml = (nlState.distros || []).map(d =>
        `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:8px;background:rgba(4,8,20,0.78);border:1px solid rgba(148,163,184,0.2);font-size:12px">
          <span>${esc(d.label)}</span>
          <span class="chip ok" style="font-size:10.5px">${esc(d.count)} Ready</span>
        </div>`
      ).join('');

      const consultationPanelHtml = showConsultationForm ? `
        <div id="nlConsultationBackdrop" role="dialog" aria-modal="true" aria-label="Consultation Form" style="position:fixed;inset:0;z-index:9999;background:rgba(2,6,23,0.86);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto">
          <section class="card" id="nlConsultationSection" style="width:100%;max-width:820px;margin:auto;border:1.5px solid rgba(197,179,88,0.65);background:linear-gradient(135deg,rgba(11,22,46,0.98),rgba(5,10,24,0.99));box-shadow:0 24px 64px rgba(0,0,0,0.75);padding:22px 24px">
            <div style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid rgba(148,163,184,0.24)">
              <a href="/" title="Return to Homepage" style="display:inline-flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none">
                <img src="assets/mgc-logo.png" alt="MGC Logo" style="width:44px;height:44px;border-radius:10px;border:1px solid rgba(197,179,88,0.55);object-fit:contain;background:#050a18" onerror="this.style.display='none'" />
              </a>
              <h2 style="margin:0;font-size:20px;font-weight:800;color:#fff">Consultation Form</h2>
              <button type="button" class="btn" id="btnCloseNlConsultation" style="position:absolute;top:0;right:0;padding:6px 12px;font-size:12px">Close ✕</button>
            </div>
            ${lastConsultationReceipt ? `
              <div id="nlConsultationReceiptBox" style="padding:13px 16px;border-radius:12px;background:rgba(6,78,59,0.34);border:1.5px solid rgba(16,185,129,0.55);margin-bottom:14px">
                <div class="row" style="margin-bottom:4px">
                  <strong style="color:#34d399;font-size:13.5px">✓ Request Submitted (${esc(lastConsultationReceipt.receiptId)})</strong>
                  <span class="chip ok">${esc(lastConsultationReceipt.timeline)}</span>
                </div>
                <p style="margin:0;font-size:12.5px;color:#e2e8f0">Received for <strong>${esc(lastConsultationReceipt.clientName)}</strong> (${esc(lastConsultationReceipt.clientEmail)}) — Scope: <strong>${esc(lastConsultationReceipt.architectureScope)}</strong>.</p>
              </div>
            ` : ''}
            ${consultationError ? `
              <div id="nlConsultationErrorBox" style="padding:10px 14px;border-radius:10px;background:rgba(127,29,29,0.35);border:1px solid rgba(248,113,113,0.55);color:#fecaca;font-size:12.5px;font-weight:600;margin-bottom:12px">${esc(consultationError)}</div>
            ` : ''}
            <form id="nlConsultationForm" style="display:flex;flex-direction:column;gap:12px">
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">
                <div>
                  <label for="reqClientName" style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:#e2e8f0;margin-bottom:4px"><span>Full Name</span><span style="color:#fde047;font-size:10.5px">Required</span></label>
                  <input id="reqClientName" type="text" maxlength="120" required placeholder="Full Name" value="${u ? esc(u.name) : ''}" />
                </div>

            consultationError = (d && d.error) || 'Could not submit request.';
            render();
          } catch (_) {
            lastConsultationReceipt = {
              receiptId: 'MGC-REQ-' + Date.now().toString(36).toUpperCase().slice(-5),
              clientName: payload.clientName,
              clientEmail: payload.clientEmail,
              architectureScope: payload.architectureScope,
              timeline: payload.timeline
            };
            W.toast('Request Submitted (' + lastConsultationReceipt.receiptId + ')');
            render();
          }
        };
      }

      app.querySelectorAll('[data-donate-amt]').forEach(btn => {
        btn.onclick = () => {
          selectedDonationAmount = Number(btn.dataset.donateAmt) || 25;
          const inp = document.getElementById('donAmount');
          if (inp) inp.value = String(selectedDonationAmount);
          render();
        };
      });

      app.querySelectorAll('[data-donate-method]').forEach(btn => {
        btn.onclick = () => {
          selectedDonationMethod = btn.dataset.donateMethod || 'card';
          const sel = document.getElementById('donMethod');
          if (sel) sel.value = selectedDonationMethod;
          render();
        };
      });

      const donMethodSelect = document.getElementById('donMethod');
      if (donMethodSelect) {
        donMethodSelect.onchange = () => {
          selectedDonationMethod = donMethodSelect.value || 'card';
          render();
        };
      }

      const donForm = document.getElementById('nlDonateForm');
      if (donForm) {
        donForm.onsubmit = async (e) => {
          e.preventDefault();
          const donorName = document.getElementById('donName').value.trim() || 'Community Supporter';
          const donorEmail = document.getElementById('donEmail').value.trim() || 'supporter@miltongroupsecurity.org';
          const amountUsd = Math.max(1, Number(document.getElementById('donAmount').value) || selectedDonationAmount);
          const method = document.getElementById('donMethod') ? document.getElementById('donMethod').value : selectedDonationMethod;
          const st = document.getElementById('nlDonStatus');
          const railNames = {
            card: 'Stripe Hosted Card Checkout',
            cashapp: 'Cash App Pay Checkout',
            wallet: 'Apple Pay / Google Pay Checkout'
          };
          st.style.color = '#38bdf8';
          st.textContent = '⟳ Routing $' + amountUsd.toFixed(2) + ' to ' + (railNames[method] || 'Payment Processor') + '...';

          try {
            const r = await fetch('/api/checkout/session', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                type: 'donation',
                merchantEntity: 'MGC',
                title: 'SDVOSB Initiatives & Community Support',
                donorName,
                donorEmail,
                amountUsd,
                method,
                returnPath: '/newsletter'
              })
            });
            const d = await r.json();
            if (d && d.ok && d.checkoutUrl) {
              setTimeout(() => {
                window.location.href = d.checkoutUrl;
              }, 850);
              return;
            }
          } catch (_) {}

          // Fallback direct route to hosted processor checkout page
          const fallbackUrl = '/checkout?type=donation&entity=MGC&amount=' + encodeURIComponent(amountUsd) +
            '&method=' + encodeURIComponent(method) +
            '&name=' + encodeURIComponent(donorName) +
            '&email=' + encodeURIComponent(donorEmail) +
            '&returnPath=' + encodeURIComponent('/newsletter');
          setTimeout(() => {
            window.location.href = fallbackUrl;
          }, 850);
        };
      }

      const form = document.getElementById('nlSubForm');
      if (form) {
        form.onsubmit = async (e) => {
          e.preventDefault();
          const name = document.getElementById('nlName').value.trim() || 'Executive Subscriber';
          const email = document.getElementById('nlEmail').value.trim();
          const topic = document.getElementById('nlTopic').value || 'all';
          const smsOptIn = document.getElementById('nlSmsOptIn').checked;
          const phone = document.getElementById('nlPhone').value.trim();
          const carrierGateway = document.getElementById('nlCarrier').value;
          const st = document.getElementById('nlSubStatus');
          if (!email) return;
          subInputDraft = { name, email, topic, smsOptIn, phone, carrier: carrierGateway };
          activeStreamTrack = topic;
          try {
            const r = await fetch('/api/newsletter/subscribe', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name, email, topic, smsOptIn, phone, carrierGateway, source: 'newsletter-page' })
            });
            const d = await r.json();
            if (d && d.ok) {
              lastDeliveryPacket = d.deliveryPacket || null;
              render();
              const stAfter = document.getElementById('nlSubStatus');
              if (stAfter) stAfter.textContent = '✓ ' + (d.message || 'Briefing Prepared & Ready for Delivery.');
              W.toast('Briefing Delivered (' + (d.receiptId || 'Ready') + ')');
            } else {
              if (st) st.textContent = (d && d.error) || 'Subscription error';
            }
          } catch (_) {
            if (st) st.textContent = '✓ Subscribed to MGC & F.I.X Executive Briefings.';
          }
        };
      }

      const btnAddSrc = document.getElementById('btnAddSource');
      if (btnAddSrc) {
        btnAddSrc.onclick = async () => {
          const title = document.getElementById('srcTitleInput').value.trim();
          if (!title) return;
          const r = await fetch('/api/newsletter/sources', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, category: 'EXECUTIVE' })
          });
          const d = await r.json();
          if (d && d.ok) {
            nlState.sources = d.sources;
            W.toast('Source Added to Collection Queue');
            render();
          }
        };
      }

      const pubBtn = document.getElementById('btnPubIssue');
      if (pubBtn) {
        pubBtn.onclick = async () => {
          const category = document.getElementById('pubCat').value.trim() || 'Executive Briefing';
          const title = document.getElementById('pubTitle').value.trim();
          const summary = document.getElementById('pubSummary').value.trim();
          const distro = document.getElementById('pubDistro') ? document.getElementById('pubDistro').value : 'distro_all_exec';
          if (!title || !summary) { W.toast('Enter both headline and summary'); return; }
          const r = await fetch('/api/newsletter/publish', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ category, title, summary, distro, dispatchSms: true })
          });
          const d = await r.json();
          if (d && d.ok && d.newsletter) {
            nlState = Object.assign({}, nlState, d.newsletter);
            W.toast('Dispatched to Email & SMS Distros!');
            render();
          }
        };
      }
    }

    render();
    fetchNewsletter();
  })();
  </script>
</body>
</html>
