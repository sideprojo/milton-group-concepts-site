name: Deploy MGC Site to Production (GitHub Pages & Cloud Run Ready)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MGC Production Repository
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assemble PUBLIC build (private/prototype/infra files are excluded)
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude 'access-admin.html' \
            --exclude 'member-portal.html' \
            --exclude 'agile-board.html' \
            --exclude 'request-access.html' \
            --exclude 'mgc-workspace-core.js' \
            --exclude 'firestore.rules' --exclude 'firestore.rules.README.md' \
            --exclude 'Dockerfile' --exclude 'Deploy-*.ps1' --exclude '.gitguardian.yaml'
          echo "Public files:"; find _site -maxdepth 1 -type f | sort
          # Fail the build if any private file slipped through
          for f in access-admin.html member-portal.html agile-board.html request-access.html mgc-workspace-core.js firestore.rules; do
            if [ -e "_site/$f" ]; then echo "PRIVATE FILE LEAKED: $f"; exit 1; fi
          done
      - name: Upload Static Site Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
