version: 2
secret:
  show-secrets: false
  ignored-paths:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/assets/**"
    - "**/*.min.js"
    - "zero-trust-edge-policy.json"
    - "server.js"
    - "mgc-workspace-core.js"
  ignored-matches:
    - name: "FIDO2 WebAuthn Passkey Assertion Preset Label (Non-Secret)"
      match: "PASSKEY::SOVEREIGN_ADMIN"
    - name: "FIDO2 WebAuthn Client Assertion Preset Label (Non-Secret)"
      match: "PASSKEY::VERIFIED_CLIENT"
    - name: "SSO Provider Display Label (Non-Secret UI Text)"
      match: "Email & Password"
    - name: "Revoked Historical Demo String (Non-Secret)"
      match: "Client#Verify2026!"
    - name: "Revoked Historical Fallback Salt Suffix (Non-Secret)"
      match: "::mgc-fix-zero-trust-secret-v1"
    - name: "Revoked Historical Non-Reversible Demo Digest 1"
      match: "2e2fce3751cac96e"
