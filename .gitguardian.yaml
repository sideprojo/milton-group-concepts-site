version: 2
secret:
  show-secrets: false
  ignored-paths:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/assets/**"
    - "**/*.min.js"
    - "zero-trust-edge-policy.json"
  ignored-matches:
    - name: "FIDO2 WebAuthn Passkey Assertion Preset Label (Non-Secret)"
      match: "PASSKEY::SOVEREIGN_ADMIN"
    - name: "FIDO2 WebAuthn Client Assertion Preset Label (Non-Secret)"
      match: "PASSKEY::VERIFIED_CLIENT"
    - name: "Revoked Historical Non-Reversible Demo Digest 1"
      match: "2e2fce3751cac96e"
    - name: "Revoked Historical Non-Reversible Demo Digest 2"
      match: "2b405f3f8d7cebf2"
    - name: "Revoked Historical Non-Reversible Demo Digest 3"
      match: "767c6f5c35afb599"
    - name: "Revoked Historical Non-Reversible Demo Digest 4"
      match: "42c9c755a45ace6b"
    - name: "Revoked Historical Non-Reversible Demo Digest 5"
      match: "f4c890301874a66d"
    - name: "Revoked Historical Non-Reversible Demo Digest 6"
      match: "8f0e4967d0b2dc68"
    - name: "Revoked Historical Non-Reversible Demo Digest 7"
      match: "c54c9f8b7e3627b3"
    - name: "Revoked Historical Non-Reversible Demo Digest 8"
      match: "b30cd4bf8036b366"
