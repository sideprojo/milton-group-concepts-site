<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agile Board | MGC Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
.ws-layout{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:start}
.ws-side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;position:sticky;top:64px;display:flex;flex-direction:column;gap:4px}
.ws-side-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);padding:4px 8px 6px}
.ws-nav-btn{width:100%;text-align:left;padding:9px 11px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--mut);font-size:12.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all .14s ease;text-decoration:none}
.ws-nav-btn:hover{background:rgba(148,163,184,0.08);color:var(--ink)}
.ws-nav-btn.active{background:rgba(37,99,235,0.16);border-color:rgba(59,130,246,0.45);color:#fff;font-weight:600}
.ws-main{min-width:0}
.cols{display:grid;grid-template-columns:repeat(5,minmax(175px,1fr));gap:10px;overflow-x:auto}
.col{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:180px}
.col h3{margin:0 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between}
.it{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;font-size:12px}
.it b{display:block;margin-bottom:4px;color:#f8fafc}
.it-meta{font-size:11px;color:#94a3b8;font-weight:500}
.it .mv{display:flex;gap:4px;margin-top:6px}.it .mv .btn{padding:3px 8px;font-size:11px}
@media(max-width:960px){.ws-layout{grid-template-columns:1fr}.ws-side{position:static;flex-direction:row;flex-wrap:wrap}}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
</style>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <meta property="og:image" content="assets/og-mgc-banner.jpg">
</head>
<body>
<main class="wrap" id="app"></main>
<script src="mgc-workspace-core.js"></script>
<script>
(function () {
  const W = MGCW, S = () => W.S, esc = W.esc, app = document.getElementById('app');
  const u = W.me();
  const COLS = [['backlog', 'Backlog'], ['ready', 'Ready'], ['progress', 'In progress'], ['review', 'Review'], ['done', 'Done']];
  let pid = null, view = 'board';
  if (!u) { app.innerHTML = '<div class="card lock"><h1 style="margin-top:4px">Single Sign-On Required</h1><p>Please authenticate with <b>Google</b>, <b>Microsoft</b>, or <b>Apple</b> SSO to access Agile Projects.</p><div style="margin-top:14px"><a class="btn pri" href="login.html?next=/agile-board.html">Sign In with SSO →</a></div></div>'; W.header('agile-board.html'); return; }
  if (u.role !== 'owner' && !W.can(u, 'page', 'agile', 'view')) {
    app.innerHTML = '<div class="card lock"><h1>Agile Board Locked</h1><p>Your Agile Board is not active yet. Check <a href="member-portal.html">My Workspace</a>.</p></div>'; W.header('agile-board.html'); return;
  }
  const isSoleAdmin = () => u && (u.role === 'owner' || String(u.email || '').toLowerCase() === 'mkhabir@miltongroupsecurity.org');
  const isEmp = () => u && (u.role === 'employee' || u.ou === 'Internal Staff');
  const visible = () => Object.values(S().projects).filter(p => W.can(u, 'project', p.id, 'view'));
  const canEdit = (p) => W.can(u, 'project', p, 'edit');
  const note = (k) => JSON.parse(localStorage.getItem('mgcw.notes.' + k) || '""');

  function board(p) {
    const items = S().items.filter(i => i.project === p);
    const ed = canEdit(p);
    return '<div class="cols">' + COLS.map(c => { const l = items.filter(i => i.col === c[0]);
      return '<div class="col"><h3><span>' + c[1] + '</span><span>' + l.reduce((a, i) => a + i.points, 0) + ' pts</span></h3>' + l.map(i => card(i, ed)).join('') + '</div>'; }).join('') + '</div>';
  }
  function card(i, ed) {
    const idx = COLS.findIndex(c => c[0] === i.col);
    const assigneeLabel = i.assignee ? ((S().users[i.assignee] || {}).name ? S().users[i.assignee].name.split(' ')[0] : i.assignee) : '';
    return '<div class="it"><b>' + esc(i.title) + '</b><div class="it-meta">' + esc(i.type) + ' · ' + i.points + ' pt' + (assigneeLabel ? ' · ' + esc(assigneeLabel) : '') + '</div>' +
      (ed ? '<div class="mv"><button class="btn" data-mv="' + i.id + ':-1"' + (idx === 0 ? ' disabled' : '') + '>←</button><button class="btn" data-mv="' + i.id + ':1"' + (idx === COLS.length - 1 ? ' disabled' : '') + '>→</button></div>' : '') + '</div>';
  }
  function burndown(p) {
    const items = S().items.filter(i => i.project === p && i.sprint === 1);
    const total = items.reduce((a, i) => a + i.points, 0) || 1; const left = items.filter(i => i.col !== 'done').reduce((a, i) => a + i.points, 0);
    const yNow = 10 + (1 - left / total) * 70;
    return '<div class="card"><h2>Sprint 1 Burndown</h2><svg viewBox="0 0 220 90" width="100%" height="110"><line x1="10" y1="10" x2="210" y2="80" stroke="#888" stroke-dasharray="4"/><polyline fill="none" stroke="var(--ac)" stroke-width="3" points="10,10 110,' + yNow.toFixed(1) + '"/><circle cx="110" cy="' + yNow.toFixed(1) + '" r="4" fill="var(--ac)"/></svg><p>' + left + ' of ' + total + ' pts remaining · dashed = ideal pace</p></div>';
  }
  function ceremonies(p) {
    const C = [['planning', 'Sprint planning', 'Goal, capacity, committed stories'], ['standup', 'Daily stand-up', 'Yesterday / today / blockers'], ['review', 'Sprint review', 'Demo notes + stakeholder feedback'], ['retro', 'Retrospective', 'Keep / stop / try']];
    return '<div class="card"><h2>Ceremonies</h2>' + C.map(c => '<details><summary>' + c[1] + '</summary><textarea data-note="' + p + ':' + c[0] + '" rows="3" style="width:100%;margin-top:6px"' + (canEdit(p) ? '' : ' readonly') + ' placeholder="' + c[2] + '">' + esc(note(p + ':' + c[0])) + '</textarea></details>').join('') + '</div>';
  }
  function features() {
    const list = S().features.slice().sort((a, b) => b.votes.length - a.votes.length);
    return '<div class="card"><h2>Feature Requests (' + list.length + ')</h2>' + list.map(f => '<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><span><b>' + esc(f.title) + '</b><br><span style="font-size:12px;color:var(--mut)">' + esc((S().users[f.by] || {}).name || f.by) + ' · ' + esc(f.status) + '</span></span><span class="nav"><button class="btn" data-vote="' + f.id + '">▲ ' + f.votes.length + '</button>' + (u.role === 'owner' && f.status === 'new' ? '<button class="btn pri" data-promote="' + f.id + '">→ Backlog</button>' : '') + '</span></div>').join('') + '</div>';
  }

  function render() {
    const vis = visible();
    if (!pid || !vis.find(p => p.id === pid)) pid = vis[0] && vis[0].id;
    const curProj = pid ? S().projects[pid] : null;
    const tabs = [['board', 'Kanban Board'], ['plan', 'Sprint & Ceremonies'], ['features', 'Feature Requests']];
    let body;
    if (view === 'features') body = features();
    else if (!pid) body = '<div class="card lock"><h2>No shared projects yet</h2><p>Projects appear here only when the owner shares them with you.</p></div>';
    else if (view === 'plan') body = '<div class="bento-2">' + burndown(pid) + ceremonies(pid) + '</div>';
    else body = board(pid) + (canEdit(pid) ? '<div class="card" style="margin-top:10px"><div class="row" style="justify-content:flex-start"><input id="nt" placeholder="New story / task / bug" style="flex:1;min-width:200px"><select id="ntype"><option>story</option><option>task</option><option>bug</option></select><select id="npts"><option>1</option><option>2</option><option>3</option><option selected>5</option><option>8</option></select><button class="btn pri" id="nadd">Add to backlog</button></div></div>' : '<p>You have view-only access to this project.</p>');
    const projMeta = curProj && curProj.demoUrl
      ? '<div class="nav"><a class="btn pri" href="' + esc(curProj.demoUrl) + '" target="_blank" rel="noopener">Launch App ↗</a></div>'
      : '';

    const sideNav = '<aside class="ws-side" aria-label="Authorized User Navigation">' +
      '<div class="ws-side-title">Workspace</div>' +
      '<a class="ws-nav-btn" href="member-portal.html"><span>Applications</span></a>' +
      '<a class="ws-nav-btn" href="member-portal.html?view=resources"><span>Resources &amp; Otto</span></a>' +
      '<a class="ws-nav-btn" href="member-portal.html?view=consultation"><span>Consultations</span></a>' +
      '<a class="ws-nav-btn" href="member-portal.html?view=payment"><span>Billing &amp; Payment</span></a>' +
      '<a class="ws-nav-btn" href="member-portal.html?view=overview"><span>Overview Checklist</span></a>' +
      '<a class="ws-nav-btn active" href="agile-board.html"><span>Agile Delivery</span></a>' +
      (isSoleAdmin() ? '<a class="ws-nav-btn" href="access-admin.html" style="border-color:rgba(197,179,88,0.42);color:#fde047"><span>Directory &amp; Console</span></a>' : '') +
      (isEmp() ? '<a class="ws-nav-btn" href="access-admin.html?tab=users&amp;ou=external" style="border-color:rgba(59,130,246,0.42);color:#93c5fd"><span>Client Directory</span></a>' : '') +
      '</aside>';

    const pItems = pid ? S().items.filter(i => i.project === pid) : [];
    const totalPts = pItems.reduce((a, i) => a + (Number(i.points) || 0), 0);
    const donePts = pItems.filter(i => i.col === 'done').reduce((a, i) => a + (Number(i.points) || 0), 0);
    const progPts = pItems.filter(i => i.col === 'progress' || i.col === 'review').reduce((a, i) => a + (Number(i.points) || 0), 0);
    const pctDone = totalPts ? Math.round((donePts / totalPts) * 100) : 0;
    const roleBadge = isSoleAdmin() ? 'Administrator · Full Access' : (isEmp() ? 'Internal Staff · Client Delivery' : 'Workspace Partner · Active');
    const telemetryRibbon =
      '<div id="agileTelemetryRibbon" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px">' +
        '<div class="card" style="padding:10px 12px;border-color:rgba(16,185,129,0.4);background:rgba(6,20,34,0.88)">' +
          '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#34d399">Workspace Security Tier</div>' +
          '<div style="font-size:12.5px;font-weight:800;color:#fff;margin-top:3px">' + esc(roleBadge) + '</div>' +
          '<div style="font-size:10.5px;color:#94a3b8;margin-top:2px">Project Access Active</div>' +
        '</div>' +
        '<div class="card" style="padding:10px 12px;border-color:rgba(59,130,246,0.4);background:rgba(6,16,34,0.88)">' +
          '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#60a5fa">Sprint Velocity &amp; Scope</div>' +
          '<div style="font-size:15px;font-weight:900;color:#fff;margin-top:3px">' + donePts + ' / ' + totalPts + ' pts <span style="font-size:11px;color:#34d399">(' + pctDone + '%)</span></div>' +
          '<div style="font-size:10.5px;color:#94a3b8;margin-top:2px">' + pItems.length + ' Active Deliverable Stories</div>' +
        '</div>' +
        '<div class="card" style="padding:10px 12px;border-color:rgba(197,179,88,0.42);background:rgba(18,16,8,0.85)">' +
          '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#fde047">In-Flight &amp; Review</div>' +
          '<div style="font-size:15px;font-weight:900;color:#fff;margin-top:3px">' + progPts + ' pts Active</div>' +
          '<div style="font-size:10.5px;color:#94a3b8;margin-top:2px">Updated in Real Time</div>' +
        '</div>' +
        '<div class="card" id="agileCompanionCard" style="padding:10px 12px;border-color:rgba(16,185,129,0.45);background:rgba(6,20,34,0.92);display:flex;align-items:center;gap:10px">' +
          (W.renderAnimatedAvatarSvg ? W.renderAnimatedAvatarSvg(isSoleAdmin() ? 'sovereign' : (isEmp() ? 'sentinel' : 'atlas'), 42) : '') +
          '<div><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#34d399">' + (isSoleAdmin() ? 'Sovereign Core' : (isEmp() ? 'Sentinel Guide' : 'Atlas Guide')) + '</div>' +
          '<div style="font-size:12px;font-weight:800;color:#fff;margin-top:2px">● ' + (isSoleAdmin() ? 'SML Controller' : 'Guided Companion') + '</div></div>' +
        '</div>' +
      '</div>';
    const mainContent =
      telemetryRibbon +
      '<div class="card" style="margin-bottom:12px">' +
        '<div class="row">' +
          '<div><h1 style="margin:0 0 2px;font-size:18px;font-weight:700">Project Delivery Board</h1><p style="font-size:12px;margin:0">Select a step or move tasks across your delivery board.</p></div>' +
          '<div class="nav">' +
            '<select id="proj" aria-label="Project">' + vis.map(p => '<option value="' + p.id + '"' + (p.id === pid ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') + '</select>' +
            tabs.map(t => '<button class="btn' + (t[0] === view ? ' pri' : '') + '" data-vtab="' + t[0] + '">' + t[1] + '</button>').join('') +
            projMeta +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div>' + body + '</div>';

    app.innerHTML = '<div class="ws-layout">' + sideNav + '<div class="ws-main">' + mainContent + '</div></div>';
    W.header('agile-board.html'); bind();
  }
  function bind() {
    const pr = document.getElementById('proj'); if (pr) pr.onchange = (e) => { pid = e.target.value; render(); };
    app.querySelectorAll('[data-vtab]').forEach(b => b.onclick = () => { view = b.dataset.vtab; render(); });
    app.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { const [id, d] = b.dataset.mv.split(':'); const it = S().items.find(i => i.id === id); if (!canEdit(it.project)) return; const i = COLS.findIndex(c => c[0] === it.col) + Number(d); if (COLS[i]) { it.col = COLS[i][0]; W.log(u.id, 'item.move', it.title + ' → ' + it.col); W.commit(); render(); } });
    const na = document.getElementById('nadd'); if (na) na.onclick = () => { const t = document.getElementById('nt').value.trim(); if (!t || !canEdit(pid)) return; S().items.push({ id: W.uid('i'), project: pid, type: document.getElementById('ntype').value, title: t, points: Number(document.getElementById('npts').value), col: 'backlog', sprint: 0, assignee: '', createdBy: u.id }); W.log(u.id, 'item.create', t); W.commit(); render(); };
    app.querySelectorAll('[data-note]').forEach(t => t.onchange = () => localStorage.setItem('mgcw.notes.' + t.dataset.note, JSON.stringify(t.value)));
    app.querySelectorAll('[data-vote]').forEach(b => b.onclick = () => { const f = S().features.find(x => x.id === b.dataset.vote); if (!f.votes.includes(u.id)) { f.votes.push(u.id); W.commit(); render(); } });
    app.querySelectorAll('[data-promote]').forEach(b => b.onclick = () => { const f = S().features.find(x => x.id === b.dataset.promote); f.status = 'planned'; const target = pid || 'p1'; S().items.push({ id: W.uid('i'), project: target, type: 'story', title: f.title, points: 3, col: 'backlog', sprint: 0, assignee: '', createdBy: u.id }); W.notify(f.by, 'Your feature request was planned', f.title); W.log(u.id, 'feature.promote', f.title); W.commit(); W.toast('Added to backlog'); render(); });
  }
  render();
})();
</script>
</body>
</html>
