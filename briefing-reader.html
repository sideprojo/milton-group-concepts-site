<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Executive Dispatch — Reader Edition | Milton Group Concepts &amp; F.I.X Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <style>
    :root {
      --paper-bg: #070d19;
      --paper-surface: rgba(12, 21, 39, 0.96);
      --paper-elevated: rgba(17, 29, 54, 0.94);
      --ink-primary: #f8fafc;
      --ink-body: #e2e8f0;
      --ink-muted: #94a3b8;
      --ink-Dek: #cbd5e1;
      --rule-strong: rgba(197, 179, 88, 0.65);
      --rule-subtle: rgba(148, 163, 184, 0.22);
      --gold: #C5B358;
      --gold-bright: #fde047;
      --accent-blue: #38bdf8;
      --ad-bg: rgba(15, 25, 48, 0.88);
      --ad-border: rgba(197, 179, 88, 0.35);
      --body-font-size: 21.5px;
      --body-line-height: 1.82;
    }

    body.theme-ivory {
      --paper-bg: #fbf7ef;
      --paper-surface: #fffdf9;
      --paper-elevated: #f4efe4;
      --ink-primary: #0f172a;
      --ink-body: #1e293b;
      --ink-muted: #475569;
      --ink-Dek: #334155;
      --rule-strong: #856a20;
      --rule-subtle: rgba(15, 23, 42, 0.15);
      --gold: #8a6d1b;
      --gold-bright: #713f12;
      --accent-blue: #0369a1;
      --ad-bg: #f5f0e4;
      --ad-border: rgba(138, 109, 27, 0.32);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--paper-bg);
      color: var(--ink-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.72s cubic-bezier(0.22, 1, 0.36, 1), color 0.72s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Watched Theme & Track Color Transition System */
    .article-sheet,
    .rail-card,
    .signal-matrix-grid,
    .signal-metric-cell,
    .editorial-pullquote,
    .playbook-box,
    .deliverable-suite-bar,
    .native-sponsor-unit,
    .wire-item-btn,
    .prog-pill,
    .reader-btn,
    .news-headline,
    .news-dek,
    .news-body,
    .masthead,
    .masthead-top,
    .byline-bar {
      transition:
        background-color 0.72s cubic-bezier(0.22, 1, 0.36, 1),
        color 0.65s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.68s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.72s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.25s ease;
    }

    /* Watched Radial Wash Overlay for Entering Financial Ivory vs Returning to Obsidian Thematic Colors */
    .theme-wash-veil {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9995;
      opacity: 0;
    }
    .theme-wash-veil.wash-to-ivory {
      background: radial-gradient(circle at 65% 22%, rgba(251, 247, 239, 0.88) 0%, rgba(245, 240, 228, 0.58) 48%, rgba(197, 179, 88, 0.18) 100%);
      animation: watchedWashPulse 0.78s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .theme-wash-veil.wash-to-obsidian {
      background: radial-gradient(circle at 65% 22%, rgba(7, 13, 25, 0.92) 0%, rgba(12, 21, 39, 0.65) 50%, rgba(56, 189, 248, 0.16) 100%);
      animation: watchedWashPulse 0.78s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes watchedWashPulse {
      0% { opacity: 0; transform: scale(0.96); }
      34% { opacity: 0.92; transform: scale(1.01); }
      100% { opacity: 0; transform: scale(1.04); }
    }
    .theme-status-pill {
      position: fixed;
      bottom: 22px;
      right: 26px;
      z-index: 9997;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.05em;
      background: var(--paper-elevated);
      color: var(--gold);
      border: 1.5px solid var(--rule-strong);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.42);
      pointer-events: none;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.35s ease, transform 0.35s ease, background-color 0.65s ease, color 0.65s ease;
    }
    .theme-status-pill.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .broadsheet-shell {
      max-width: 1240px;
      margin: 0 auto;
      padding: 18px 28px 64px;
    }

    /* Classic Double-Rule Newspaper Masthead */
    .masthead {
      border-top: 3px solid var(--rule-strong);
      border-bottom: 1px solid var(--rule-subtle);
      padding: 14px 0 12px;
      margin-bottom: 24px;
    }
    .masthead-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--rule-subtle);
    }
    .masthead-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: inherit;
    }
    .masthead-brand img {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--rule-strong);
      object-fit: contain;
      background: #050a18;
    }
    .masthead-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(22px, 2.6vw, 31px);
      font-weight: 900;
      letter-spacing: 0.03em;
      line-height: 1.05;
      color: var(--ink-primary);
    }
    .masthead-sub {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 3px;
    }
    .masthead-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .reader-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--rule-subtle);
      background: var(--paper-elevated);
      color: var(--ink-primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.18s ease;
    }
    .reader-btn:hover {
      border-color: var(--gold);
      transform: translateY(-1px);
    }
    .reader-btn.active, .reader-btn.pri {
      background: linear-gradient(135deg, #C5B358, #a38f36);
      color: #050a18;
      border-color: #fde047;
      font-weight: 800;
    }
    .masthead-dateline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 10px;
      font-size: 11.5px;
      color: var(--ink-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* Two-Column Editorial Grid */
    .editorial-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 34px;
      align-items: start;
    }
    @media (max-width: 980px) {
      .editorial-grid {
        grid-template-columns: 1fr;
      }
      .broadsheet-shell {
        padding: 14px 16px 48px;
      }
    }

    /* Main Broadsheet Article Sheet */
    .article-sheet {
      position: relative;
      overflow: hidden;
      background: var(--paper-surface);
      border: 1px solid var(--rule-subtle);
      border-top: 4px solid var(--gold);
      border-radius: 16px;
      padding: clamp(24px, 4vw, 44px);
      box-shadow: 0 22px 58px rgba(0, 0, 0, 0.32);
    }

    /* Atmospheric Faded Background Image Watermark in Reader */
    .reader-atmo-backdrop {
      position: absolute;
      top: 0;
      right: 0;
      width: 68%;
      height: 430px;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      -webkit-mask-image:
        radial-gradient(ellipse 92% 88% at 78% 24%, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.55) 48%, rgba(0, 0, 0, 0.12) 74%, transparent 96%),
        linear-gradient(180deg, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.72) 58%, transparent 100%);
      -webkit-mask-composite: source-in;
      mask-image:
        radial-gradient(ellipse 92% 88% at 78% 24%, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.55) 48%, rgba(0, 0, 0, 0.12) 74%, transparent 96%),
        linear-gradient(180deg, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.72) 58%, transparent 100%);
      mask-composite: intersect;
    }
    .reader-atmo-backdrop img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 28%;
      opacity: 0.24;
      filter: grayscale(28%) contrast(1.08) saturate(0.85);
      transform: scale(1.03);
      transition: opacity 0.65s ease, filter 0.65s ease, transform 0.85s ease;
    }
    body.theme-ivory .reader-atmo-backdrop img {
      opacity: 0.16;
      filter: grayscale(65%) sepia(24%) contrast(1.05);
      mix-blend-mode: multiply;
    }
    .article-sheet > *:not(.reader-atmo-backdrop) {
      position: relative;
      z-index: 1;
    }
    .editorial-visual-plate {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin: -6px 0 18px 0;
      padding: 6px 11px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.42);
      border: 1px solid var(--rule-subtle);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10.5px;
      color: var(--ink-muted);
    }
    body.theme-ivory .editorial-visual-plate {
      background: rgba(244, 239, 228, 0.72);
    }

    .article-kicker-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .kicker-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(197, 179, 88, 0.14);
      border: 1px solid var(--rule-strong);
      color: var(--gold);
    }
    .source-tag {
      padding: 3px 9px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      font-weight: 800;
      color: #050a18;
      background: #f97316;
    }

    /* Large News Lettering Headline */
    .news-headline {
      font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
      font-size: clamp(29px, 3.5vw, 43px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.015em;
      margin: 0 0 16px 0;
      color: var(--ink-primary);
    }

    /* Editorial Standfirst / Deck */
    .news-dek {
      font-family: 'Newsreader', Georgia, serif;
      font-size: clamp(19px, 2.1vw, 23px);
      font-style: italic;
      font-weight: 400;
      line-height: 1.5;
      color: var(--ink-Dek);
      margin: 0 0 22px 0;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--rule-subtle);
    }

    /* Byline & Metadata Ribbon */
    .byline-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px double var(--rule-subtle);
      font-size: 12.5px;
      color: var(--ink-muted);
    }

    /* Large News Lettering 1-3 Paragraph Body */
    .news-body {
      font-family: 'Newsreader', Georgia, 'Times New Roman', serif;
      font-size: var(--body-font-size);
      line-height: var(--body-line-height);
      color: var(--ink-body);
      max-width: 68ch;
      overflow-wrap: break-word;
      word-break: normal;
      hyphens: auto;
    }
    .news-body p {
      margin: 0 0 22px 0;
      text-align: left;
      text-indent: 1.65em;
      text-rendering: optimizeLegibility;
      letter-spacing: 0.004em;
    }
    .news-body p.lead-paragraph {
      text-indent: 0;
    }
    .news-body p.lead-paragraph::first-letter {
      float: left;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 3.15em;
      line-height: 0.88;
      margin-top: 2px;
      margin-right: 12px;
      margin-bottom: -2px;
      font-weight: 800;
      color: var(--gold);
    }

    /* Editorial Source Reference Callout & Quick Redirecting Notice */
    .source-ref-callout {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin: 0 0 24px 0;
      padding: 12px 16px;
      border-radius: 10px;
      background: var(--paper-elevated);
      border: 1px solid var(--rule-subtle);
      border-left: 3px solid var(--gold);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: var(--ink-body);
    }
    .source-ref-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 13px;
      border-radius: 8px;
      background: rgba(197, 179, 88, 0.16);
      border: 1px solid var(--rule-strong);
      color: var(--gold);
      font-weight: 700;
      font-size: 12.5px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .source-ref-link:hover {
      background: linear-gradient(135deg, #C5B358, #a38f36);
      color: #050a18;
      border-color: #fde047;
      transform: translateY(-1px);
    }
    .redirect-notice-banner {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-16px);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 20px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(10, 18, 36, 0.98), rgba(17, 29, 54, 0.98));
      border: 1.5px solid #fde047;
      color: #f8fafc;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.65);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .redirect-notice-banner.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Editorial Pull-Quote */
    .editorial-pullquote {
      margin: 28px 0;
      padding: 20px 24px;
      border-top: 2px solid var(--rule-strong);
      border-bottom: 1px solid var(--rule-strong);
      background: var(--paper-elevated);
      border-radius: 10px;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: calc(var(--body-font-size) * 0.98);
      font-style: italic;
      font-weight: 600;
      line-height: 1.52;
      color: var(--ink-primary);
    }

    /* Executive Impact & Signal Matrix */
    .signal-matrix-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 0 0 26px 0;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--paper-elevated);
      border: 1px solid var(--rule-subtle);
    }
    @media (max-width: 720px) {
      .signal-matrix-grid {
        grid-template-columns: 1fr;
      }
    }
    .signal-metric-cell {
      padding: 8px 11px;
      border-radius: 9px;
      background: var(--paper-surface);
      border: 1px solid var(--rule-subtle);
    }
    .signal-metric-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 4px;
    }
    .signal-metric-value {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--gold);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* 3-Step Actionable Implementation Playbook */
    .playbook-box {
      margin: 28px 0;
      padding: 20px 24px;
      border-radius: 14px;
      background: var(--paper-elevated);
      border: 1.5px solid var(--rule-strong);
    }
    .playbook-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--rule-subtle);
    }
    .playbook-step {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 12px;
      align-items: start;
      margin-bottom: 11px;
      font-size: 14.5px;
      line-height: 1.55;
      color: var(--ink-body);
    }
    .playbook-step:last-child {
      margin-bottom: 0;
    }
    .playbook-step-num {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: rgba(197, 179, 88, 0.2);
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: monospace;
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }

    /* Executive Deliverable Export Suite */
    .deliverable-suite-bar {
      margin-top: 24px;
      padding: 16px 20px;
      border-radius: 12px;
      background: var(--paper-elevated);
      border: 1px solid var(--rule-subtle);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Non-Intrusive Native Sponsor Units (Axios / FT / Carbon Style) */
    .native-sponsor-unit {
      margin-top: 30px;
      padding: 18px 22px;
      border-radius: 12px;
      background: var(--ad-bg);
      border: 1px solid var(--ad-border);
      transition: border-color 0.2s ease;
    }
    .native-sponsor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .native-sponsor-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink-primary);
      margin: 0 0 6px 0;
    }
    .native-sponsor-copy {
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--ink-body);
      margin: 0 0 12px 0;
    }

    /* Sidebar Cards */
    .rail-card {
      background: var(--paper-surface);
      border: 1px solid var(--rule-subtle);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 18px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.22);
    }
    .rail-heading {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      margin: 0 0 12px 0;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--rule-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .wire-item-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 11px 12px;
      margin-bottom: 8px;
      border-radius: 10px;
      border: 1px solid var(--rule-subtle);
      background: var(--paper-elevated);
      color: var(--ink-primary);
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .wire-item-btn:hover, .wire-item-btn.active {
      border-color: var(--gold);
      transform: translateX(2px);
    }
    .prog-pill {
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--rule-subtle);
      background: var(--paper-elevated);
      color: var(--ink-primary);
      cursor: pointer;
    }
    .prog-pill.active {
      border-color: var(--gold);
      background: rgba(197, 179, 88, 0.18);
      color: var(--gold);
    }
    @media print {
      .masthead-controls, .editorial-rail, .native-sponsor-unit { display: none !important; }
      .editorial-grid { grid-template-columns: 1fr !important; }
      body { background: #fff !important; color: #000 !important; }
      .article-sheet { border: none !important; box-shadow: none !important; padding: 0 !important; }
    }
  </style>
</head>
<body>
  <div class="theme-wash-veil" id="themeWashVeil" aria-hidden="true"></div>
  <div class="theme-status-pill" id="themeStatusPill" role="status" aria-live="polite"></div>
  <div class="redirect-notice-banner" id="redirectNoticeBanner" role="status" aria-live="assertive"></div>
  <div class="broadsheet-shell" id="readerRoot"></div>

  <script>
  (function () {
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const DEFAULT_STORIES = [
      {
        id: 'mgc-live-1',
        source: 'Reuters',
        sourceCode: 'REUTERS',
        accentColor: '#f97316',
        title: 'Enterprise Teams Shift AI Budgets Toward Focused Task Agents and Lower Cloud Spend',

    function cleanEditorialText(raw, fallbackUrlHolder) {
      let s = String(raw == null ? '' : raw);
      const hrefMatch = s.match(/href\s*=\s*["']?(https?:\/\/[^\s"'<>]+)/i);
      if (hrefMatch && fallbackUrlHolder && (!fallbackUrlHolder.url || fallbackUrlHolder.url === 'https://news.google.com/')) {
        fallbackUrlHolder.url = hrefMatch[1].trim();
      }
      for (let i = 0; i < 3; i++) {
        s = s
          .replace(/&nbsp;|&#160;/gi, ' ')
          .replace(/&lt;|&#60;/gi, '<')
          .replace(/&gt;|&#62;/gi, '>')
          .replace(/&quot;|&#34;/gi, '"')
          .replace(/&#39;|&apos;|&#8216;|&#8217;/gi, "'")
          .replace(/&amp;|&#38;/gi, '&');
      }
      return s
        .replace(/<a\b[^>]*>([\s\S]*?)<\/a>/gi, '$1. ')
        .replace(/<font\b[^>]*>[\s\S]*?<\/font>/gi, ' ')
        .replace(/<[^>]*>/g, ' ')
        .replace(/&lt;\s*\/?\s*[a-z0-9]+[^&]*&gt;/gi, ' ')
        .replace(/\b(?:href|target|rel|font|color|style)\s*=\s*["']?[^\s"'<>]+["']?/gi, ' ')
        .replace(/https?:\/\/\S+/gi, ' ')
        .replace(/^\s*(?:&lt;|<)?\s*a\b[^A-Z]*/i, '')
        .replace(/\.\s*\./g, '.')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function downloadFileBlob(filename, mimeType, content) {
      const blob = new Blob([content], { type: mimeType });

      const a = document.createElement('a');

      a.download = filename;
      document.body.appendChild(a);

      }, 200);
    }

        if (r.ok) {
          const d = await r.json();
          if (d && d.ok && Array.isArray(d.items) && d.items.length) {
            allStories = d.items.map(normalizeStory);
            const qs = new URLSearchParams(location.search);
            const targetId = qs.get('id');
            if (targetId) {
              const matched = allStories.find(s => s.id === targetId);
              if (matched) activeStory = matched;
            }
            render();
          }
        }
      } catch (_) {}
    }

    function applyTypographyAndTheme() {
      const sizes = ['19px', '21.5px', '24.5px'];
      document.documentElement.style.setProperty('--body-font-size', sizes[fontSizeLevel] || '21.5px');
      document.body.classList.toggle('theme-ivory', themeMode === 'ivory');
      const toggleBtn = document.getElementById('btnToggleTheme');
      if (toggleBtn) {
        toggleBtn.innerHTML = themeMode === 'ivory' ? '🌙 Obsidian Paper' : '📰 Financial Ivory';
      }
    }

    let themeStatusTimer = null;
    function triggerWatchedThemeTransition(targetTheme, reasonLabel) {
      const prevTheme = themeMode;
      themeMode = targetTheme;
      const veil = document.getElementById('themeWashVeil');
      if (veil && prevTheme !== targetTheme) {
        veil.className = 'theme-wash-veil ' + (targetTheme === 'ivory' ? 'wash-to-ivory' : 'wash-to-obsidian');
        setTimeout(() => {
          if (veil) veil.className = 'theme-wash-veil';
        }, 820);
      }
      applyTypographyAndTheme();
      const pill = document.getElementById('themeStatusPill');
      if (pill) {
        pill.textContent = targetTheme === 'ivory'
          ? '📰 Transitioned to Financial Ivory Broadsheet Paper' + (reasonLabel ? ' · ' + reasonLabel : '')
          : '🌙 Returned to MGC Obsidian Thematic Colors' + (reasonLabel ? ' · ' + reasonLabel : '');
        pill.classList.add('visible');
        if (themeStatusTimer) clearTimeout(themeStatusTimer);
        themeStatusTimer = setTimeout(() => {
          pill.classList.remove('visible');
        }, 2800);
      }
    }

    function toggleSpeech() {
      if (!('speechSynthesis' in window)) return;
      if (isSpeaking) {
        window.speechSynthesis.cancel();
        isSpeaking = false;
        render();
        return;
      }
      window.speechSynthesis.cancel();
      const paras = ensureThreeParagraphs(activeStory);
      const utter = new SpeechSynthesisUtterance(
        activeStory.title + '. ' + (activeStory.dek || '') + '. ' + paras.join(' ')
      );
      utter.rate = 0.98;
      utter.onend = () => { isSpeaking = false; render(); };
      utter.onerror = () => { isSpeaking = false; render(); };
      isSpeaking = true;
      window.speechSynthesis.speak(utter);
      render();
    }

    function render() {
      applyTypographyAndTheme();
      const root = document.getElementById('readerRoot');
      const paras = ensureThreeParagraphs(activeStory);
      const dateStr = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

      root.innerHTML = `
        <header class="masthead">
          <div class="masthead-top">
            <a href="/newsletter" class="masthead-brand" title="Return to Executive Newsletter Feed">
              <div>
                <div class="masthead-title">THE EXECUTIVE DISPATCH</div>
                <div class="masthead-sub">Commercial · Federal · Cyber &amp; Cloud Reader Edition</div>
              </div>
            </a>

            <div class="masthead-controls" role="toolbar" aria-label="Reader Typography and Appearance Controls">
              <a href="/" class="reader-btn" title="Milton Group Concepts Home" aria-label="Milton Group Concepts Home" style="width:68px;height:34px;padding:0;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid rgba(197,179,88,0.65);border-radius:8px;background:linear-gradient(135deg,#152952 0%,#283862 45%,#7e1f2e 100%);box-shadow:0 3px 10px rgba(0,0,0,0.4)">
                <img src="assets/mgc-crest.png?v=flag2026" alt="MGC Crest" style="width:100%;height:100%;object-fit:cover;object-position:center 52%;transform:scale(1.38);filter:saturate(1.18) contrast(1.08);flex-shrink:0" onerror="this.style.display='none'" />
              </a>
              <a href="/" class="reader-btn">Home</a>
              <button type="button" class="reader-btn ${fontSizeLevel === 0 ? 'active' : ''}" id="btnFontSm" title="Standard Newspaper Size">A-</button>
              <button type="button" class="reader-btn ${fontSizeLevel === 1 ? 'active' : ''}" id="btnFontMd" title="Large Newspaper Size (Default)">A</button>
              <button type="button" class="reader-btn ${fontSizeLevel === 2 ? 'active' : ''}" id="btnFontLg" title="Extra Large Executive Print">A+</button>
              <button type="button" class="reader-btn" id="btnToggleTheme">
                ${themeMode === 'ivory' ? '🌙 Obsidian Paper' : '📰 Financial Ivory'}
              </button>
              <button type="button" class="reader-btn ${isSpeaking ? 'pri' : ''}" id="btnSpeakArticle">
                ${isSpeaking ? '⏹ Stop Audio' : '🔊 Listen'}
              </button>
              <button type="button" class="reader-btn" id="btnPrintArticle">🖨️ Print</button>
              <a href="/newsletter" class="reader-btn">← Full Wire</a>
            </div>
          </div>

          <div class="masthead-dateline">
            <span>WASHINGTON, D.C. &amp; RICHMOND, VA · ${esc(dateStr.toUpperCase())}</span>
            <span>NATURAL EDITORIAL EDITION · ZERO INTRUSIVE POPUPS</span>
            <span>DESK: ${esc(activeStory.agency || 'Executive Intelligence')} · ${esc(activeStory.readTime || '3 min read')}</span>
          </div>
        </header>

        <div class="editorial-grid">
          <article class="article-sheet" aria-labelledby="readerHeadline">
            <div class="reader-atmo-backdrop" aria-hidden="true">
              <img
                id="readerAtmoImg"
                src="${esc(activeStory.imageUrl)}"
                data-fallback-src="${esc(activeStory.fallbackImageUrl || '')}"
                data-svg-fallback="${esc(activeStory.svgFallbackUri || '')}"
                alt=""
                loading="eager"
              />
            </div>

            <div class="article-kicker-row">
              <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                <span class="source-tag" style="background:${esc(activeStory.accentColor || '#f97316')}">${esc(activeStory.sourceCode || 'WIRE')}</span>
                <span style="font-size:13px;font-weight:700;color:var(--ink-muted)">${esc(activeStory.source || 'News Wire')}</span>
                <span class="kicker-pill">${esc(activeStory.trackLabel || 'EXECUTIVE BRIEFING')}</span>
              </div>
              <span style="font-family:monospace;font-size:12px;font-weight:700;color:var(--gold)">${esc(activeStory.time || 'LIVE EDITION')} · ${esc(activeStory.readTime || '3 min read')}</span>
            </div>

            <h1 class="news-headline" id="readerHeadline">${esc(activeStory.title)}</h1>

            <p class="news-dek">${esc(activeStory.dek || activeStory.summary)}</p>

            <div class="editorial-visual-plate">
              <span>📷 ${esc(activeStory.imageCaption || 'Executive Dispatch Edition')}</span>
              <span>${esc(activeStory.source || 'News Wire')} · ${esc(activeStory.trackLabel || 'DISPATCH')}</span>
            </div>

            <div class="byline-bar">
              <div>
                By <strong style="color:var(--ink-primary)">Executive Dispatch Editorial Desk</strong> · Curated from <strong>${esc(activeStory.source)}</strong> (${esc(activeStory.agency || 'Sector Wire')})
              </div>
              <div style="display:flex;align-items:center;gap:10px">
                <a href="${esc(activeStory.url || 'https://news.google.com/')}" data-source-redirect="${esc(activeStory.url || 'https://news.google.com/')}" data-source-label="${esc(activeStory.source || 'Original Source')}" class="reader-btn" style="padding:4px 10px;font-size:11.5px">Verify Original Source ↗</a>
              </div>
            </div>

            <!-- Executive Impact & Signal Matrix -->
            <section class="signal-matrix-grid" aria-label="Executive Signal and Impact Matrix">
              <div class="signal-metric-cell">
                <div class="signal-metric-label">Cloud &amp; Cost Impact</div>
                <div class="signal-metric-value">${esc((activeStory.impactMetrics && activeStory.impactMetrics.costImpact) || '-72% Idle Cloud Spend')}</div>
              </div>
              <div class="signal-metric-cell">
                <div class="signal-metric-label">Deployment Velocity</div>
                <div class="signal-metric-value">${esc((activeStory.impactMetrics && activeStory.impactMetrics.deploySpeed) || 'Scale-to-Zero Serverless')}</div>
              </div>
              <div class="signal-metric-cell">
                <div class="signal-metric-label">Readiness &amp; Posture</div>
                <div class="signal-metric-value">${esc((activeStory.impactMetrics && activeStory.impactMetrics.readinessScore) || '98% Workflow Accuracy')}</div>
              </div>
            </section>

            <div class="source-ref-callout">
              <div>
                <strong style="color:var(--ink-primary)">Primary Wire Reference:</strong> Curated from <strong>${esc(activeStory.source)}</strong> (${esc(activeStory.agency || 'Executive Wire')})
              </div>
              <a href="${esc(activeStory.url || 'https://news.google.com/')}" data-source-redirect="${esc(activeStory.url || 'https://news.google.com/')}" data-source-label="${esc(activeStory.source || 'Original Source')}" class="source-ref-link">
                <span>Read Original Article on ${esc(activeStory.source)}</span>
                <span>↗</span>
              </a>
            </div>

            <div class="news-body">
              <p class="lead-paragraph">${esc(paras[0])}</p>
              ${paras[1] ? `<p>${esc(paras[1])}</p>` : ''}

              ${activeStory.pullQuote ? `
                <blockquote class="editorial-pullquote">
                  “${esc(activeStory.pullQuote)}”
                </blockquote>
              ` : ''}

              ${paras[2] ? `<p>${esc(paras[2])}</p>` : ''}
            </div>

            <!-- 3-Step Actionable Implementation Playbook Deliverable -->
            <section class="playbook-box" id="readerActionPlaybook" aria-label="3-Step Actionable Implementation Playbook">
              <div class="playbook-header">
                <div>
                  <div style="font-size:10.5px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold)">⚡ EXECUTIVE ACTION PLAYBOOK · EXECUTE TODAY</div>
                  <div style="font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:800;color:var(--ink-primary);margin-top:2px">${esc(activeStory.deliverableArtifact || 'Implementation Playbook & Deliverable Checklist')}</div>
                </div>
                <span class="kicker-pill">3 Action Steps</span>
              </div>
              <div>
                ${(activeStory.actionPlaybook || DEFAULT_STORIES[0].actionPlaybook).map((step, idx) => `
                  <div class="playbook-step">
                    <span class="playbook-step-num">0${idx + 1}</span>
                    <div>${esc(step)}</div>
                  </div>
                `).join('')}
              </div>
            </section>

            <!-- Multi-Format Executive Deliverable Export Suite -->
            <section class="deliverable-suite-bar" id="readerDeliverableSuite" aria-label="Executive Deliverable Export Bar">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
                <span style="font-size:11px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold)">📦 EXPORT EXECUTIVE DELIVERABLE PACKET</span>
                <span id="deliverableToastStatus" role="status" aria-live="polite" style="font-family:monospace;font-size:11.5px;font-weight:700;color:#34d399">${deliverableToastMsg ? '✓ ' + esc(deliverableToastMsg) : '100% Original Synthesis · Ready for Team Distribution'}</span>
              </div>
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                <button type="button" class="reader-btn pri" id="btnExportMarkdown">📥 Download Executive Brief (.MD)</button>
                <button type="button" class="reader-btn" id="btnExportHtmlBrief">📄 Download Standalone Report (.HTML)</button>
                <button type="button" class="reader-btn" id="btnCopyTeamMemo">📋 Copy Team Slack / Email Memo</button>
                <button type="button" class="reader-btn" id="btnPrintDeliverablePdf">🖨️ Print / Save Broadsheet PDF</button>
              </div>
            </section>

          </article>

          <aside class="editorial-rail" aria-label="Related Dispatches and Reader Navigation">
            <!-- 1. More Dispatches on the Live Wire -->
            <div class="rail-card">
              <div class="rail-heading">
                <span>📰 More on the Live Wire</span>
                <span>${allStories.length} Dispatches</span>
              </div>
              <div>
                ${allStories.map(st => `
                  <button type="button" class="wire-item-btn ${st.id === activeStory.id ? 'active' : ''}" data-story-id="${esc(st.id)}">
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:4px">
                      <span style="font-family:monospace;font-size:10px;font-weight:800;color:${esc(st.accentColor || '#38bdf8')}">${esc(st.source)} · ${esc(st.trackLabel || 'BRIEF')}</span>
                      <span style="font-family:monospace;font-size:10px;color:var(--ink-muted)">${esc(st.time || 'LIVE')}</span>
                    </div>
                    <div style="font-family:'Playfair Display',Georgia,serif;font-size:14px;font-weight:700;line-height:1.3">${esc(st.title)}</div>
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- 2. Executive Briefing & Workspace Navigation -->
            <div class="rail-card">
              <div class="rail-heading">
                <span>🏛️ Executive Dispatch Desk</span>
                <span>Edition</span>
              </div>
              <p style="font-size:12.5px;line-height:1.55;color:var(--ink-body);margin:0 0 12px 0">
                Each dispatch is distilled into a three-paragraph broadsheet briefing paired with an actionable three-step implementation playbook and downloadable executive memo.
              </p>
              <div style="display:flex;flex-direction:column;gap:8px">
                <a href="/newsletter" class="reader-btn pri" style="width:100%;justify-content:center">← Return to Live Newsletter Stream</a>
                <a href="/apps" class="reader-btn" style="width:100%;justify-content:center">⚡ Explore SaaS Apps &amp; LMS</a>
              </div>
            </div>
          </aside>
        </div>
      `;

      document.getElementById('btnFontSm').onclick = () => { fontSizeLevel = 0; applyTypographyAndTheme(); render(); };
      document.getElementById('btnFontMd').onclick = () => { fontSizeLevel = 1; applyTypographyAndTheme(); render(); };
      document.getElementById('btnFontLg').onclick = () => { fontSizeLevel = 2; applyTypographyAndTheme(); render(); };
      document.getElementById('btnToggleTheme').onclick = () => {
        const nextTheme = themeMode === 'ivory' ? 'obsidian' : 'ivory';
        triggerWatchedThemeTransition(nextTheme, '');
      };
      document.getElementById('btnSpeakArticle').onclick = toggleSpeech;
      document.getElementById('btnPrintArticle').onclick = () => window.print();

      const btnExportMd = document.getElementById('btnExportMarkdown');
      if (btnExportMd) {
        btnExportMd.onclick = () => {
          const slug = String(activeStory.id || 'dispatch').replace(/[^a-z0-9_-]/gi, '-');
          downloadFileBlob(`Executive-Dispatch-${slug}.md`, 'text/markdown;charset=utf-8', buildMarkdownBrief(activeStory));
          showDeliverableToast(`Downloaded Executive-Dispatch-${slug}.md`);
        };
      }

      const btnExportHtml = document.getElementById('btnExportHtmlBrief');
      if (btnExportHtml) {
        btnExportHtml.onclick = () => {
          const slug = String(activeStory.id || 'dispatch').replace(/[^a-z0-9_-]/gi, '-');
          const htmlDoc = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
          downloadFileBlob(`Executive-Dispatch-${slug}.html`, 'text/html;charset=utf-8', htmlDoc);
          showDeliverableToast(`Downloaded Standalone Report (${slug}.html)`);
        };
      }

      const btnCopyTeam = document.getElementById('btnCopyTeamMemo');
      if (btnCopyTeam) {
        btnCopyTeam.onclick = async () => {
          const memo = buildMarkdownBrief(activeStory);
          try {
            await navigator.clipboard.writeText(memo);
            showDeliverableToast('Copied Team Slack / Email Executive Memo to Clipboard');
          } catch (_) {
            showDeliverableToast('Executive Memo Prepared & Ready');
          }
        };
      }

      const btnPrintPdf = document.getElementById('btnPrintDeliverablePdf');
      if (btnPrintPdf) {
        btnPrintPdf.onclick = () => window.print();
      }

      const atmoImg = document.getElementById('readerAtmoImg');
      if (atmoImg) {
        atmoImg.onerror = () => {
          const fb = atmoImg.getAttribute('data-fallback-src');
          const svgFb = atmoImg.getAttribute('data-svg-fallback');
          if (fb && atmoImg.src !== fb) {
            atmoImg.src = fb;
          } else if (svgFb && atmoImg.src !== svgFb) {
            atmoImg.src = svgFb;
          }
        };
      }

      root.querySelectorAll('[data-source-redirect]').forEach(linkEl => {
        linkEl.onclick = (ev) => {
          ev.preventDefault();
          const url = linkEl.getAttribute('data-source-redirect');
          const label = linkEl.getAttribute('data-source-label') || activeStory.source || 'Original Source';
          triggerSourceRedirectWithNotice(url, label);
        };
      });

      root.querySelectorAll('[data-story-id]').forEach(btn => {
        btn.onclick = () => {
          const id = btn.getAttribute('data-story-id');
          const found = allStories.find(s => s.id === id);
          if (found) {
            if (isSpeaking && 'speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              isSpeaking = false;
            }
            activeStory = normalizeStory(found);
            try {
              localStorage.setItem('mgc_active_reader_story', JSON.stringify(activeStory));
              history.replaceState(null, '', '?id=' + encodeURIComponent(activeStory.id));
            } catch (_) {}
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
          }
        };
      });
    }

    loadInitialStory();
    render();
    syncLiveWire();
  })();
  </script>
</body>
</html>
