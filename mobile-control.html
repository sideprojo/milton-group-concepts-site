<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; connect-src 'self' https:; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="theme-color" content="#040814" />
  <title>MGC &amp; F.I.X | Mobile Control &amp; Workflow Deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: mgcFadeOut 0.22s cubic-bezier(0.22, 1, 0.36, 1) both; }
    ::view-transition-new(root) { animation: mgcFadeIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) both; }
    @keyframes mgcFadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-4px); } }
    @keyframes mgcFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    :root {
      --bg: #040814;
      --surface: rgba(10, 18, 36, 0.78);
      --surface-elevated: rgba(15, 25, 48, 0.88);
      --line: rgba(148, 163, 184, 0.28);
      --line-strong: rgba(96, 165, 250, 0.55);
      --gold: #fbbf24;
      --blue: #3b82f6;
      --blue-bright: #60a5fa;
      --emerald: #10b981;
      --emerald-bright: #34d399;
      --danger: #f87171;
      --tx: #f8fafc;
      --mut: #cbd5e1;
      --radius: 16px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; background: var(--bg); color: var(--tx); max-width: 100%; overflow-x: hidden; }
    body {
      margin: 0;
      width: 100%;
      max-width: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #040814;
      color: var(--tx);
      min-height: 100dvh;
      padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
      line-height: 1.5;
      overflow-x: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(180deg, rgba(3, 7, 18, 0.54) 0%, rgba(6, 13, 28, 0.68) 50%, rgba(3, 7, 18, 0.84) 100%),
        url('https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1800&q=82');
      background-size: cover;
      background-position: center 55%;
      background-repeat: no-repeat;
      filter: saturate(1.15) contrast(1.06);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Skip Link for Screen Readers & Keyboard Switch Control */
    .skip-link {
      position: absolute;
      top: -100px;
      left: 12px;
      z-index: 1000;
      background: var(--blue);
      color: #fff;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 800;
      text-decoration: none;
      transition: top 0.2s ease;
    }
    .skip-link:focus { top: 12px; outline: 3px solid var(--gold); }

    /* High-Contrast Accessible Focus Ring */
    :focus-visible {
      outline: 2.5px solid var(--blue-bright) !important;
      outline-offset: 2px !important;
    }

    /* Minimalist Top Control Bar */
    .m-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(4, 8, 20, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
      padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .m-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--tx);
      min-height: 48px;
    }
    .m-shield {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
      border: 1.5px solid rgba(197, 179, 88, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 15px;
      color: var(--gold);
      flex-shrink: 0;
    }
    .m-brand-text strong {
      display: block;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .m-brand-text span {
      display: block;
      font-size: 11px;
      color: var(--mut);
      font-weight: 600;
    }

    .m-shell {
      position: relative;
      z-index: 2;
      max-width: 560px;
      margin: 0 auto;
      padding: 16px 14px 28px;
    }

    /* Smooth View Pane Transitions */
    .m-pane {
      animation: paneSlideIn 0.26s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes paneSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Minimalist Cards with Faded Human-Touch Backdrop */
    .m-card {
      position: relative;
      overflow: hidden;
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      transition: transform 0.18s ease, border-color 0.18s ease;
    }
    .m-card.priority {
      border-color: rgba(197, 179, 88, 0.58);
      background-image:
        linear-gradient(155deg, rgba(8, 15, 32, 0.80) 0%, rgba(6, 12, 26, 0.88) 100%),
        url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center;
    }
    #cardCoreWorkflows,
    #pane-control .m-card:nth-of-type(2) {
      background-image:
        linear-gradient(155deg, rgba(8, 15, 32, 0.82) 0%, rgba(6, 12, 26, 0.90) 100%),
        url('https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center;
    }
    #pane-control .m-card:nth-of-type(3) {
      background-image:
        linear-gradient(155deg, rgba(8, 15, 32, 0.82) 0%, rgba(6, 12, 26, 0.90) 100%),
        url('https://images.unsplash.com/photo-1600880292203-757bb62b4baf?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center;
    }
    #pane-workflows .m-card {
      background-image:
        linear-gradient(155deg, rgba(8, 15, 32, 0.82) 0%, rgba(6, 12, 26, 0.90) 100%),
        url('https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center;
    }
    #pane-briefings .m-card {
      background-image:
        linear-gradient(155deg, rgba(8, 15, 32, 0.82) 0%, rgba(6, 12, 26, 0.90) 100%),
        url('https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center;
    }
    #pane-site .m-card {
      background-image:
        linear-gradient(155deg, rgba(8, 15, 32, 0.82) 0%, rgba(6, 12, 26, 0.90) 100%),
        url('https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center;
    }
    .m-card h1 {
      font-size: 20px;
      font-weight: 900;
      margin: 0 0 4px;
      letter-spacing: -0.02em;
    }
    .m-card h2 {
      font-size: 15px;
      font-weight: 800;
      margin: 0 0 6px;
      color: #fff;
    }
    .m-card p {
      font-size: 13.5px;
      color: var(--mut);
      margin: 0 0 10px;
    }

    /* Pill / Chip */
    .m-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(4, 8, 20, 0.9);
      color: var(--mut);
    }
    .m-pill.ok { color: var(--emerald-bright); border-color: rgba(16, 185, 129, 0.5); background: rgba(16, 185, 129, 0.15); }
    .m-pill.warn { color: var(--gold); border-color: rgba(251, 191, 36, 0.5); background: rgba(251, 191, 36, 0.15); }
    .m-pill.blue { color: var(--blue-bright); border-color: rgba(96, 165, 250, 0.5); background: rgba(59, 130, 246, 0.16); }

    /* WCAG 48px+ Touch Target Buttons & Controls */
    .m-btn {
      min-height: 48px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: var(--surface-elevated);
      color: var(--tx);
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      width: 100%;
    }
    .m-btn:active { transform: scale(0.98); }
    .m-btn.pri {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-color: var(--blue-bright);
      color: #fff;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
    }
    .m-btn.gold {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-color: #fde68a;
      color: #040814;
    }
    .m-btn.ok {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(52, 211, 153, 0.6);
      color: var(--emerald-bright);
    }
    .m-btn.inline {
      width: auto;
      min-height: 44px;
      padding: 8px 14px;
      font-size: 13px;
    }

    /* 16px+ Form Inputs (Prevents iOS/Android Auto-Zoom) */
    .m-input, .m-select, .m-textarea {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 48px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: #050a18;
      color: var(--tx);
      font: inherit;
      font-size: 16px;
      margin-bottom: 10px;
      text-overflow: ellipsis;
    }
    .m-textarea { min-height: 84px; resize: vertical; }

    /* Interactive Checklist Row (48px+ height) */
    .m-check-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(6, 11, 24, 0.85);
      border: 1px solid var(--line);
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    .m-check-row input[type="checkbox"] {
      width: 22px;
      height: 22px;
      accent-color: var(--emerald);
      flex-shrink: 0;
      cursor: pointer;
    }
    .m-check-row.done span {
      text-decoration: line-through;
      color: #94a3b8;
    }

    /* Action Row */
    .m-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .m-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Fixed Bottom Ergonomic Thumb Control Bar */
    .m-tabbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      z-index: 90;
      background: rgba(4, 8, 20, 0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1.5px solid rgba(148, 163, 184, 0.28);
      padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px));
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.7);
    }
    .m-tab {
      min-height: 52px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--mut);
      font: inherit;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.03em;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .m-tab .ico { font-size: 17px; line-height: 1; }
    .m-tab[aria-selected="true"] {
      background: rgba(37, 99, 235, 0.22);
      border-color: rgba(96, 165, 250, 0.55);
      color: #fff;
    }

    /* Accessible Live Toast */
    #m-toast {
      position: fixed;
      bottom: calc(76px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 120;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #022c22;
      font-weight: 900;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 999px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.65);
      display: none;
      max-width: 92vw;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main workflow controls</a>

  <header class="m-header" role="banner">
    <a href="/mobile" class="m-brand" aria-label="Milton Group Concepts Mobile Control Home">
      <div class="m-shield" aria-hidden="true">🛡️</div>
      <div class="m-brand-text">
        <strong id="hdrBrandTitle">MGC // CONTROL</strong>
        <span id="hdrBrandSub">Minimalist Mobile Workflow Deck</span>
      </div>
    </a>
    <div id="hdrAuthAction"></div>
  </header>

  <main id="main-content" class="m-shell" role="main" tabindex="-1"></main>

  <div id="m-toast" role="status" aria-live="polite"></div>

  <nav class="m-tabbar" role="tablist" aria-label="Mobile Workflow Navigation">
    <button type="button" class="m-tab" role="tab" id="tab-btn-control" data-tab="control" aria-selected="true" aria-controls="main-content">
      <span class="ico" aria-hidden="true">⚡</span>
      <span>Control</span>
    </button>
    <button type="button" class="m-tab" role="tab" id="tab-btn-workflows" data-tab="workflows" aria-selected="false" aria-controls="main-content">
      <span class="ico" aria-hidden="true">☑️</span>
      <span>Workflows</span>
    </button>
    <button type="button" class="m-tab" role="tab" id="tab-btn-sprint" data-tab="sprint" aria-selected="false" aria-controls="main-content">
      <span class="ico" aria-hidden="true">🗂️</span>
      <span>Sprint</span>
    </button>
    <button type="button" class="m-tab" role="tab" id="tab-btn-briefings" data-tab="briefings" aria-selected="false" aria-controls="main-content">
      <span class="ico" aria-hidden="true">📰</span>
      <span>Newsletter</span>
    </button>
  </nav>

  <script src="mgc-workspace-core.js"></script>
  <script>
  (function () {
    const W = window.MGCW;
    const S = () => W.S;
    const esc = W.esc;
    const mainEl = document.getElementById('main-content');
    const hdrAuth = document.getElementById('hdrAuthAction');
    const hdrTitle = document.getElementById('hdrBrandTitle');
    const hdrSub = document.getElementById('hdrBrandSub');

    const VALID_TABS = ['control', 'workflows', 'sprint', 'briefings'];
    let currentTab = (location.hash || '#control').replace('#', '');
    if (!VALID_TABS.includes(currentTab)) currentTab = 'control';

    let newsletterData = {
      subscribersCount: 142,
      subscribed: false,
      issues: [
        {
          id: 'iss-04',
          issueNumber: 'ISSUE #04 · OCT 2026',
          category: 'Zero-Trust & Federal',
          title: 'Zero-Trust Federated OIDC & CMMC 2.0 Readiness for Federal & Commercial Partners',
          summary: 'How MGC enforces Google, Microsoft Entra ID, and Apple OIDC federation with RS256 JWKS verification while eliminating password attack surfaces across partner portals.',
          readTime: '3 min read'
        },
        {
          id: 'iss-03',
          issueNumber: 'ISSUE #03 · SEP 2026',
          category: 'AI & Cloud Run',
          title: 'AI Receptionists & Scale-to-Zero Architecture: Cutting Idle Cloud Spend to $0.00',
          summary: 'Architectural breakdown of F.I.X Solutions autonomous 24/7 lead capture receptionists paired with Cloud Run min-instances=0 cost-guarded deployments.',
          readTime: '4 min read'
        },
        {
          id: 'iss-02',
          issueNumber: 'ISSUE #02 · AUG 2026',
          category: 'Supply Chain & FAR',
          title: 'Strategic Sourcing & Lifecycle Governance in High-Compliance Supply Chains',
          summary: 'Executing NIST SP 800-88 media sanitization, FAR/DFARS procurement tracking, and milestone-driven agile delivery from a single mobile control plane.',
          readTime: '3 min read'
        }
      ]
    };

    function showToast(msg) {
      const t = document.getElementById('m-toast');
      if (!t) return;
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => { t.style.display = 'none'; }, 2800);
    }

    let activeNlTrack = 'all';
    let liveStreamItems = [];

    async function loadNewsletter() {
      try {
        const [rNl, rLive] = await Promise.all([
          fetch('/api/newsletter').catch(() => null),
          fetch('/api/newsletter/live-stream').catch(() => null)
        ]);
        if (rNl && rNl.ok) {
          const d = await rNl.json();
          if (d && d.ok) newsletterData = d;
        }
        if (rLive && rLive.ok) {
          const dl = await rLive.json();
          if (dl && dl.ok && Array.isArray(dl.items)) {
            liveStreamItems = dl.items;
          }
        }
        if (currentTab === 'briefings') render(false);
      } catch (_) {}
    }

    function transitionRender(fn) {
      if (document.startViewTransition) {
        document.startViewTransition(() => fn());
      } else {
        fn();
      }
    }

    function getSessionRoleLabel(u) {
      if (!u) return { badge: 'MOBILE', sub: 'Sign In or Register' };
      if (W.isOwner && W.isOwner(u)) return { badge: 'OWNER CONTROL', sub: 'Administrator' };
      if (W.isEmployee && W.isEmployee(u)) return { badge: 'STAFF OPERATIONS', sub: 'Internal Staff' };
      if (W.isWorkspaceClient && W.isWorkspaceClient(u)) return { badge: 'WORKSPACE', sub: 'Workspace Client' };
      return { badge: 'SHOWCASE', sub: 'Access Client' };
    }

    function renderHeader(u) {
      if (u) {
        const meta = getSessionRoleLabel(u);
        const cleanName = String(u.name || '').replace(/\s*\(Administrator\)\s*/i, '').trim();
        hdrTitle.textContent = (u.brand === 'FIX' ? 'F.I.X' : 'MGC') + ' // ' + meta.badge;
        hdrSub.textContent = cleanName + ' · ' + meta.sub;
        hdrAuth.innerHTML = '<div style="display:flex;gap:6px;align-items:center"><a href="/?desktop=1" class="m-btn inline" style="padding:8px 10px;font-size:11px">Public Site</a><button type="button" class="m-btn inline" id="mBtnSignOut" aria-label="Sign out of session">Sign Out</button></div>';
        const so = document.getElementById('mBtnSignOut');
        if (so) so.onclick = () => W.signOut();
      } else {
        hdrTitle.textContent = 'MGC // MOBILE';
        hdrSub.textContent = 'Client & Staff Portal';
        hdrAuth.innerHTML = '<div style="display:flex;gap:6px;align-items:center"><a href="/?desktop=1" class="m-btn inline" style="padding:8px 10px;font-size:11px">Public Site</a><a href="/auth" class="m-btn pri inline" aria-label="Sign in to Workspace">Sign In</a></div>';
      }
    }

    /* ---------- TAB 1: CONTROL ---------- */
    function renderControlTab(u) {
      if (!u) {
        return `
          <section class="m-pane" aria-label="Mobile Authentication">
            <div class="m-card priority">
              <h1>Mobile Sign In</h1>
              <p>Sign in with your account credentials or connected identity provider.</p>
              <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
                <a href="/auth" class="m-btn pri" id="btnMobileClientSignIn">Client Sign In →</a>
                <div class="m-grid-2">
                  <a href="/auth?mode=register" class="m-btn" id="btnMobileRegister">Register</a>
                  <a href="/employee-login" class="m-btn" id="btnMobileStaffLogin">Staff Logon</a>
                </div>
              </div>
            </div>

            <div class="m-card">
              <h2>Single Sign-On</h2>
              <p>Connect your account to access workspace tools and workflows:</p>
              <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
                <a href="/api/auth/oauth/start?provider=google" class="m-btn" style="justify-content:space-between">
                  <span>Continue with Google</span>
                  <span>→</span>
                </a>
                <a href="/api/auth/oauth/start?provider=microsoft" class="m-btn" style="justify-content:space-between">
                  <span>Continue with Microsoft</span>
                  <span>→</span>
                </a>
                <a href="/api/auth/oauth/start?provider=apple" class="m-btn" style="justify-content:space-between">
                  <span>Continue with Apple</span>
                  <span>→</span>
                </a>
              </div>
            </div>

            <div class="m-card">
              <h2>Public Channels &amp; Contributions</h2>
              <p>Explore the public website, schedule a consultation, read live briefings, or support MGC initiatives via 3rd-party platforms:</p>
              <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">

              <a href="/checkout?amount=100&provider=stripe" class="m-btn pri">💳 Stripe Payment Link →</a>
              <div class="m-grid-2">
                <a href="/checkout?amount=100&provider=gofundme" class="m-btn ok">🌱 GoFundMe</a>
                <a href="/checkout?amount=100&provider=paypal" class="m-btn gold">🅿️ PayPal Donate</a>
              </div>
            </div>
          </div>

          ${u && u.role === 'owner' ? `
          <div class="m-card">
            <h2>Publish New Briefing Issue</h2>
            <label class="sr-only" for="mPubCat">Category</label>
            <input class="m-input" id="mPubCat" placeholder="Briefing Category" value="Executive Briefing" />
            <label class="sr-only" for="mPubTitle">Briefing Headline</label>
            <input class="m-input" id="mPubTitle" placeholder="Headline title..." maxlength="140" />
            <label class="sr-only" for="mPubSummary">Executive Summary</label>
            <textarea class="m-textarea" id="mPubSummary" placeholder="Concise executive summary and action takeaways..."></textarea>
            <button type="button" class="m-btn gold" id="mBtnPublishIssue">Publish Issue to Subscribers</button>
          </div>` : ''}

          <div class="m-card">
            <h2>Monthly Executive Issues</h2>
            ${issues.map(iss => `
              <article style="padding:14px;border-radius:12px;background:rgba(4,8,20,0.88);border:1px solid var(--line);margin-bottom:10px">
                <h3 style="font-size:15px;font-weight:800;margin:0 0 6px;color:#fff">${esc(iss.title)}</h3>
                <p style="font-size:13px;color:var(--mut);margin:0">${esc(iss.summary)}</p>
              </article>
            `).join('')}
          </div>
        </section>
      `;
    }

    function bindEvents(u) {
      // Tab switching
      document.querySelectorAll('.m-tab').forEach(btn => {
        const isSel = btn.dataset.tab === currentTab;
        btn.setAttribute('aria-selected', isSel ? 'true' : 'false');
        btn.onclick = () => {
          if (currentTab === btn.dataset.tab) return;
          currentTab = btn.dataset.tab;
          history.replaceState(null, '', '#' + currentTab);
          render(true);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
      });

      mainEl.querySelectorAll('[data-jump-tab]').forEach(btn => {
        btn.onclick = () => {
          currentTab = btn.dataset.jumpTab;
          history.replaceState(null, '', '#' + currentTab);
          render(true);
        };
      });

      mainEl.querySelectorAll('[data-nl-track]').forEach(btn => {
        btn.onclick = () => {
          activeNlTrack = btn.getAttribute('data-nl-track') || 'all';
          render(false);
        };
      });

      // Access Client 1-tap Workspace OAuth Connection (Google, Microsoft, Apple)
      mainEl.querySelectorAll('[data-connect-ws]').forEach(btn => {
        btn.onclick = () => {
          const prov = btn.getAttribute('data-connect-ws') || 'google';
          showToast('Redirecting to ' + prov.toUpperCase() + ' OIDC...');
          if (W.connectWorkspace) {
            W.connectWorkspace(prov);
          } else {
            location.href = '/api/auth/oauth/start?provider=' + encodeURIComponent(prov);
          }
        };
      });

      // Owner Otto Agent Access Policy update
      const ottoSaveBtn = document.getElementById('mBtnUpdateOttoAgent');
      if (ottoSaveBtn) {
        ottoSaveBtn.onclick = () => {
          const accessVal = (document.getElementById('mOttoAccessSel') && document.getElementById('mOttoAccessSel').value) || 'All domain users';
          if (W.updateAgentAccess) {
            W.updateAgentAccess('otto', {
              access: accessVal,
              accessPolicy: accessVal === 'Restricted' ? 'Explicit Administrator Grant Required' : 'Default (Organizational unit: Milton Group Concepts LLC)',
              status: 'Active'
            });
          }
          showToast('✓ Otto Agent access policy saved (' + accessVal + ')');
          render(true);
        };
      }

      // Owner approvals
      mainEl.querySelectorAll('[data-approve]').forEach(btn => {
        btn.onclick = () => {
          W.approve(btn.dataset.approve);
          showToast('✓ Approved & build tasks queued');
          render(true);
        };
      });
      mainEl.querySelectorAll('[data-deny]').forEach(btn => {
        btn.onclick = () => {
          W.deny(btn.dataset.deny);
          showToast('Request denied');
          render(true);
        };
      });

      // Owner quick grant
      const grantBtn = document.getElementById('mBtnGrantNow');
      if (grantBtn) {
        grantBtn.onclick = () => {
          const targetUid = document.getElementById('mGrantUser').value;
          const [type, resId] = document.getElementById('mGrantApp').value.split('|');
          W.share(targetUid, type, resId, type === 'project' ? ['view', 'edit'] : ['view']);
          showToast('✓ Access granted immediately');
          render(true);
        };
      }

      // Customer request app unlock
      const reqAppBtn = document.getElementById('mBtnReqApp');
      if (reqAppBtn) {
        reqAppBtn.onclick = () => {
          const appId = document.getElementById('mReqAppSel').value;
          W.requestAppAccess(appId);
          showToast('✓ Unlock request sent to Owner');
        };
      }

      // Owner build tasks
      mainEl.querySelectorAll('[data-owner-task]').forEach(chk => {
        chk.onchange = () => {
          W.completeTask(chk.dataset.ownerTask, chk.checked);
          showToast(chk.checked ? '✓ Task marked complete' : 'Task reopened');
          render(false);
        };
      });

      // Member checklist
      mainEl.querySelectorAll('[data-member-chk]').forEach(chk => {
        chk.onchange = () => {
          const k = 'mgcw.chk.' + u.id;
          const st = JSON.parse(localStorage.getItem(k) || '{}');
          st[chk.dataset.memberChk] = chk.checked;
          localStorage.setItem(k, JSON.stringify(st));
          fetch('/api/db/sync', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ checklist: st })
          }).catch(() => {});
          showToast(chk.checked ? '✓ Step completed & synced' : 'Step unchecked');
          render(false);
        };
      });

      // Member feature request
      const addFeatBtn = document.getElementById('mBtnAddFeat');
      if (addFeatBtn) {
        addFeatBtn.onclick = () => {
          const t = document.getElementById('mFeatTitle').value.trim();
          if (!t) { showToast('Enter a workflow or feature title'); return; }
          if (!W.postServerAction || !W.postServerAction({ action: 'createFeature', title: t, body: 'Submitted via Mobile Control Deck' })) {
            S().features.unshift({ id: W.uid('f'), by: u.id, title: t, body: 'Submitted via Mobile Control Deck', votes: [u.id], status: 'new', created: W.now() });
            W.commit();
          }
          document.getElementById('mFeatTitle').value = '';
          showToast('✓ Sent to Owner workflow queue');
        };
      }

      // Sprint project selector & stage cycling
      const projSel = document.getElementById('mProjSel');
      if (projSel) {
        projSel.onchange = () => {
          window._mPid = projSel.value;
          render(true);
        };
      }
      mainEl.querySelectorAll('[data-cycle-item]').forEach(btn => {
        btn.onclick = () => {
          const itemId = btn.dataset.cycleItem;
          const nextCol = btn.dataset.nextCol;
          if (!W.postServerAction || !W.postServerAction({ action: 'moveAgileItem', itemId, col: nextCol })) {
            const it = (S().items || []).find(x => x.id === itemId);
            if (it) { it.col = nextCol; W.commit(); }
          }
          showToast('✓ Moved to ' + nextCol.toUpperCase());
          render(false);
        };
      });
      const newItemBtn = document.getElementById('mBtnNewItem');
      if (newItemBtn) {
        newItemBtn.onclick = () => {
          const title = document.getElementById('mNewItemTitle').value.trim();
          if (!title) return;
          if (!W.postServerAction || !W.postServerAction({ action: 'createAgileItem', project: window._mPid, title, type: 'task', points: 3, sprint: 1 })) {
            S().items.push({ id: W.uid('i'), project: window._mPid, type: 'task', title, points: 3, col: 'backlog', sprint: 1, assignee: u.id, createdBy: u.id });
            W.commit();
          }
          showToast('✓ Sprint task added');
          render(false);
        };
      }

      // Newsletter subscription
      const nlForm = document.getElementById('mNewsletterSubForm');
      if (nlForm) {
        nlForm.onsubmit = async (e) => {
          e.preventDefault();
          const email = document.getElementById('mnlEmail').value.trim();
          const topic = document.getElementById('mnlTopic').value;
          if (!email) { showToast('Please enter a valid email'); return; }
          try {
            const r = await fetch('/api/newsletter/subscribe', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, topic, source: 'mobile-control' })
            });
            const d = await r.json();
            if (d && d.ok) {
              newsletterData.subscribersCount = d.subscribersCount || newsletterData.subscribersCount;
              showToast('✓ Subscribed to MGC & F.I.X Briefings');
              render(false);
            } else {
              showToast((d && d.error) || 'Subscription saved');
            }
          } catch (_) {
            showToast('✓ Subscribed to Briefings');
          }
        };
      }

      // Owner publish newsletter issue
      const pubBtn = document.getElementById('mBtnPublishIssue');
      if (pubBtn) {
        pubBtn.onclick = async () => {
          const category = document.getElementById('mPubCat').value.trim() || 'Executive Briefing';
          const title = document.getElementById('mPubTitle').value.trim();
          const summary = document.getElementById('mPubSummary').value.trim();
          if (!title || !summary) { showToast('Enter both a headline and summary'); return; }
          try {
            const r = await fetch('/api/newsletter/publish', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ category, title, summary })
            });
            const d = await r.json();
            if (d && d.ok && d.newsletter) {
              newsletterData = d.newsletter;
              showToast('✓ Briefing published to all subscribers');
              render(true);
            }
          } catch (_) {}
        };
      }
    }

    function render(useTransition) {
      const doUpdate = () => {
        const u = W.me();
        renderHeader(u);
        if (currentTab === 'workflows') mainEl.innerHTML = renderWorkflowsTab(u);
        else if (currentTab === 'sprint') mainEl.innerHTML = renderSprintTab(u);
        else if (currentTab === 'briefings') mainEl.innerHTML = renderBriefingsTab(u);
        else mainEl.innerHTML = renderControlTab(u);
        bindEvents(u);
      };
      if (useTransition) transitionRender(doUpdate);
      else doUpdate();
    }

    render(false);
    loadNewsletter();
  })();
  </script>
</body>
</html>
