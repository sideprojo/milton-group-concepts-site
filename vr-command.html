      background: rgba(5, 8, 17, 0.88); border: 1px solid #38bdf8;
      color: #f8fafc; padding: 14px 20px; border-radius: 10px;

    .hud-overlay p { font-size: 0.8rem; color: #94a3b8; margin: 0 0 10px; }
