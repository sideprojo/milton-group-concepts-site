      position: relative;

    /* Shared Cityscape Image Layer (Used by both F.I.X. and miltongroupsecurity.org modes) */
    #dual-cityscape-bg {
      position: fixed;
      inset: -5%;
      z-index: -3;
      background-image: url('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&q=80&w=2500');
      background-size: 118% 118%;
      background-position: 50% 50%;
      background-repeat: no-repeat;
      opacity: 0.48;
      mix-blend-mode: luminosity;
      transition: filter 0.85s cubic-bezier(0.16, 1, 0.3, 1), background-position 1.1s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
      will-change: filter, background-position;
    }
    /* Thematic F.I.X. Navy & Gold / Filter Overlay */
    #dual-cityscape-overlay {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      transition: background 0.85s ease;
    }
    /* miltongroupsecurity.org Exclusive Layer: Sunset Horizon + Cube Grid + Skyscraper with Waving US Flag */
    #mgc-skyscraper-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
      transition: opacity 0.65s ease;
    }
    .mgc-sunset-glow {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 75vh;
      background: linear-gradient(180deg, rgba(249, 115, 22, 0.24) 0%, rgba(244, 63, 94, 0.16) 35%, rgba(197, 179, 88, 0.12) 65%, transparent 100%);
      mix-blend-mode: screen;
    }
    .mgc-cube-pattern {
      position: absolute;
      inset: 0;
      background-image: url('https://www.transparenttextures.com/patterns/cubes.png');
      opacity: 0.10;
      mix-blend-mode: overlay;
    }
    .mgc-skyscraper-wrap {
      position: absolute;
      bottom: 0;
      right: 7%;
      width: 220px;
      height: 88vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      opacity: 0.72;
    }
    @keyframes waveFlag {
      0%, 100% { transform: skewY(0deg) scaleX(1); }
      35% { transform: skewY(3.5deg) scaleX(0.93); }
      70% { transform: skewY(-2.5deg) scaleX(0.97); }
    }
    .mgc-flag-anim {
      transform-origin: left center;
      animation: waveFlag 2.6s infinite ease-in-out;
    }
    .glass-panel {
      background: rgba(11, 20, 38, 0.80);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(197, 179, 88, 0.24);
      box-shadow: 0 22px 55px -12px rgba(0, 0, 0, 0.78);
    }
    .glass-dropdown {
      background: rgba(8, 14, 28, 0.96);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(197, 179, 88, 0.42);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.92), 0 0 25px -5px rgba(197, 179, 88, 0.18);
    }
    .nav-dock {
      background: rgba(11, 20, 38, 0.90);
      backdrop-filter: blur(22px);
      border: 1px solid rgba(197, 179, 88, 0.28);
      box-shadow: 0 12px 36px -8px rgba(0, 0, 0, 0.8), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 1rem;
      border-radius: 0.75rem;
      font-weight: 600;
      transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }
    .btn-sm { padding: 0.35rem 0.85rem; font-size: 0.8125rem; }
    .btn-xs { padding: 0.22rem 0.65rem; font-size: 0.75rem; border-radius: 0.5rem; }
    .btn-primary { background: linear-gradient(135deg, #059669, #10b981); color: #ffffff; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3); }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-gold { background: linear-gradient(135deg, #C5B358, #a38f36); color: #060B16; font-weight: 800; box-shadow: 0 4px 14px rgba(197, 179, 88, 0.3); }
    .btn-gold:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn-outline { border: 1px solid rgba(197, 179, 88, 0.35); color: #e2e8f0; background: rgba(11, 20, 38, 0.7); }

    .badge { display: inline-flex; align-items: center; padding: 0.2rem 0.65rem; border-radius: 9999px; font-weight: 700; font-size: 0.72rem; }

    .badge-outline { border: 1px solid #334155; color: #94a3b8; }

IG & Zero-Trust Controls on IOS-XE] ************************\nTASK [Disable HTTP Server & Enforce SSHv2] **************************************\nok: [R1-CORE]\nok: [R2-DIST]\nok: [R3-BGP-EDGE]\nPLAY RECAP **********************************************************************\nR1-CORE : ok=6 changed=0 unreachable=0 failed=0","probeQuestion":"Which Ansible command-line flag displays the exact line-by-line configuration differences before committing changes to network devices?","options":[{"text":"--diff (often combined with --check for dry-run verification)","correct":true},{"text":"--force-reboot","correct":false},{"text":"--erase-startup","correct":false},{"text":"--no-log-all","correct":false}]},{"id":"SCO_CLI_LINUX","title":"Page 3: Linux (CST200) Systemd, UFW Firewall & Least-Privilege Audit","tag":"Ubuntu / RHEL • CST200","cefrOrLevel":"Drill #3 / 8","summary":"Audits listening sockets with `ss -tulpn`, locks down SSH root login, and verifies active systemd service units and file permissions (`chmod 600`).","metrics":[{"label":"Socket Audit","val":"ss -tulpn","color":"#34d399"},{"label":"Key Permissions","val":"0600 (chmod 600)","color":"#C5B358"},{"label":"Firewall State","val":"UFW / nftables Active","color":"#60a5fa"}],"terminal":"root@mgc-enclave:~# ss -tulpn | grep LISTEN\ntcp   LISTEN 0      128          0.0.0.0:443        0.0.0.0:*    users:((\"nginx\",pid=1042,fd=6))\nroot@mgc-enclave:~# chmod 600 ~/.ssh/authorized_keys && systemctl status sshd","probeQuestion":"Why will OpenSSH refuse public-key authentication if `~/.ssh/authorized_keys` has permissions set to `0777`?","options":[{"text":"StrictModes rejects world-writable authorized_keys files because any local user could inject unauthorized public keys","correct":true},{"text":"OpenSSH requires files to be encrypted with ZIP passwords","correct":false},{"text":"0777 makes the file invisible to root","correct":false},{"text":"Linux only supports 8.3 filenames","correct":false}]},{"id":"SCO_CLI_SQL","title":"Page 4: Relational Database (SDC200) 3NF Schema & Aggregation Query","tag":"PostgreSQL / SQL • 3NF","cefrOrLevel":"Drill #4 / 8","summary":"Executes normalized Third Normal Form (3NF) joins across `sdvosb_contracts`, `agencies`, and `naics_codes` with indexed aggregation.","metrics":[{"label":"Normalization","val":"3NF / BCNF Verified","color":"#C5B358"},{"label":"Query Execution","val":"1.8 ms (Index Scan)","color":"#34d399"},{"label":"Integrity","val":"PK + FK Constraints","color":"#60a5fa"}],"terminal":"SELECT a.agency_name, c.naics_code, COUNT(c.contract_id) AS awards, SUM(c.obligation) AS total_usd\nFROM sdvosb_awards c\nJOIN federal_agencies a ON c.agency_id = a.agency_id\nWHERE c.set_aside_type = 'SDVOSB' AND c.state = 'VA'\nGROUP BY a.agency_name, c.naics_code\nORDER BY total_usd DESC;","probeQuestion":"What condition must a table satisfy in Second Normal Form (2NF) to achieve Third Normal Form (3NF)?","options":[{"text":"Every non-key attribute must be non-transitively dependent only on the primary key (\"nothing but the key\")","correct":true},{"text":"All columns must be stored as comma-separated strings in a single cell","correct":false},{"text":"Foreign keys must be deleted","correct":false},{"text":"Every table must have at least 50 duplicate rows","correct":false}]},{"id":"SCO_CLI_BGP_SEC","title":"Page 5: BGP Prefix-List Filtering, Max-Prefix & GTSM (TTL Security)","tag":"RFC 5082 • BGP Hardening","cefrOrLevel":"Drill #5 / 8","summary":"Protects eBGP edge sessions against route-table exhaustion and spoofed TCP RST packets using Generalized TTL Security Mechanism (`ttl-security hops 1`).","metrics":[{"label":"TTL Security","val":"Min TTL >= 254","color":"#34d399"},{"label":"Max-Prefix Guard","val":"500 Prefixes (80% Warn)","color":"#C5B358"},{"label":"Bogon Filter","val":"RFC 1918 + RFC 6598","color":"#60a5fa"}],"terminal":"R3-BGP-EDGE(config-router)# neighbor 192.0.2.1 ttl-security hops 1\nR3-BGP-EDGE(config-router)# neighbor 192.0.2.1 maximum-prefix 500 80\nR3-BGP-EDGE(config-router)# neighbor 192.0.2.1 prefix-list BOGON_FILTER in","probeQuestion":"How does `neighbor 192.0.2.1 ttl-security hops 1` (RFC 5082 GTSM) defend a directly connected eBGP peer against remote TCP spoofing?","options":[{"text":"Requires incoming BGP packets to have an IP TTL of at least 254, which multi-hop remote attackers cannot forge","correct":true},{"text":"Changes the BGP TCP port from 179 to 8080","correct":false},{"text":"Drops all packets with TTL greater than 10","correct":false},{"text":"Disables TCP checksum validation","correct":false}]},{"id":"SCO_CLI_NETMIKO","title":"Page 6: Python Netmiko & TextFSM Structured Telemetry Extraction","tag":"Python • Netmiko + TextFSM","cefrOrLevel":"Drill #6 / 8","summary":"Connects via `ConnectHandler` with `use_textfsm=True` to parse unstructured CLI output into strongly-typed JSON arrays for automated SCORM grading.","metrics":[{"label":"Parser Engine","val":"NTC-Templates TextFSM","color":"#C5B358"},{"label":"Output Format","val":"Structured JSON","color":"#34d399"},{"label":"Grade Latency","val":"340 ms","color":"#60a5fa"}],"terminal":"from netmiko import ConnectHandler\nwith ConnectHandler(**r1_core) as conn:\n    ospf_nbrs = conn.send_command(\"show ip ospf neighbor\", use_textfsm=True)\n    assert all(n[\"state\"].startswith(\"FULL\") for n in ospf_nbrs)\n    print(\"✓ Verified Structured OSPF Telemetry:\", ospf_nbrs)","probeQuestion":"What does setting `use_textfsm=True` in Netmiko `send_command()` return instead of a raw multiline string?","options":[{"text":"A Python list of dictionaries containing parsed key-value fields","correct":true},{"text":"An encrypted MP3 audio file","correct":false},{"text":"A raw binary PCAP dump","correct":false},{"text":"An empty boolean value","correct":false}]},{"id":"SCO_CLI_KQL_SC200","title":"Page 7: Microsoft Sentinel KQL Threat Hunting (SC-200 / SC-100)","tag":"Microsoft Sentinel • KQL","cefrOrLevel":"Drill #7 / 8","summary":"Hunts anomalous service principal token requests and impossible-travel sign-ins across Microsoft Entra ID logs using Kusto Query Language (KQL).","metrics":[{"label":"SIEM Engine","val":"Microsoft Sentinel","color":"#34d399"},{"label":"Table Queried","val":"SigninLogs / AuditLogs","color":"#C5B358"},{"label":"MITRE ATT&CK","val":"T1078 Valid Accounts","color":"#60a5fa"}],"terminal":"SigninLogs\n| where TimeGenerated > ago(24h)\n| where ResultType == 0 and RiskLevelDuringSignIn in (\"high\", \"medium\")\n| summarize IpCount = dcount(IPAddress), Locations = make_set(Location) by UserPrincipalName\n| where IpCount > 3","probeQuestion":"In Kusto Query Language (KQL), which aggregation function counts the number of distinct IP addresses per `UserPrincipalName`?","options":[{"text":"dcount(IPAddress)","correct":true},{"text":"strcat(IPAddress)","correct":false},{"text":"parse_json(IPAddress)","correct":false},{"text":"bin(TimeGenerated, 1h)","correct":false}]},{"id":"SCO_CLI_FINAL_EXAM","title":"Page 8: Full-Spectrum Kinetic CLI & DevNet Mastery Checkpoint","tag":"SCORM 2004 Final Verification","cefrOrLevel":"Drill #8 / 8","summary":"Synthesizes IOS-XE routing, Ansible automation, Linux security, SQL normalization, and Sentinel KQL into a verified SCORM 2004 completion credential.","metrics":[{"label":"Domains Covered","val":"IOS-XE + Ansible + SQL + KQL","color":"#C5B358"},{"label":"Passing Score","val":"70% Normalized (0.70)","color":"#34d399"},{"label":"LMS Status","val":"cmi.completion_status","color":"#60a5fa"}],"terminal":"[GHOST-CLI FINAL TELEMETRY ROLLUP]:\n✓ Module 1-7 Checkpoints Verified\n✓ SCORM 2004 4th Edition Primary Objective: SATISFIED\n✓ Ready to commit cmi.completion_status = \"completed\" & cmi.success_status = \"passed\"","probeQuestion":"Which SCORM 2004 4th Edition API method persists all buffered CMI data model changes to the LMS backing store?","options":[{"text":"API_1484_11.Commit(\"\")","correct":true},{"text":"API_1484_11.ResetAll()","correct":false},{"text":"document.write()","correct":false},{"text":"localStorage.clear()","correct":false}]}];

                  </label>
                  <label class="block p-2.5 rounded-lg bg-slate-950 border border-slate-800">
                    <div class="flex justify-between text-slate-400 font-mono text-[10px] mb-1"><span>Lead Conv. Rate</span><span id="val-cr" class="text-emerald-300 font-bold">3.8%</span></div>
                    <input type="range" id="inp-cr" min="0.5" max="10" step="0.1" value="3.8" oninput="window.APP_OS.recalcWidget()" class="w-full accent-emerald-400">
                  </label>
                  <label class="block p-2.5 rounded-lg bg-slate-950 border border-slate-800">
                    <div class="flex justify-between text-slate-400 font-mono text-[10px] mb-1"><span>Avg Deal / Retainer</span><span id="val-deal" class="text-blue-300 font-bold">$1,850</span></div>
                    <input type="range" id="inp-deal" min="250" max="10000" step="50" value="1850" oninput="window.APP_OS.recalcWidget()" class="w-full accent-blue-400">
                  </label>
                </div>
                <div class="grid grid-cols-3 gap-2 text-center bg-slate-950/90 p-3 rounded-xl border border-slate-800 font-mono text-xs">
                  <div><div class="text-[10px] text-slate-400">Qualified Leads / Mo</div><div id="out-leads" class="text-sm font-black text-amber-400">475 Leads</div></div>
                  <div><div class="text-[10px] text-slate-400">Projected Monthly Rev</div><div id="out-mrr" class="text-sm font-black text-emerald-400">$175,750/mo</div></div>
                  <div><div class="text-[10px] text-slate-400">Cloud Run Infra Cost</div><div id="out-infra" class="text-sm font-black text-blue-400">$0.00 (Free Tier)</div></div>
                </div>
              </div>
            `;
          }
          if (appSlug === 'ghost-cli-trainer') {
            const firstLine = (page.terminal || '').split('\n')[0] || 'router ospf 10';
            return `
              <div class="mb-6 p-4 sm:p-5 rounded-xl bg-slate-900/90 border border-amber-500/40">
                <div class="flex flex-wrap justify-between items-center gap-2 pb-2 mb-3 border-b border-slate-800">
                  <span class="text-[11px] font-mono uppercase text-amber-400 font-bold">⌨️ Live Ghost-CLI Kinetic Typing Sandbox</span>
                  <span class="badge badge-accent font-mono text-[10px]" id="cli-acc-badge">Accuracy: 100% • 0 WPM</span>
                </div>
                <div class="text-xs font-mono text-slate-400 mb-1.5">Target Command Overlay: <code id="cli-target-str" class="text-amber-300 font-bold">${firstLine}</code></div>
                <input type="text" id="inp-ghost-cli" placeholder="${firstLine}" oninput="window.APP_OS.recalcWidget()" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 focus:border-amber-400 font-mono text-xs text-emerald-300 outline-none">
              </div>
            `;
          }
          if (appSlug === 'chronos-aetheria-scorm') {
            return `
              <div class="mb-6 p-4 sm:p-5 rounded-xl bg-slate-900/90 border border-amber-500/40">
                <div class="flex flex-wrap justify-between items-center gap-2 pb-2 mb-3 border-b border-slate-800">
                  <span class="text-[11px] font-mono uppercase text-amber-400 font-bold">🏛️ Interactive Ithaca/Aeneas Epigraphy &amp; WGS-84 Geodesic Workbench</span>
                  <span class="badge badge-gold font-mono text-[10px]">DeepMind + Vincenty</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3 text-xs">
                  <label class="block p-2.5 rounded-lg bg-slate-950 border border-slate-800">
                    <div class="flex justify-between text-slate-400 font-mono text-[10px] mb-1"><span>Lacuna Span (Chars)</span><span id="val-lac" class="text-amber-300 font-bold">6 chars</span></div>
                    <input type="range" id="inp-lac" min="1" max="18" value="6" oninput="window.APP_OS.recalcWidget()" class="w-full accent-amber-400">
                  </label>
                  <label class="block p-2.5 rounded-lg bg-slate-950 border border-slate-800">
                    <div class="flex justify-between text-slate-400 font-mono text-[10px] mb-1"><span>Beam Search Top-K</span><span id="val-beam" class="text-emerald-300 font-bold">K = 20</span></div>
                    <input type="range" id="inp-beam" min="5" max="50" step="5" value="20" oninput="window.APP_OS.recalcWidget()" class="w-full accent-emerald-400">
                  </label>
                  <label class="block p-2.5 rounded-lg bg-slate-950 border border-slate-800">
                    <div class="flex justify-between text-slate-400 font-mono text-[10px] mb-1"><span>Latitude Delta (&Delta;&phi;)</span><span id="val-lat" class="text-blue-300 font-bold">14.2&deg;</span></div>
                    <input type="range" id="inp-lat" min="1" max="45" step="0.5" value="14.2" oninput="window.APP_OS.recalcWidget()" class="w-full accent-blue-400">
                  </label>
                </div>
                <div class="grid grid-cols-3 gap-2 text-center bg-slate-950/90 p-3 rounded-xl border border-slate-800 font-mono text-xs">
                  <div><div class="text-[10px] text-slate-400">Top-1 Restoration Conf.</div><div id="out-conf" class="text-sm font-black text-emerald-400">94.8%</div></div>
                  <div><div class="text-[10px] text-slate-400">Chronological Error</div><div id="out-chron" class="text-sm font-black text-amber-400">&plusmn; 16 Years</div></div>
                  <div><div class="text-[10px] text-slate-400">WGS-84 Geodesic Arc</div><div id="out-geo" class="text-sm font-black text-blue-400">1,578.9 km</div></div>
                </div>
              </div>
            `;
          }
          return `
            <div class="mb-6 p-4 sm:p-5 rounded-xl bg-slate-900/90 border border-amber-500/40">
              <div class="flex flex-wrap justify-between items-center gap-2 pb-2 mb-3 border-b border-slate-800">
                <span class="text-[11px] font-mono uppercase text-amber-400 font-bold">🏗️ Interactive Turnkey Client SOW &amp; Retainer Quote Configurator</span>
                <span class="badge badge-accent font-mono text-[10px]">99.1% Gross Margin</span>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3 text-xs">
                <label class="block p-2.5 rounded-lg bg-slate-950 border border-slate-800">
                  <div class="flex justify-between text-slate-400 font-mono text-[10px] mb-1"><span>Turnkey Setup Fee</span><span id="val-setup" class="text-amber-300 font-bold">$3,500</span></div>
                  <input type="range" id="inp-setup" min="1000" max="15000" step="250" value="3500" oninput="window.APP_OS.recalcWidget()" class="w-full accent-amber-400">
                </label>
                <label class="block p-2.5 rounded-lg bg-slate-950 border border-slate-800">
                  <div class="flex justify-between text-slate-400 font-mono text-[10px] mb-1"><span>Monthly AI Retainer</span><span id="val-ret" class="text-emerald-300 font-bold">$499/mo</span></div>
                  <input type="range" id="inp-ret" min="199" max="2500" step="50" value="499" oninput="window.APP_OS.recalcWidget()" class="w-full accent-emerald-400">
                </label>
                <label class="block p-2.5 rounded-lg bg-slate-950 border border-slate-800">
                  <div class="flex justify-between text-slate-400 font-mono text-[10px] mb-1"><span>Active Client Accounts</span><span id="val-clients" class="text-blue-300 font-bold">8 Clients</span></div>
                  <input type="range" id="inp-clients" min="1" max="40" value="8" oninput="window.APP_OS.recalcWidget()" class="w-full accent-blue-400">
                </label>
              </div>
              <div class="grid grid-cols-3 gap-2 text-center bg-slate-950/90 p-3 rounded-xl border border-slate-800 font-mono text-xs">
                <div><div class="text-[10px] text-slate-400">Upfront Build Revenue</div><div id="out-upfront" class="text-sm font-black text-amber-400">$28,000</div></div>
                <div><div class="text-[10px] text-slate-400">Recurring Agency MRR</div><div id="out-ag-mrr" class="text-sm font-black text-emerald-400">$3,992/mo</div></div>
                <div><div class="text-[10px] text-slate-400">12-Month Total Portfolio</div><div id="out-ag-arr" class="text-sm font-black text-blue-400">$75,904/yr</div></div>
              </div>
            </div>
          `;
        },

        recalcWidget() {
          const appSlug = 'ghost-cli-trainer';
          if (appSlug === 'eveng-netprism-studio') {
            const bw = parseFloat((document.getElementById('inp-bw') || {}).value || 10);
            const mtu = parseFloat((document.getElementById('inp-mtu') || {}).value || 1500);
            const bfd = parseFloat((document.getElementById('inp-bfd') || {}).value || 50);
            document.getElementById('val-bw').innerText = bw + ' Gbps';
            document.getElementById('val-mtu').innerText = mtu + ' B';
            document.getElementById('val-bfd').innerText = bfd + ' ms (x3)';
            const pps = Math.round((bw * 1e9) / ((mtu + 38) * 8));
            const eff = (((mtu - 40) / (mtu + 38)) * 100).toFixed(1);
            document.getElementById('out-pps').innerText = pps.toLocaleString() + ' pps';
            document.getElementById('out-conv').innerText = (bfd * 3) + ' ms';
            document.getElementById('out-eff').innerText = eff + '%';
          } else if (appSlug === 'samgov-contract-matchmaker') {
            const fte = parseFloat((document.getElementById('inp-fte') || {}).value || 4);
            const rate = parseFloat((document.getElementById('inp-rate') || {}).value || 165);
            const margin = parseFloat((document.getElementById('inp-margin') || {}).value || 24);
            document.getElementById('val-fte').innerText = fte + ' FTEs';
            document.getElementById('val-rate').innerText = '$' + rate + '/hr';
            document.getElementById('val-margin').innerText = margin + '%';
            const acv = Math.round(fte * rate * 1920);
            const profit = Math.round(acv * (margin / 100));
            document.getElementById('out-acv').innerText = '$' + acv.toLocaleString();
            document.getElementById('out-profit').innerText = '$' + profit.toLocaleString();
            document.getElementById('out-far').innerText = acv <= 4500000 ? 'PASS (<= $4.5M)' : 'COMPETITIVE (> $4.5M)';
          } else if (appSlug === 'traffic-roi-simulator') {
            const vis = parseFloat((document.getElementById('inp-vis') || {}).value || 12500);
            const cr = parseFloat((document.getElementById('inp-cr') || {}).value || 3.8);
            const deal = parseFloat((document.getElementById('inp-deal') || {}).value || 1850);
            document.getElementById('val-vis').innerText = vis.toLocaleString();
            document.getElementById('val-cr').innerText = cr.toFixed(1) + '%';
            document.getElementById('val-deal').innerText = '$' + deal.toLocaleString();
            const leads = Math.round(vis * (cr / 100));
            const mrr = Math.round(leads * 0.20 * deal);
            document.getElementById('out-leads').innerText = leads.toLocaleString() + ' Leads';
            document.getElementById('out-mrr').innerText = '$' + mrr.toLocaleString() + '/mo';
            document.getElementById('out-infra').innerText = vis <= 2000000 ? '$0.00 (Free Tier)' : '$4.20/mo';
          } else if (appSlug === 'ghost-cli-trainer') {
            const inp = (document.getElementById('inp-ghost-cli') || {}).value || '';
            const tgt = (document.getElementById('cli-target-str') || {}).innerText || '';
            let match = 0;
            for (let i = 0; i < inp.length; i++) {
              if (inp[i] === tgt[i]) match++;
            }
            const acc = inp.length ? Math.round((match / inp.length) * 100) : 100;
            const wpm = Math.min(135, Math.round(inp.length * 2.4));
            const b = document.getElementById('cli-acc-badge');
            if (b) b.innerText = 'Accuracy: ' + acc + '% • ' + wpm + ' WPM';
          } else if (appSlug === 'chronos-aetheria-scorm') {
            const lac = parseFloat((document.getElementById('inp-lac') || {}).value || 6);
            const beam = parseFloat((document.getElementById('inp-beam') || {}).value || 20);
            const lat = parseFloat((document.getElementById('inp-lat') || {}).value || 14.2);
            document.getElementById('val-lac').innerText = lac + ' chars';
            document.getElementById('val-beam').innerText = 'K = ' + beam;
            document.getElementById('val-lat').innerText = lat + '°';
            const conf = Math.max(62, Math.min(99.4, 98.5 - lac * 1.15 + beam * 0.08)).toFixed(1);
            const chron = Math.max(8, Math.round(12 + lac * 0.9));
            const geo = (lat * 111.19).toFixed(1);
            document.getElementById('out-conf').innerText = conf + '%';
            document.getElementById('out-chron').innerText = '± ' + chron + ' Years';
            document.getElementById('out-geo').innerText = Number(geo).toLocaleString() + ' km';
          } else {
            const setup = parseFloat((document.getElementById('inp-setup') || {}).value || 3500);
            const ret = parseFloat((document.getElementById('inp-ret') || {}).value || 499);
            const clients = parseFloat((document.getElementById('inp-clients') || {}).value || 8);
            document.getElementById('val-setup').innerText = '$' + setup.toLocaleString();
            document.getElementById('val-ret').innerText = '$' + ret.toLocaleString() + '/mo';
            document.getElementById('val-clients').innerText = clients + ' Clients';
            const upfront = setup * clients;
            const mrr = ret * clients;
            const arr = upfront + mrr * 12;
            document.getElementById('out-upfront').innerText = '$' + upfront.toLocaleString();
            document.getElementById('out-ag-mrr').innerText = '$' + mrr.toLocaleString() + '/mo';
            document.getElementById('out-ag-arr').innerText = '$' + arr.toLocaleString() + '/yr';
          }
        },

        render() {
          const page = this.pages[this.currentIndex];
          const vp = document.getElementById('app-viewport');
          if (!vp || !page) return;

          const metricsHtml = page.metrics.map(m => `
            <div class="p-3.5 rounded-xl bg-slate-950/85 border border-slate-800/90 text-center">
              <div class="text-[10px] font-mono uppercase text-slate-400">${m.label}</div>
              <div class="text-base font-black font-mono mt-1" style="color:${m.color}">${m.val}</div>
            </div>
          `).join('');

          const optionsHtml = page.options.map((o, idx) => `
            <button onclick="window.APP_OS.checkAnswer(${idx})" class="w-full p-3.5 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-700/80 hover:border-amber-400/60 text-left text-xs text-slate-100 font-medium transition flex items-start gap-2.5">
              <span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 font-mono font-bold text-[11px] shrink-0">${idx + 1}</span>
              <span>${o.text}</span>
            </button>
          `).join('');

          const interactiveWidgetHtml = this.getInteractiveWidgetHtml(page, this.currentIndex);

          vp.innerHTML = `
            <div class="glass-panel rounded-2xl p-6 sm:p-8">
              <!-- Top Page Navigation Strip -->
              <div class="flex flex-wrap justify-between items-center gap-2 pb-4 mb-5 border-b border-slate-800/90">
                <div class="flex items-center gap-2">
                  <span class="badge badge-gold font-mono">${page.cefrOrLevel}</span>
                  <span class="badge badge-accent font-mono">${page.tag}</span>
                </div>
                <div class="flex items-center gap-2">
                  <button onclick="window.APP_OS.prevPage()" class="btn btn-outline btn-xs">← Prev [←]</button>
                  <button onclick="window.APP_OS.nextPage()" class="btn btn-gold btn-xs">Next [→] →</button>
                </div>
              </div>

              <h1 class="text-xl sm:text-2xl font-black text-white tracking-tight mb-2">${page.title}</h1>
              <p class="text-xs sm:text-sm text-slate-300 leading-relaxed mb-5">${page.summary}</p>

              <!-- 3-Column F.I.X. Telemetry KPIs -->
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-5">
                ${metricsHtml}
              </div>

              <!-- Live Interactive Simulator / Calculator Widget -->
              ${interactiveWidgetHtml}

              <!-- Live Console / Telemetry Output -->
              <div class="mb-6 rounded-xl bg-slate-950/95 border border-amber-500/30 p-4 font-mono text-xs text-emerald-300 overflow-x-auto">
                <div class="flex justify-between items-center text-[10px] text-amber-400 uppercase pb-2 mb-2 border-b border-slate-800">
                  <span>● Live SCORM 2004 Telemetry &amp; Execution Console</span>
                  <span>${page.id}</span>
                </div>
                <pre class="m-0 whitespace-pre-wrap leading-relaxed text-slate-200">${page.terminal}</pre>
              </div>

              <!-- Interactive SCORM 2004 Verification Probe -->
              <div class="p-4 sm:p-5 rounded-xl bg-slate-900/70 border border-slate-800">
                <div class="text-[10px] font-mono uppercase text-amber-400 font-bold mb-1">Interactive SCORM 2004 Verification Checkpoint [Keys 1–4]</div>
                <p class="text-xs sm:text-sm font-bold text-white mb-3">${page.probeQuestion}</p>
                <div class="space-y-2">
                  ${optionsHtml}
                </div>
                <div id="probe-feedback" class="hidden"></div>
              </div>

              <!-- Bottom Navigation Footer -->
              <div class="flex justify-between items-center mt-6 pt-4 border-t border-slate-800/80 text-xs text-slate-400">
                <button onclick="window.APP_OS.prevPage()" class="btn btn-outline btn-xs">← Previous Page [←]</button>
                <span class="font-mono text-[11px] text-amber-300">Page ${this.currentIndex + 1} of ${this.pages.length}</span>
                <button onclick="window.APP_OS.nextPage()" class="btn btn-gold btn-xs">Next Page [→] →</button>
              </div>
            </div>
          `;

          this.updateTelemetry();
        }
      };

      document.addEventListener('click', (e) => {
        if (!window.APP_OS || !window.APP_OS.activeDropdown) return;
        const inside = ['dd-container-pages', 'dd-container-trackers', 'dd-container-themes'].some(id => {
          const el = document.getElementById(id);
          return el && el.contains(e.target);
        });
        if (!inside) window.APP_OS.closeDropdowns();
      });

      window.addEventListener('keydown', (e) => {
        if (!window.APP_OS) return;
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes((e.target && e.target.tagName) || '')) return;
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          window.APP_OS.nextPage();
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          window.APP_OS.prevPage();
        } else if (['1', '2', '3', '4'].includes(e.key)) {
          window.APP_OS.checkAnswer(parseInt(e.key, 10) - 1);
        }
      });

      window.APP_OS.applyVisuals();
      window.APP_OS.render();
    })();
  </script>
</body>
</html>
