                <div class="text-xs font-mono text-slate-400 mb-1.5">Target Command Overlay: <code id="cli-target-str" class="text-amber-300 font-bold">${firstLine}</code></div>
                <input type="text" id="inp-ghost-cli" placeholder="${firstLine}" oninput="window.APP_OS.recalcWidget()" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 focus:border-amber-400 font-mono text-xs text-emerald-300 outline-none">
              </div>
            `;
          }
          if (appSlug === 'chronos-aetheria-scorm') {
            return `
              <div class="mb-6 p-4 sm:p-5 rounded-xl bg-slate-900/90 border border-amber-500/40">
                <div class="flex flex-wrap justify-between items-center gap-2 pb-2 mb-3 border-b border-slate-800">
                  <span class="text-[11px] font-mono uppercase text-amber-400 font-bold">🏛️ Interactive Ithaca/Aeneas Epigraphy &amp; WGS-84 Geodesic Workbench</span>
                  <span class="badge badge-gold font-mono text-[10px]">DeepMind + Vincenty</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3 text-xs">
                  <label class="block p-2.5 rounded-lg bg-slate-950 border border-slate-800">
                    <div class="flex justify-between text-slate-400 font-mono text-[10px] mb-1"><span>Lacuna Span (Chars)</span><span id="val-lac" class="text-amber-300 font-bold">6 chars</span></div>
                    <input type="range" id="inp-lac" min="1" max="18" value="6" oninput="window.APP_OS.recalcWidget()" class="w-full accent-amber-400">
                  </label>
                  <label class="block p-2.5 rounded-lg bg-slate-950 border border-slate-800">
                    <div class="flex justify-between text-slate-400 font-mono text-[10px] mb-1"><span>Beam Search Top-K</span><span id="val-beam" class="text-emerald-300 font-bold">K = 20</span></div>
                    <input type="range" id="inp-beam" min="5" max="50" step="5" value="20" oninput="window.APP_OS.recalcWidget()" class="w-full accent-emerald-400">
                  </label>
                  <label class="block p-2.5 rounded-lg bg-slate-950 border border-slate-800">
                    <div class="flex justify-between text-slate-400 font-mono text-[10px] mb-1"><span>Latitude Delta (&Delta;&phi;)</span><span id="val-lat" class="text-blue-300 font-bold">14.2&deg;</span></div>
                    <input type="range" id="inp-lat" min="1" max="45" step="0.5" value="14.2" oninput="window.APP_OS.recalcWidget()" class="w-full accent-blue-400">
                  </label>
                </div>
                <div class="grid grid-cols-3 gap-2 text-center bg-slate-950/90 p-3 rounded-xl border border-slate-800 font-mono text-xs">
                  <div><div class="text-[10px] text-slate-400">Top-1 Restoration Conf.</div><div id="out-conf" class="text-sm font-black text-emerald-400">94.8%</div></div>
                  <div><div class="text-[10px] text-slate-400">Chronological Error</div><div id="out-chron" class="text-sm font-black text-amber-400">&plusmn; 16 Years</div></div>
                  <div><div class="text-[10px] text-slate-400">WGS-84 Geodesic Arc</div><div id="out-geo" class="text-sm font-black text-blue-400">1,578.9 km</div></div>
                </div>
              </div>
            `;
          }
          return `
            <div class="mb-6 p-4 sm:p-5 rounded-xl bg-slate-900/90 border border-amber-500/40">
              <div class="flex flex-wrap justify-between items-center gap-2 pb-2 mb-3 border-b border-slate-800">
                <span class="text-[11px] font-mono uppercase text-amber-400 font-bold">🏗️ Interactive Turnkey Client SOW &amp; Retainer Quote Configurator</span>
                <span class="badge badge-accent font-mono text-[10px]">99.1% Gross Margin</span>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3 text-xs">
                <label class="block p-2.5 rounded-lg bg-slate-950 border border-slate-800">
                  <div class="flex justify-between text-slate-400 font-mono text-[10px] mb-1"><span>Turnkey Setup Fee</span><span id="val-setup" class="text-amber-300 font-bold">$3,500</span></div>
                  <input type="range" id="inp-setup" min="1000" max="15000" step="250" value="3500" oninput="window.APP_OS.recalcWidget()" class="w-full accent-amber-400">
                </label>
                <label class="block p-2.5 rounded-lg bg-slate-950 border border-slate-800">
                  <div class="flex justify-between text-slate-400 font-mono text-[10px] mb-1"><span>Monthly AI Retainer</span><span id="val-ret" class="text-emerald-300 font-bold">$499/mo</span></div>
                  <input type="range" id="inp-ret" min="199" max="2500" step="50" value="499" oninput="window.APP_OS.recalcWidget()" class="w-full accent-emerald-400">
                </label>
                <label class="block p-2.5 rounded-lg bg-slate-950 border border-slate-800">
                  <div class="flex justify-between text-slate-400 font-mono text-[10px] mb-1"><span>Active Client Accounts</span><span id="val-clients" class="text-blue-300 font-bold">8 Clients</span></div>
                  <input type="range" id="inp-clients" min="1" max="40" value="8" oninput="window.APP_OS.recalcWidget()" class="w-full accent-blue-400">
                </label>
              </div>
              <div class="grid grid-cols-3 gap-2 text-center bg-slate-950/90 p-3 rounded-xl border border-slate-800 font-mono text-xs">
                <div><div class="text-[10px] text-slate-400">Upfront Build Revenue</div><div id="out-upfront" class="text-sm font-black text-amber-400">$28,000</div></div>
                <div><div class="text-[10px] text-slate-400">Recurring Agency MRR</div><div id="out-ag-mrr" class="text-sm font-black text-emerald-400">$3,992/mo</div></div>
                <div><div class="text-[10px] text-slate-400">12-Month Total Portfolio</div><div id="out-ag-arr" class="text-sm font-black text-blue-400">$75,904/yr</div></div>
              </div>
            </div>
          `;
        },

        recalcWidget() {
          const appSlug = 'traffic-roi-simulator';
          if (appSlug === 'eveng-netprism-studio') {
            const bw = parseFloat((document.getElementById('inp-bw') || {}).value || 10);
            const mtu = parseFloat((document.getElementById('inp-mtu') || {}).value || 1500);
            const bfd = parseFloat((document.getElementById('inp-bfd') || {}).value || 50);
            document.getElementById('val-bw').innerText = bw + ' Gbps';
            document.getElementById('val-mtu').innerText = mtu + ' B';
            document.getElementById('val-bfd').innerText = bfd + ' ms (x3)';
            const pps = Math.round((bw * 1e9) / ((mtu + 38) * 8));
            const eff = (((mtu - 40) / (mtu + 38)) * 100).toFixed(1);
            document.getElementById('out-pps').innerText = pps.toLocaleString() + ' pps';
            document.getElementById('out-conv').innerText = (bfd * 3) + ' ms';
            document.getElementById('out-eff').innerText = eff + '%';
          } else if (appSlug === 'samgov-contract-matchmaker') {
            const fte = parseFloat((document.getElementById('inp-fte') || {}).value || 4);
            const rate = parseFloat((document.getElementById('inp-rate') || {}).value || 165);
            const margin = parseFloat((document.getElementById('inp-margin') || {}).value || 24);
            document.getElementById('val-fte').innerText = fte + ' FTEs';
            document.getElementById('val-rate').innerText = '$' + rate + '/hr';
            document.getElementById('val-margin').innerText = margin + '%';
            const acv = Math.round(fte * rate * 1920);
            const profit = Math.round(acv * (margin / 100));
            document.getElementById('out-acv').innerText = '$' + acv.toLocaleString();
            document.getElementById('out-profit').innerText = '$' + profit.toLocaleString();
            document.getElementById('out-far').innerText = acv <= 4500000 ? 'PASS (<= $4.5M)' : 'COMPETITIVE (> $4.5M)';
          } else if (appSlug === 'traffic-roi-simulator') {
            const vis = parseFloat((document.getElementById('inp-vis') || {}).value || 12500);
            const cr = parseFloat((document.getElementById('inp-cr') || {}).value || 3.8);
            const deal = parseFloat((document.getElementById('inp-deal') || {}).value || 1850);
            document.getElementById('val-vis').innerText = vis.toLocaleString();
            document.getElementById('val-cr').innerText = cr.toFixed(1) + '%';
            document.getElementById('val-deal').innerText = '$' + deal.toLocaleString();
            const leads = Math.round(vis * (cr / 100));
            const mrr = Math.round(leads * 0.20 * deal);
            document.getElementById('out-leads').innerText = leads.toLocaleString() + ' Leads';
            document.getElementById('out-mrr').innerText = '$' + mrr.toLocaleString() + '/mo';
            document.getElementById('out-infra').innerText = vis <= 2000000 ? '$0.00 (Free Tier)' : '$4.20/mo';
          } else if (appSlug === 'ghost-cli-trainer') {
            const inp = (document.getElementById('inp-ghost-cli') || {}).value || '';
            const tgt = (document.getElementById('cli-target-str') || {}).innerText || '';
            let match = 0;
            for (let i = 0; i < inp.length; i++) {
              if (inp[i] === tgt[i]) match++;
            }
            const acc = inp.length ? Math.round((match / inp.length) * 100) : 100;
            const wpm = Math.min(135, Math.round(inp.length * 2.4));
            const b = document.getElementById('cli-acc-badge');
            if (b) b.innerText = 'Accuracy: ' + acc + '% • ' + wpm + ' WPM';
          } else if (appSlug === 'chronos-aetheria-scorm') {
            const lac = parseFloat((document.getElementById('inp-lac') || {}).value || 6);
            const beam = parseFloat((document.getElementById('inp-beam') || {}).value || 20);
            const lat = parseFloat((document.getElementById('inp-lat') || {}).value || 14.2);
            document.getElementById('val-lac').innerText = lac + ' chars';
            document.getElementById('val-beam').innerText = 'K = ' + beam;
            document.getElementById('val-lat').innerText = lat + '°';
            const conf = Math.max(62, Math.min(99.4, 98.5 - lac * 1.15 + beam * 0.08)).toFixed(1);
            const chron = Math.max(8, Math.round(12 + lac * 0.9));
            const geo = (lat * 111.19).toFixed(1);
            document.getElementById('out-conf').innerText = conf + '%';
            document.getElementById('out-chron').innerText = '± ' + chron + ' Years';
            document.getElementById('out-geo').innerText = Number(geo).toLocaleString() + ' km';
          } else {
            const setup = parseFloat((document.getElementById('inp-setup') || {}).value || 3500);
            const ret = parseFloat((document.getElementById('inp-ret') || {}).value || 499);
            const clients = parseFloat((document.getElementById('inp-clients') || {}).value || 8);
            document.getElementById('val-setup').innerText = '$' + setup.toLocaleString();
            document.getElementById('val-ret').innerText = '$' + ret.toLocaleString() + '/mo';
            document.getElementById('val-clients').innerText = clients + ' Clients';
            const upfront = setup * clients;
            const mrr = ret * clients;
            const arr = upfront + mrr * 12;
            document.getElementById('out-upfront').innerText = '$' + upfront.toLocaleString();
            document.getElementById('out-ag-mrr').innerText = '$' + mrr.toLocaleString() + '/mo';
            document.getElementById('out-ag-arr').innerText = '$' + arr.toLocaleString() + '/yr';
          }
        },

        render() {
          const page = this.pages[this.currentIndex];
          const vp = document.getElementById('app-viewport');
          if (!vp || !page) return;

          const metricsHtml = page.metrics.map(m => `
            <div class="p-3.5 rounded-xl bg-slate-950/85 border border-slate-800/90 text-center">
              <div class="text-[10px] font-mono uppercase text-slate-400">${m.label}</div>
              <div class="text-base font-black font-mono mt-1" style="color:${m.color}">${m.val}</div>
            </div>
          `).join('');

          const optionsHtml = page.options.map((o, idx) => `
            <button onclick="window.APP_OS.checkAnswer(${idx})" class="w-full p-3.5 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-700/80 hover:border-amber-400/60 text-left text-xs text-slate-100 font-medium transition flex items-start gap-2.5">
              <span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 font-mono font-bold text-[11px] shrink-0">${idx + 1}</span>
              <span>${o.text}</span>
            </button>
          `).join('');

          const interactiveWidgetHtml = this.getInteractiveWidgetHtml(page, this.currentIndex);

          vp.innerHTML = `
            <div class="glass-panel rounded-2xl p-6 sm:p-8">
              <!-- Top Page Navigation Strip -->
              <div class="flex flex-wrap justify-between items-center gap-2 pb-4 mb-5 border-b border-slate-800/90">
                <div class="flex items-center gap-2">
                  <span class="badge badge-gold font-mono">${page.cefrOrLevel}</span>
                  <span class="badge badge-accent font-mono">${page.tag}</span>
                </div>
                <div class="flex items-center gap-2">
                  <button onclick="window.APP_OS.prevPage()" class="btn btn-outline btn-xs">← Prev [←]</button>
                  <button onclick="window.APP_OS.nextPage()" class="btn btn-gold btn-xs">Next [→] →</button>
                </div>
              </div>

              <h1 class="text-xl sm:text-2xl font-black text-white tracking-tight mb-2">${page.title}</h1>
              <p class="text-xs sm:text-sm text-slate-300 leading-relaxed mb-5">${page.summary}</p>

              <!-- 3-Column F.I.X. Telemetry KPIs -->
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-5">
                ${metricsHtml}
              </div>

              <!-- Live Interactive Simulator / Calculator Widget -->
              ${interactiveWidgetHtml}

              <!-- Live Console / Telemetry Output -->
              <div class="mb-6 rounded-xl bg-slate-950/95 border border-amber-500/30 p-4 font-mono text-xs text-emerald-300 overflow-x-auto">
                <div class="flex justify-between items-center text-[10px] text-amber-400 uppercase pb-2 mb-2 border-b border-slate-800">
                  <span>● Live SCORM 2004 Telemetry &amp; Execution Console</span>
                  <span>${page.id}</span>
                </div>
                <pre class="m-0 whitespace-pre-wrap leading-relaxed text-slate-200">${page.terminal}</pre>
              </div>

              <!-- Interactive SCORM 2004 Verification Probe -->
              <div class="p-4 sm:p-5 rounded-xl bg-slate-900/70 border border-slate-800">
                <div class="text-[10px] font-mono uppercase text-amber-400 font-bold mb-1">Interactive SCORM 2004 Verification Checkpoint [Keys 1–4]</div>
                <p class="text-xs sm:text-sm font-bold text-white mb-3">${page.probeQuestion}</p>
                <div class="space-y-2">
                  ${optionsHtml}
                </div>
                <div id="probe-feedback" class="hidden"></div>
              </div>

              <!-- Bottom Navigation Footer -->
              <div class="flex justify-between items-center mt-6 pt-4 border-t border-slate-800/80 text-xs text-slate-400">
                <button onclick="window.APP_OS.prevPage()" class="btn btn-outline btn-xs">← Previous Page [←]</button>
                <span class="font-mono text-[11px] text-amber-300">Page ${this.currentIndex + 1} of ${this.pages.length}</span>
                <button onclick="window.APP_OS.nextPage()" class="btn btn-gold btn-xs">Next Page [→] →</button>
              </div>
            </div>
          `;

          this.updateTelemetry();
        }
      };

      document.addEventListener('click', (e) => {
        if (!window.APP_OS || !window.APP_OS.activeDropdown) return;
        const inside = ['dd-container-pages', 'dd-container-trackers', 'dd-container-themes'].some(id => {
          const el = document.getElementById(id);
          return el && el.contains(e.target);
        });
        if (!inside) window.APP_OS.closeDropdowns();
      });

      window.addEventListener('keydown', (e) => {
        if (!window.APP_OS) return;
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes((e.target && e.target.tagName) || '')) return;
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          window.APP_OS.nextPage();
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          window.APP_OS.prevPage();
        } else if (['1', '2', '3', '4'].includes(e.key)) {
          window.APP_OS.checkAnswer(parseInt(e.key, 10) - 1);
        }
      });

      window.APP_OS.applyVisuals();
      window.APP_OS.render();
    })();
  </script>
</body>
</html>
