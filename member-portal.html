<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Workspace | MGC / F.I.X</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body>
<main class="wrap" id="app"></main>
<script src="mgc-workspace-core.js"></script>
<script>
(function () {
  const W = MGCW, S = () => W.S, esc = W.esc;
  const app = document.getElementById('app');
  let u = W.me();
  const qs = new URLSearchParams(location.search);
  const initialView = qs.get('view') || (location.hash || '').slice(1) || 'apps';
  let tab = ['payment', 'billing'].includes(initialView)
    ? 'payment'
    : (['consultation', 'request', 'consult'].includes(initialView) ? 'consultation' : initialView);
  let lastPaymentReceipt = null;
  let lastPaymentError = '';
  let lastConsultationReceipt = null;
  let lastConsultationError = '';
  let selectedConsultTrack = 'ai-web';
  let activeAiToolOutput = null;

  // Otto Guided Personalization & DocuSign-Style Sequential Lock State
  let showNetflixOnboarding = qs.get('onboard') === '1';
  let selectedCategories = [];
  let selectedDivergentBaseline = 'en_arabic_heritage';
  let customLearningGoal = 'Spanish, Farsi & Cross-Domain Fluency';
  let ottoStep2Confirmed = false;
  let ottoRoleTitle = '';
  let ottoIndustrySector = '';
  let ottoOrgSize = '1-10';
  let ottoResourceInterest = 'resource-fast-track';
  let ottoConsentTailor = false;
  let ottoConsentDataSharing = false;
  let onboardingError = '';
  let selectedAiTemplateId = 'tpl_lang_associative';
  let selectedAiPacing = '30-Day Guided Sequence';
  let selectedScenarioBranches = {};

  const isSoleAdmin = () => Boolean(W.isOwner ? W.isOwner(u) : (u && u.role === 'owner' && u.id === 'owner'));
  const isEmp = () => Boolean(W.isEmployee ? W.isEmployee(u) : (u && u.role !== 'owner' && u.ou === 'internal' && u.status === 'active'));
  const isClientUser = () => Boolean(W.isClient ? W.isClient(u) : (u && u.role !== 'owner' && u.ou !== 'internal'));
  const getQualifiedResources = () => {
    const cat = W.getResourcesCatalog ? W.getResourcesCatalog() : (W.RESOURCES_CATALOG || []);
    return cat.filter(r => isSoleAdmin() || W.can(u, 'resource', r.id, 'view'));
  };

  function syncOnboardingStateFromUser() {
    if (!u) return;
    if (Array.isArray(u.selectedCategories) && u.selectedCategories.length) {
      selectedCategories = u.selectedCategories.slice();
    }
    if (u.divergentBaseline && W.DIVERGENT_BRIDGES && W.DIVERGENT_BRIDGES[u.divergentBaseline]) {
      selectedDivergentBaseline = u.divergentBaseline;
    }
    if (u.learningGoal && !customLearningGoal) {
      customLearningGoal = u.learningGoal;
    }
    if (u.ottoProfile) {
      ottoStep2Confirmed = true;
      if (!ottoRoleTitle && u.ottoProfile.roleTitle) ottoRoleTitle = u.ottoProfile.roleTitle;
      if (!ottoIndustrySector && u.ottoProfile.industrySector) ottoIndustrySector = u.ottoProfile.industrySector;
      if (u.ottoProfile.orgSize) ottoOrgSize = u.ottoProfile.orgSize;
      if (u.ottoProfile.resourceInterest) ottoResourceInterest = u.ottoProfile.resourceInterest;
      if (typeof u.ottoProfile.consentWorkspaceTailoring === 'boolean') ottoConsentTailor = u.ottoProfile.consentWorkspaceTailoring;
      if (typeof u.ottoProfile.dataSharingOptIn === 'boolean') ottoConsentDataSharing = u.ottoProfile.dataSharingOptIn;
    }
  }

  const CONSULTATION_TRACKS = [
    {
      id: 'ai-web',
      scope: 'Turnkey Web, Autonomous AI Receptionist & SaaS Portal',
      badge: 'Commercial & SaaS',
      desc: 'Full-stack web presence, 24/7 AI lead intake, calendar booking, and customer portal.'
    },
    {
      id: 'training',
      scope: 'Decoupled SCORM 2004 LMS & Interactive Lab Studio',
      badge: 'Enterprise Academy',
      desc: 'SCORM 2004 4th Ed. courseware, EVE-NG topology workbenches, and automated grading.'
    },
    {
      id: 'cyber',
      scope: 'Zero-Trust Cybersecurity & CMMC 2.0 Architecture',
      badge: 'Security & Compliance',
      desc: 'NIST SP 800-171 control mapping, federated OIDC hardening, and continuous telemetry.'
    },
    {
      id: 'federal',
      scope: 'SDVOSB Federal Teaming & Custom Engineering',
      badge: 'Federal & Defense',
      desc: 'NAICS 541512/541519 prime/subcontract execution, capability architecture, and WAWF integration.'
    }
  ];

  function saasAppsAndLmsPanel() {
    const apps = W.APPS_CATALOG || [];
    // Strict Zero-Leakage Policy: Only render applications the user actually has access to
    const unlockedApps = apps.filter(a => W.can(u, 'app', a.id, 'view'));
    const grantedPages = W.CATALOG.filter(c => c.id !== 'saasapps' && (!isEmp() || c.id !== 'finance') && W.can(u, 'page', c.id, 'view'));

    const renderAppCard = (a) => {
      const badge = '<span class="chip ok">' + (isSoleAdmin() ? 'Admin' : 'Active') + '</span>';
      const act = '<a class="btn pri" href="' + esc(a.href) + '">Launch</a>' + (a.zipHref ? ' <a class="btn" href="' + esc(a.zipHref) + '" download>SCORM</a>' : '');
      return '<div class="compact-card" data-app-card="' + esc(a.id) + '" style="border-color:rgba(16,185,129,0.38);padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;gap:12px">' +
        '<div><div class="row"><h3>' + esc(a.title) + '</h3>' + badge + '</div><p>' + esc(a.desc || '') + '</p></div>' +
        '<div class="row" style="justify-content:flex-start;gap:8px">' + act + '</div></div>';
    };

    const grantedPagesHtml = grantedPages.length
      ? '<div class="card" style="padding:18px 20px;margin-top:12px">' +
          '<div class="row" style="margin-bottom:12px"><h2 style="margin:0;font-size:15px;font-weight:600">' + (isEmp() ? 'Internal Portals &amp; Operations (' : 'Authorized Workspace Modules (') + grantedPages.length + ')</h2></div>' +
          '<div class="bento-2">' + grantedPages.map(c =>
            '<div class="compact-card" style="border-color:rgba(59,130,246,0.38);padding:14px 16px"><div class="row"><h3>' + esc(c.title) + '</h3><a class="btn pri" href="' + esc(c.href) + '">Open</a></div><p>' + esc(c.desc || '') + '</p></div>'
          ).join('') + '</div></div>'
      : '';

    const qualifiedRes = getQualifiedResources();
    const resBtnHtml = qualifiedRes.length > 0
      ? '<button type="button" class="btn" data-go-resources="1" style="border-color:rgba(197,179,88,0.45);color:#fde047">Resources &amp; AI Tools (' + qualifiedRes.length + ')</button>'
      : '';

    const personalizeBtnHtml = '<button type="button" class="btn" id="btnOpenNetflixOnboarding" style="border-color:rgba(16,185,129,0.45);color:#6ee7b7">Otto Setup</button>';

    const topRightActions = isEmp()
      ? '<div style="display:flex;gap:8px;flex-wrap:wrap">' + personalizeBtnHtml + '<a class="btn" href="saas-apps-and-lms-showcase.html">Showcase</a>' + resBtnHtml + '<a class="btn pri" href="access-admin.html?tab=users&amp;ou=external">Client Directory</a></div>'
      : '<div style="display:flex;gap:8px;flex-wrap:wrap">' + personalizeBtnHtml + '<a class="btn" href="saas-apps-and-lms-showcase.html">Showcase</a>' + resBtnHtml + '<button type="button" class="btn" data-go-consultation="1">Submit Request &amp; Consultation</button>' + (!isEmp() ? '<button type="button" class="btn pri" data-go-payment="1">Billing</button>' : '') + '</div>';

    const bridges = W.DIVERGENT_BRIDGES || {};
    const catsCatalog = W.ONBOARDING_CATEGORIES || [];
    const activeBaselineKey = (u && u.divergentBaseline && bridges[u.divergentBaseline]) ? u.divergentBaseline : selectedDivergentBaseline;
    const activeBridge = bridges[activeBaselineKey] || Object.values(bridges)[0];
    const activeCatIds = (Array.isArray(u && u.selectedCategories) && u.selectedCategories.length)
      ? u.selectedCategories
      : (selectedCategories.length ? selectedCategories : ['cat_ai_saas', 'cat_divergent_lang']);
    const userCatObjs = catsCatalog.filter(c => activeCatIds.includes(c.id));
    const ottoProf = (u && u.ottoProfile) || null;
    const assocTelem = (u && u.associativeTelemetry) || { completedStages: {}, weightBoosts: {}, scenarioSelections: {}, events: [] };
    const thresholdInfo = W.getCatalogThresholdStatus ? W.getCatalogThresholdStatus() : { currentCount: 18, threshold: 50, reached: false };

    const divergentSummaryStrip = activeBridge
      ? '<div class="card" id="divergentLearningSummaryBanner" style="padding:16px 20px;margin-bottom:14px;border-color:rgba(16,185,129,0.42);background:linear-gradient(135deg,rgba(6,78,59,0.26),rgba(10,15,28,0.96))">' +
          '<div class="row" style="margin-bottom:10px">' +
            '<div>' +
              '<span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#34d399">Otto · Option A1 + A2 Weighted Telemetry &amp; Completion Graph</span>' +
              '<h3 style="margin:2px 0 0;font-size:14.5px;font-weight:600;color:#fff">' + esc(activeBridge.label) + '</h3>' +
            '</div>' +
            '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">' +
              userCatObjs.map(c => '<span class="chip ok" style="font-size:10.5px">' + esc(c.tag) + '</span>').join('') +
              '<span class="chip" id="optionA3ThresholdBadge" style="font-size:10.5px;border-color:rgba(59,130,246,0.52);color:#93c5fd">' +
                (thresholdInfo.reached
                  ? ('Option A3 Ready · ' + thresholdInfo.currentCount + '/' + thresholdInfo.threshold + ' Apps')
                  : ('Option A3 Monitor · ' + thresholdInfo.currentCount + '/' + thresholdInfo.threshold + ' Modules (Auto-Notify at 50)')) +
              '</span>' +
              (ottoProf && ottoProf.dataSharingOptIn ? '<span class="chip" style="font-size:10.5px;border-color:rgba(197,179,88,0.55);color:#fde047">Partner Program Active</span>' : '') +
              '<button type="button" class="btn" data-open-onboarding="1" style="padding:5px 10px;font-size:11.5px">Edit Otto</button>' +
            '</div>' +
          '</div>' +
          '<div class="bento-3">' +
            (activeBridge.sequence || []).map((st, idx) => {
              const stageKey = activeBaselineKey + ':step_' + st.step;
              const prevKey = activeBaselineKey + ':step_' + (st.step - 1);
              const isMastered = Boolean(assocTelem.completedStages && assocTelem.completedStages[stageKey]);
              const isUnlocked = st.step === 1 || isMastered || Boolean(assocTelem.completedStages && assocTelem.completedStages[prevKey]);
              const boostVal = Number((assocTelem.weightBoosts && assocTelem.weightBoosts[stageKey]) || 0);
              const dynamicPct = Math.min(99, (st.baseWeight || 88) + boostVal);
              const matchLabel = dynamicPct + '% Match' + (boostVal > 0 ? ' (+' + boostVal + '% Boost)' : '');
              return '<div class="compact-card" data-assoc-stage-card="' + esc(st.step) + '" style="padding:12px 14px;border-color:' + (isMastered ? 'rgba(16,185,129,0.58)' : (isUnlocked ? 'rgba(59,130,246,0.42)' : 'rgba(148,163,184,0.22)')) + ';background:rgba(4,8,20,0.78);display:flex;flex-direction:column;justify-content:space-between;gap:8px">' +
                '<div>' +
                  '<div class="row">' +
                    '<span class="chip ' + (isMastered ? 'ok' : (isUnlocked ? '' : 'warn')) + '" style="font-size:10px">' + (isMastered ? ('Step ' + st.step + ' · Mastered') : (isUnlocked ? ('Step ' + st.step + ' · Active') : ('Step ' + st.step + ' · Bridge Ready'))) + '</span>' +
                    '<small style="font-size:10.5px;color:' + (boostVal > 0 ? '#34d399' : '#93c5fd') + ';font-weight:700">' + esc(matchLabel) + '</small>' +
                  '</div>' +
                  '<h3 style="font-size:12.5px;margin-top:5px;color:#f8fafc">' + esc(st.domain) + '</h3>' +
                  '<p style="font-size:11.5px;color:#94a3b8;margin-top:2px">' + esc(st.rationale) + '</p>' +
                  (st.unlockedBridge ? '<div style="margin-top:6px;font-size:10.5px;color:' + (isMastered ? '#6ee7b7' : '#cbd5e1') + '"><strong>Unlocks:</strong> ' + esc(st.unlockedBridge) + '</div>' : '') +
                '</div>' +
                '<button type="button" class="btn ' + (isMastered ? '' : 'pri') + '" data-complete-assoc-stage="' + esc(st.step) + '" data-baseline-key="' + esc(activeBaselineKey) + '" style="width:100%;justify-content:center;padding:6px 10px;font-size:11px">' +
                  (isMastered ? '✓ SCORM / Quiz Mastery Verified (+Boost Active)' : ('Verify SCORM / Quiz: ' + esc(st.checkpointLabel || ('Complete Step ' + st.step)))) +
                '</button>' +
              '</div>';
            }).join('') +
          '</div>' +
        '</div>'
      : '';

    return divergentSummaryStrip +
      '<div class="card" style="padding:18px 20px;margin-top:0">' +
        '<div class="row" style="margin-bottom:14px">' +
          '<h2 style="margin:0;font-size:15px;font-weight:600">Authorized Applications &amp; LMS (' + unlockedApps.length + ')</h2>' +
          topRightActions +
        '</div>' +
        '<div class="bento-2">' + unlockedApps.map(renderAppCard).join('') + '</div>' +
      '</div>' +
      grantedPagesHtml;
  }

  function consultationPanel() {
    const myConsults = ((S() && S().consultations) || []).filter(c => isSoleAdmin() || c.uid === u.id);
    const activeTrackObj = CONSULTATION_TRACKS.find(t => t.id === selectedConsultTrack) || CONSULTATION_TRACKS[0];

    const confirmBanner = lastConsultationReceipt
      ? '<div class="card" id="consultationConfirmedBanner" style="padding:14px 18px;margin-bottom:12px;border-color:rgba(16,185,129,0.52);background:linear-gradient(135deg,rgba(6,78,59,0.34),rgba(9,16,32,0.96))">' +
          '<div class="row">' +
            '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
              '<span class="chip ok">Request Logged</span>' +
              '<strong style="font-size:13.5px;color:#fff">' + esc(lastConsultationReceipt.architectureScope) + '</strong>' +
              '<span style="font-size:12.5px;color:#a7f3d0">' + esc(lastConsultationReceipt.timeline) + ' · ' + esc(lastConsultationReceipt.preferredWindow) + '</span>' +
            '</div>' +
            '<code style="font-size:11.5px;color:#34d399">' + esc(lastConsultationReceipt.receiptId) + '</code>' +
          '</div>' +
        '</div>'
      : '';

    const consultErrBanner = lastConsultationError
      ? '<div class="card" id="consultationErrorBanner" style="padding:12px 16px;margin-bottom:12px;border-color:rgba(239,68,68,0.55);background:rgba(127,29,29,0.28);color:#fecaca;font-size:12.5px;font-weight:500">' + esc(lastConsultationError) + '</div>'
      : '';

    return confirmBanner + consultErrBanner +
      '<form id="guidedConsultationForm" onsubmit="return false;" style="display:flex;flex-direction:column;gap:14px">' +
        '<div class="card" style="padding:18px 20px">' +
          '<div class="row" style="margin-bottom:12px">' +
            '<div>' +
              '<span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#60a5fa">Step 1 · Solution Architecture</span>' +
              '<h2 style="margin:2px 0 0;font-size:15px;font-weight:600">Select Guided Consultation &amp; Request Track</h2>' +
            '</div>' +
            '<span class="chip ok">Enterprise Intake</span>' +
          '</div>' +
          '<div class="bento-2">' +
            CONSULTATION_TRACKS.map(t => {
              const sel = t.id === selectedConsultTrack;
              return '<div class="compact-card" data-consult-track="' + esc(t.id) + '" style="cursor:pointer;border-color:' + (sel ? '#c5b358' : 'var(--line)') + ';background:' + (sel ? 'rgba(30,58,138,0.26)' : 'var(--card)') + '">' +
                '<div class="row"><h3>' + esc(t.scope) + '</h3><span class="chip' + (sel ? ' ok' : '') + '">' + esc(t.badge) + '</span></div>' +
                '<p>' + esc(t.desc) + '</p>' +
              '</div>';
            }).join('') +
          '</div>' +
        '</div>' +

        '<div style="display:grid;grid-template-columns:1.25fr 0.75fr;gap:14px;align-items:start">' +
          '<div class="card" style="padding:18px 20px;margin:0">' +
            '<span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#60a5fa">Step 2 · Scope &amp; Technical Parameters</span>' +
            '<h3 style="margin:2px 0 12px;font-size:14.5px;font-weight:600">Deployment Requirements</h3>' +
            '<input type="hidden" id="consArchitectureScope" value="' + esc(activeTrackObj.scope) + '">' +
            '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:10px">' +
              '<div><label style="display:block;font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:4px">Target Timeline</label>' +
                '<select id="consTimeline" style="width:100%;padding:8px 10px;font-size:12.5px">' +
                  '<option value="Immediate (1-2 Weeks)">Immediate (1-2 Weeks)</option>' +
                  '<option value="Standard Sprint (2-4 Weeks)" selected>Standard Sprint (2-4 Weeks)</option>' +
                  '<option value="Quarterly Rollout (30-60 Days)">Quarterly Rollout (30-60 Days)</option>' +
                '</select>' +
              '</div>' +
              '<div><label style="display:block;font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:4px">Organization Scale</label>' +
                '<select id="consScaleTier" style="width:100%;padding:8px 10px;font-size:12.5px">' +
                  '<option value="Starter Team (1-10 Seats)">Starter Team (1-10 Seats)</option>' +
                  '<option value="Growth Organization (11-50 Seats)" selected>Growth Organization (11-50 Seats)</option>' +
                  '<option value="Enterprise / Agency (50+ Seats)">Enterprise / Agency (50+ Seats)</option>' +
                '</select>' +
              '</div>' +
              '<div><label style="display:block;font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:4px">Primary Environment</label>' +
                '<select id="consIntegrationEnv" style="width:100%;padding:8px 10px;font-size:12.5px">' +
                  '<option value="Google Cloud &amp; Workspace OIDC">Google Cloud &amp; Workspace OIDC</option>' +
                  '<option value="Microsoft Entra ID / Azure">Microsoft Entra ID / Azure</option>' +
                  '<option value="Hybrid On-Premises &amp; Cloud Run">Hybrid On-Premises &amp; Cloud Run</option>' +
                '</select>' +
              '</div>' +
            '</div>' +
            '<div style="margin-bottom:10px">' +
              '<label style="display:block;font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:4px">Project Objectives &amp; Custom Scope Details</label>' +
              '<textarea id="consProjectBrief" rows="3" maxlength="800" required placeholder="Describe your target deliverables, integration goals, or specific SaaS/LMS modules needed..." style="width:100%;padding:9px 12px;font-size:12.5px"></textarea>' +
            '</div>' +
          '</div>' +

          '<div class="card" style="padding:18px 20px;margin:0">' +
            '<span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#60a5fa">Step 3 · Guided Session</span>' +
            '<h3 style="margin:2px 0 12px;font-size:14.5px;font-weight:600">Consultation Schedule</h3>' +
            '<div style="margin-bottom:10px">' +
              '<label style="display:block;font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:4px">Organization / Agency</label>' +
              '<input id="consOrg" maxlength="160" value="' + esc(u.org || '') + '" placeholder="Organization name" style="width:100%;padding:8px 10px;font-size:12.5px">' +
            '</div>' +
            '<div style="margin-bottom:14px">' +
              '<label style="display:block;font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:4px">Preferred Consultation Window</label>' +
              '<select id="consPreferredWindow" style="width:100%;padding:8px 10px;font-size:12.5px">' +
                '<option value="Morning Architecture Review (09:00 - 12:00 EST)">Morning Architecture Review (09:00 - 12:00 EST)</option>' +
                '<option value="Afternoon Executive Briefing (13:00 - 16:00 EST)" selected>Afternoon Executive Briefing (13:00 - 16:00 EST)</option>' +
                '<option value="Priority Async Scope &amp; Proposal Dispatch">Priority Async Scope &amp; Proposal Dispatch</option>' +
              '</select>' +
            '</div>' +
            '<button type="submit" class="btn pri" id="btnSubmitConsultation" style="width:100%;justify-content:center;padding:10px 16px;font-size:13px">Submit Request &amp; Schedule Consultation</button>' +
          '</div>' +
        '</div>' +
      '</form>' +
      (myConsults.length
        ? '<div class="card" style="padding:16px 20px;margin-top:12px"><div class="row" style="margin-bottom:10px"><h3 style="margin:0;font-size:14px;font-weight:600">Submitted Requests &amp; Consultations (' + myConsults.length + ')</h3></div>' +
          '<table><thead><tr><th>Receipt</th><th>Solution Scope</th><th>Timeline</th><th>Consultation Window</th><th>Status</th></tr></thead><tbody>' +
          myConsults.map(c => '<tr><td><code>' + esc(c.receiptId) + '</code></td><td><b>' + esc(c.architectureScope) + '</b></td><td>' + esc(c.timeline) + '</td><td>' + esc(c.preferredWindow) + '</td><td><span class="chip ok">' + esc(c.status || 'submitted') + '</span></td></tr>').join('') +
          '</tbody></table></div>'
        : '');
  }

  function paymentPanel() {
    const prof = u.paymentProfile || (lastPaymentReceipt && lastPaymentReceipt.paymentProfile) || null;
    const receipts = Array.isArray(u.payments) ? u.payments : [];
    const latestReceipt = (lastPaymentReceipt && lastPaymentReceipt.receipt) || receipts[0] || null;

    const statusBanner = prof && prof.verified
      ? '<div class="card" id="paymentVerifiedBanner" style="padding:14px 18px;margin-bottom:12px;border-color:rgba(16,185,129,0.52);background:linear-gradient(135deg,rgba(6,78,59,0.34),rgba(9,16,32,0.96))">' +
          '<div class="row">' +
            '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
              '<span class="chip ok">Verified Method</span>' +
              '<strong style="font-size:13.5px;font-weight:600;color:#fff">' + esc(prof.instrumentBrand) + ' · ' + esc(prof.last4) + '</strong>' +
              '<span style="font-size:12.5px;color:#a7f3d0">' + esc(prof.planLabel) + '</span>' +
            '</div>' +
            (latestReceipt ? '<code style="font-size:11.5px;color:#34d399">' + esc(latestReceipt.receiptId) + '</code>' : '') +
          '</div>' +
        '</div>'
      : '';

    const errorBanner = lastPaymentError
      ? '<div class="card" id="paymentErrorBanner" style="padding:12px 16px;margin-bottom:12px;border-color:rgba(239,68,68,0.55);background:rgba(127,29,29,0.28);color:#fecaca;font-size:12.5px;font-weight:500">' + esc(lastPaymentError) + '</div>'
      : '';

    return statusBanner + errorBanner +
      '<form id="legalPaymentForm" onsubmit="return false;" style="display:grid;grid-template-columns:minmax(260px,315px) minmax(0,1fr);gap:14px;align-items:start">' +
        '<!-- LEFT COLUMN: Stripe/Linear Minimalist Plan & Entity Summary -->' +
        '<div class="card" style="padding:18px 20px;margin:0">' +

  function render() {
    u = W.me();
    if (!u) {
      app.innerHTML = '<div class="card lock"><span class="chip warn">Authentication Required</span><h1 style="margin-top:10px">Sign In Required</h1><p>Sign in with your account credentials or Federated SSO to access your workspace.</p><div style="margin-top:14px"><a class="btn pri" href="login.html">Sign In</a></div></div>';
      W.header('member-portal.html');
      return;
    }
    syncOnboardingStateFromUser();
    if (!isSoleAdmin() && !u.onboardingCompleted && sessionStorage.getItem('mgc_nf_prompted_' + u.id) !== '1') {
      showNetflixOnboarding = true;
      sessionStorage.setItem('mgc_nf_prompted_' + u.id, '1');
    }

    const availableTabs = getAvailableTabsForUser();
    if (!availableTabs.some(t => t[0] === tab)) {
      tab = availableTabs[0][0];
    }
    const activeTabEntry = availableTabs.find(t => t[0] === tab) || availableTabs[0];
    const body = activeTabEntry[2]();

    const grantedFeatureLinks = W.CATALOG.filter(c => c.id !== 'saasapps' && c.id !== 'home' && c.id !== 'resources' && (!isEmp() || c.id !== 'finance') && W.can(u, 'page', c.id, 'view'));

    const sideNav = '<aside class="ws-side" aria-label="Authorized User Navigation">' +
      '<div class="ws-side-title">Workspace</div>' +
      availableTabs.map(t => '<button type="button" class="ws-nav-btn' + (t[0] === tab ? ' active' : '') + '" data-tab="' + t[0] + '"><span>' + t[1] + '</span></button>').join('') +
      '<a class="ws-nav-btn" href="saas-apps-and-lms-showcase.html" style="text-decoration:none"><span>SaaS &amp; LMS Showcase</span></a>' +
      grantedFeatureLinks.map(c => '<a class="ws-nav-btn" href="' + esc(c.href) + '" style="text-decoration:none"><span>' + esc(c.title) + '</span></a>').join('') +
      (isSoleAdmin() ? '<a class="ws-nav-btn" href="access-admin.html" style="text-decoration:none;border-color:rgba(197,179,88,0.42);color:#fde047"><span>MGC Directory &amp; RBAC</span></a>' : '') +
      (isEmp() ? '<a class="ws-nav-btn" href="access-admin.html?tab=users&amp;ou=external" style="text-decoration:none;border-color:rgba(59,130,246,0.42);color:#93c5fd"><span>Client Directory</span></a>' : '') +
      '</aside>';

    app.innerHTML = '<div class="ws-layout">' + sideNav + '<div class="ws-main">' + body + '</div></div>' + netflixOnboardingModalHtml();
    W.header(tab === 'payment' ? 'member-portal.html?view=payment' : tab === 'consultation' ? 'member-portal.html?view=consultation' : tab === 'resources' ? 'member-portal.html?view=resources' : 'member-portal.html');
    bind();
  }

  function bind() {
    app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
      tab = b.dataset.tab;
      lastPaymentError = '';
      lastConsultationError = '';
      render();
    });
    const btnOpenNf = document.getElementById('btnOpenNetflixOnboarding');
    if (btnOpenNf) {
      btnOpenNf.onclick = () => {
        onboardingError = '';
        showNetflixOnboarding = true;
        render();
      };
    }
    app.querySelectorAll('[data-open-onboarding]').forEach(b => b.onclick = () => {
      onboardingError = '';
      showNetflixOnboarding = true;
      render();
    });
    const btnCloseNf = document.getElementById('btnCloseNetflixOnboarding');
    if (btnCloseNf) {
      btnCloseNf.onclick = () => {
        showNetflixOnboarding = false;
        render();
      };
    }
    const captureOttoFormFields = () => {
      const goalInput = document.getElementById('nfLearningGoalInput');
      if (goalInput) customLearningGoal = goalInput.value;
      const roleEl = document.getElementById('ottoRoleTitle');
      if (roleEl) ottoRoleTitle = roleEl.value;
      const indEl = document.getElementById('ottoIndustrySector');
      if (indEl) ottoIndustrySector = indEl.value;
      const sizeEl = document.getElementById('ottoOrgSize');
      if (sizeEl) ottoOrgSize = sizeEl.value;
      const resEl = document.getElementById('ottoResourceInterest');
      if (resEl) ottoResourceInterest = resEl.value;
      const tailorEl = document.getElementById('ottoConsentTailor');
      if (tailorEl) ottoConsentTailor = tailorEl.checked;
      const shareEl = document.getElementById('ottoConsentDataSharing');
      if (shareEl) ottoConsentDataSharing = shareEl.checked;
    };

    app.querySelectorAll('[data-nf-cat]').forEach(card => {
      const toggleCat = () => {
        const cid = card.dataset.nfCat;
        if (!cid) return;
        captureOttoFormFields();
        if (selectedCategories.includes(cid)) {
          selectedCategories = selectedCategories.filter(x => x !== cid);
        } else {
          selectedCategories.push(cid);
        }
        if (selectedCategories.length === 0) {
          ottoStep2Confirmed = false;
        }
        onboardingError = '';
        render();
      };
      card.onclick = toggleCat;
      card.onkeydown = (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleCat();
        }
      };
    });

    const nfBaselineSelect = document.getElementById('nfBaselineSelect');
    if (nfBaselineSelect) {
      nfBaselineSelect.onchange = () => {
        captureOttoFormFields();
        selectedDivergentBaseline = nfBaselineSelect.value;
        render();
      };
    }

    const btnConfirmOttoStep2 = document.getElementById('btnConfirmOttoStep2');
    if (btnConfirmOttoStep2) {
      btnConfirmOttoStep2.onclick = () => {
        captureOttoFormFields();
        if (W.hasInjectionPayload && W.hasInjectionPayload(customLearningGoal)) {
          onboardingError = 'Security Validation Failed: Input contains disallowed script, SQL, or template injection patterns.';
          render();
          return;
        }
        ottoStep2Confirmed = true;
        onboardingError = '';
        render();
      };
    }

    ['ottoRoleTitle', 'ottoIndustrySector', 'ottoOrgSize', 'ottoResourceInterest', 'ottoConsentTailor', 'ottoConsentDataSharing'].forEach(fid => {
      const el = document.getElementById(fid);
      if (el) {
        el.onchange = () => {
          captureOttoFormFields();
          onboardingError = '';
          render();
        };
      }
    });

    const btnSaveNf = document.getElementById('btnSaveNetflixOnboarding');
    if (btnSaveNf) {
      btnSaveNf.onclick = async () => {
        onboardingError = '';
        captureOttoFormFields();
        const rawGoal = (customLearningGoal || '').trim();
        if (W.hasInjectionPayload && (W.hasInjectionPayload(rawGoal) || W.hasInjectionPayload(ottoRoleTitle) || W.hasInjectionPayload(ottoIndustrySector))) {
          onboardingError = 'Security Validation Failed: Input contains disallowed script, SQL, or template injection patterns.';
          render();
          return;
        }
        if (!selectedCategories.length) {
          onboardingError = 'Please select at least 1 track in Step 1.';
          render();
          return;
        }
        if (!ottoStep2Confirmed) {
          onboardingError = 'Please confirm your Otto Path in Step 2 first.';
          render();
          return;
        }
        if (!ottoRoleTitle || !ottoIndustrySector || !ottoConsentTailor) {
          onboardingError = 'Please complete your Role, Sector, and required workspace consent in Step 3.';
          render();
          return;
        }
        const payload = {
          selectedCategories,
          divergentBaseline: selectedDivergentBaseline,
          learningGoal: W.sanitizeField ? W.sanitizeField(rawGoal, 240) : rawGoal,
          roleTitle: W.sanitizeField ? W.sanitizeField(ottoRoleTitle, 120) : ottoRoleTitle,
          industrySector: W.sanitizeField ? W.sanitizeField(ottoIndustrySector, 80) : ottoIndustrySector,
          orgSize: W.sanitizeField ? W.sanitizeField(ottoOrgSize, 60) : ottoOrgSize,
          resourceInterest: W.sanitizeField ? W.sanitizeField(ottoResourceInterest, 80) : ottoResourceInterest,
          consentWorkspaceTailoring: Boolean(ottoConsentTailor),
          dataSharingOptIn: Boolean(ottoConsentDataSharing)
        };
        try {
          const resp = await fetch('/api/onboarding/complete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await resp.json();
          if (!data || !data.ok) {
            onboardingError = (data && data.error) || 'Failed to save Otto preferences.';
            render();
            return;
          }
          if (u) {
            u.onboardingCompleted = true;
            u.selectedCategories = selectedCategories.slice();
            u.divergentBaseline = selectedDivergentBaseline;
            u.learningGoal = payload.learningGoal;
            u.ottoProfile = data.ottoProfile || payload;
          }
          if (W.completeNetflixOnboarding) W.completeNetflixOnboarding(payload);
          showNetflixOnboarding = false;
          W.toast('Otto Setup Complete');
          render();
        } catch (_) {
          const localRes = W.completeNetflixOnboarding ? W.completeNetflixOnboarding(payload) : { ok: true };
          if (!localRes.ok) {
            onboardingError = localRes.error || 'Validation failed.';
            render();
            return;
          }
          showNetflixOnboarding = false;
          W.toast('Otto Setup Complete');
          render();
        }
      };
    }
    app.querySelectorAll('[data-complete-assoc-stage]').forEach(btn => btn.onclick = async () => {
      const stepNum = Number(btn.dataset.completeAssocStage) || 1;
      const baselineKey = btn.dataset.baselineKey || selectedDivergentBaseline;
      const payload = { baselineKey, step: stepNum, source: 'scorm_quiz_checkpoint' };
      try {
        const resp = await fetch('/api/associative/mastery', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await resp.json();
        if (data && data.ok && data.telemetry && u) {
          u.associativeTelemetry = data.telemetry;
        }
      } catch (_) {}
      const localRes = W.recordAssociativeMastery ? W.recordAssociativeMastery(payload) : null;
      if (localRes && localRes.ok && u) {
        u.associativeTelemetry = localRes.telemetry;
      }
      render();
    });
    app.querySelectorAll('[data-select-scenario-branch]').forEach(card => card.onclick = async () => {
      const branchId = card.dataset.selectScenarioBranch;
      const tplId = card.dataset.templateId || selectedAiTemplateId;
      const branchStep = Number(card.dataset.branchStep) || 1;
      const branchLabel = card.dataset.branchLabel || 'Scenario Branch';
      const unlockedStage = card.dataset.branchUnlocked || 'Next Stage Unlocked';
      selectedScenarioBranches[tplId] = branchId;
      const payload = {
        baselineKey: (u && u.divergentBaseline) || selectedDivergentBaseline,
        step: branchStep,
        source: 'scenario_branch',
        templateId: tplId,
        branchId,
        branchLabel
      };
      try {
        const resp = await fetch('/api/associative/mastery', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await resp.json();
        if (data && data.ok && data.telemetry && u) {
          u.associativeTelemetry = data.telemetry;
        }
      } catch (_) {}
      if (W.recordAssociativeMastery) W.recordAssociativeMastery(payload);
      const templates = W.DEFINED_AI_TEMPLATES || [];
      const tpl = templates.find(t => t.id === tplId) || templates[0];
      const runId = 'RFT-SCN-' + Date.now().toString(36).toUpperCase().slice(-5);
      activeAiToolOutput = {
        runId,
        resourceId: 'resource-fast-track',
        resourceTitle: 'Option T2 Scenario Branch (' + (tpl ? tpl.domain : 'Guided') + ')',
        toolTitle: branchLabel + ' [' + selectedAiPacing + ']',
        summary: 'Scenario Branch Activated: "' + branchLabel + '" unlocked "' + unlockedStage + '" and updated Option A2 associative telemetry weights for ' + (u.name || u.email) + '.'
      };
      render();
    });
    app.querySelectorAll('[data-go-resources]').forEach(b => b.onclick = () => {
      tab = 'resources';
      render();
    });
    const rftTemplateSelect = document.getElementById('rftTemplateSelect');
    if (rftTemplateSelect) {
      rftTemplateSelect.onchange = () => {
        selectedAiTemplateId = rftTemplateSelect.value;
        render();
      };
    }
    const rftPacingSelect = document.getElementById('rftPacingSelect');
    if (rftPacingSelect) {
      rftPacingSelect.onchange = () => {
        selectedAiPacing = rftPacingSelect.value;
        render();
      };
    }
    const btnRunDefinedTemplate = document.getElementById('btnRunDefinedTemplate');
    if (btnRunDefinedTemplate) {
      btnRunDefinedTemplate.onclick = () => {
        const templates = W.DEFINED_AI_TEMPLATES || [];
        const tpl = templates.find(t => t.id === selectedAiTemplateId) || templates[0];
        const runId = 'RFT-TPL-' + Date.now().toString(36).toUpperCase().slice(-5);
        activeAiToolOutput = {
          runId,
          resourceId: 'resource-fast-track',
          resourceTitle: 'Resource Fast-Track (' + (tpl ? tpl.domain : 'Guided') + ')',
          toolTitle: (tpl ? tpl.title : 'Defined Template') + ' [' + selectedAiPacing + ']',
          summary: 'Defined Template Applied: ' + (tpl ? tpl.summary : '') + ' Active schedule: ' + selectedAiPacing + ' for ' + (u.name || u.email) + '.'
        };
        W.toast('Resource Fast-Track Template Active');
        render();
      };
    }
    app.querySelectorAll('[data-run-ai-tool]').forEach(btn => btn.onclick = () => {
      const resTitle = btn.dataset.resTitle || 'Qualified Resource';
      const toolTitle = btn.dataset.toolTitle || 'Resource Fast-Track Template';
      const runId = 'RFT-' + Date.now().toString(36).toUpperCase().slice(-5);
      activeAiToolOutput = {
        runId,
        resourceId: btn.dataset.resId,
        resourceTitle: resTitle,
        toolTitle,
        summary: 'Resource Fast-Track template execution completed for "' + resTitle + '" (' + toolTitle + '). Pre-defined curriculum milestones and action checkpoints are active for ' + (u.name || u.email) + '.'
      };
      W.toast('Resource Fast-Track active: ' + toolTitle);
      render();
    });
    app.querySelectorAll('[data-go-payment]').forEach(b => b.onclick = () => {
      if (isEmp()) return;
      tab = 'payment';
      lastPaymentError = '';
      render();
    });
    app.querySelectorAll('[data-go-consultation]').forEach(b => b.onclick = () => {
      tab = 'consultation';
      render();
    });
    app.querySelectorAll('[data-consult-track]').forEach(card => card.onclick = () => {
      selectedConsultTrack = card.dataset.consultTrack;
      render();
    });
    const consultForm = document.getElementById('guidedConsultationForm');
    if (consultForm) {
      consultForm.onsubmit = async (ev) => {
        ev.preventDefault();
        lastConsultationError = '';
        const payload = {
          track: selectedConsultTrack,
          architectureScope: (document.getElementById('consArchitectureScope') && document.getElementById('consArchitectureScope').value) || 'Turnkey Web & Autonomous AI Suite',
          timeline: document.getElementById('consTimeline').value,
          scaleTier: document.getElementById('consScaleTier').value,
          integrationEnv: document.getElementById('consIntegrationEnv').value,
          organization: document.getElementById('consOrg').value.trim(),
          preferredWindow: document.getElementById('consPreferredWindow').value,
          projectBrief: document.getElementById('consProjectBrief').value.trim()
        };
        if (W.hasInjectionPayload && W.hasInjectionPayload(payload)) {
          lastConsultationError = 'Security Validation Failed: Input contains disallowed script, SQL, or template injection patterns.';
          render();
          return;
        }
        try {
          const resp = await fetch('/api/consultation/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await resp.json();
          if (!data || !data.ok) {
            lastConsultationError = (data && data.error) || 'Consultation validation failed.';
            render();
            return;
          }
          if (data.consultation) {
            lastConsultationReceipt = data.consultation;
            W.toast('Consultation request submitted (' + data.consultation.receiptId + ')');
            render();
            return;
          }
        } catch (_) {}
        const res = W.submitConsultation ? W.submitConsultation(payload) : null;
        if (res && res.ok && res.consultation) {
          lastConsultationReceipt = res.consultation;
          W.toast('Consultation request submitted (' + res.consultation.receiptId + ')');
          render();
        }
      };
    }
    app.querySelectorAll('[data-chk]').forEach(c => c.onchange = () => {
      const k = 'mgcw.chk.' + u.id;
      const st = JSON.parse(localStorage.getItem(k) || '{}');
      st[c.dataset.chk] = c.checked;
      localStorage.setItem(k, JSON.stringify(st));
    });

    const payForm = document.getElementById('legalPaymentForm');
    if (payForm) {
      const payMethodEl = document.getElementById('payMethod');
      const payMerchantEl = document.getElementById('payMerchantEntity');
      const expWrapEl = document.getElementById('expFieldsWrap');
      const lblBrand = document.getElementById('lblPayBrand');
      const lblLast4 = document.getElementById('lblPayLast4');
      const last4Input = document.getElementById('payCardOrLast4');
      const zipInput = document.getElementById('payZip');
      const badgeToken = document.getElementById('valBadgeToken');
      const badgeZip = document.getElementById('valBadgeZip');

      function syncPaymentFieldFade() {
        const m = payMethodEl ? payMethodEl.value : 'card_tokenized';
        const isWawf = m === 'gpc_wawf';
        if (expWrapEl) {
          expWrapEl.style.opacity = isWawf ? '0.35' : '1';
        }
        if (lblBrand) lblBrand.textContent = isWawf ? 'WAWF DoDAAC / Contracting Office' : 'Card Network / Bank';
        if (lblLast4) lblLast4.textContent = isWawf ? 'Contract or CLIN Last 4 Digits' : 'Card or Account Last 4 Digits';
      }
      if (payMethodEl) payMethodEl.onchange = syncPaymentFieldFade;
      if (payMerchantEl) {
        payMerchantEl.onchange = () => {
          if (payMerchantEl.value === 'MGC' && payMethodEl && payMethodEl.value === 'gpc_wawf') {
            payMethodEl.value = 'card_tokenized';
          }
          syncPaymentFieldFade();
        };
      }
      if (last4Input) {
        last4Input.oninput = () => {
          const digits = last4Input.value.replace(/\D/g, '').slice(-4);
          if (last4Input.value !== digits) last4Input.value = digits;
          if (badgeToken) {
            badgeToken.textContent = digits.length === 4 ? '4-Digit Token Ready' : 'Enter 4 Digits';
            badgeToken.className = 'chip ' + (digits.length === 4 ? 'ok' : 'warn');
          }
        };
      }
      if (zipInput) {
        zipInput.oninput = () => {
          const ok = /^\d{5}(-\d{4})?$/.test(zipInput.value.trim());
          if (badgeZip) {
            badgeZip.textContent = ok ? 'Valid ZIP' : '5 digits required';
            badgeZip.style.color = ok ? '#34d399' : '#fbbf24';
          }
        };
      }
      syncPaymentFieldFade();

      payForm.onsubmit = async (ev) => {
        ev.preventDefault();
        lastPaymentError = '';
        const rawInstrument = document.getElementById('payCardOrLast4').value.replace(/\D/g, '');
        const last4 = rawInstrument.length >= 4 ? rawInstrument.slice(-4) : '';
        // Immediately scrub the input field to last4 so full PAN never lingers in DOM
        if (last4) document.getElementById('payCardOrLast4').value = last4;

        const merchantEntity = (document.getElementById('payMerchantEntity') && document.getElementById('payMerchantEntity').value) || 'FIX';
        const methodVal = document.getElementById('payMethod').value;
        const payload = {
          merchantEntity,
          gatewayOption: methodVal === 'gpc_wawf' ? 'wawf_piee_eft' : 'stripe_saq_a',
          planTier: document.getElementById('payPlanTier').value,
          method: methodVal,
          billingName: document.getElementById('payBillingName').value.trim(),
          billingEmail: document.getElementById('payBillingEmail').value.trim(),
          billingOrg: document.getElementById('payBillingOrg').value.trim(),
          addressLine1: document.getElementById('payAddress').value.trim(),
          city: document.getElementById('payCity').value.trim(),
          state: document.getElementById('payState').value.trim(),
          postalCode: document.getElementById('payZip').value.trim(),
          cardBrand: document.getElementById('payBrand').value.trim(),
          last4,
          expMonth: Number(document.getElementById('payExpMonth').value) || 12,
          expYear: Number(document.getElementById('payExpYear').value) || 2029,
          eftaNachaAccepted: document.getElementById('payEftaNacha').checked,
          pciTermsAccepted: document.getElementById('payPciTerms').checked,
          msaAccepted: document.getElementById('payMsaTerms').checked
        };

        try {
          const resp = await fetch('/api/payment/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await resp.json();
          if (!data || !data.ok) {
            lastPaymentError = (data && data.error) || 'Payment verification failed. Check all required fields and legal checkboxes.';
            render();
            return;
          }
          lastPaymentReceipt = data;
          if (u) {
            u.paymentProfile = data.paymentProfile;
            u.payments = [data.receipt].concat(u.payments || []);
          }
          W.toast('Payment verified — Receipt ' + data.receipt.receiptId);
          render();
        } catch (err) {
          lastPaymentError = 'Network error while verifying payment.';
          render();
        }
      };
    }
  }
  render();
})();
</script>
