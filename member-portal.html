<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Workspace | MGC / F.I.X</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body>
<main class="wrap" id="app"></main>
<script src="mgc-workspace-core.js"></script>
<script>
(function () {
  const W = MGCW, S = () => W.S, esc = W.esc;
  const app = document.getElementById('app');
  const u = W.me();
  let tab = (location.hash || '#pages').slice(1);
  let open = null; // page being previewed

  function stepper(status) {
    const labels = ['1 · Request received', '2 · Approved · pages being built', '3 · Active · sign in'];
    const idx = Math.max(0, W.STEPS.indexOf(status));
    return '<div class="steps">' + labels.map((l, i) => '<div class="step ' + (i < idx ? 'done' : i === idx ? 'on' : '') + '">' + l + '</div>').join('') + '</div>';
  }

  function banner() {
    if (u.status === 'denied') return '<div class="card"><h2>Request not approved</h2><p>Contact us if you think this is a mistake.</p></div>';
    if (u.role === 'owner') return '';
    if (u.status !== 'active') {
      const msg = u.status === 'requested' ? 'We are reviewing your request. You will be notified the moment it is approved.' : 'Approved! We are building your pages now. You will be notified when they are ready — nothing else is needed from you.';
      return '<div class="card"><div class="row"><h2>' + esc(W.STATUS_LABEL[u.status]) + '</h2><span class="chip warn">Hello, ' + esc(u.name.split(' ')[0]) + '</span></div>' + stepper(u.status) + '<p>' + msg + '</p></div>';
    }
    if (!u.plan.base) return '<div class="card"><div class="row"><div><h2>Your pages are ready 🎉</h2><p>Activate your workspace for <b>$5 / month</b>. Add individual pages later (pay per page).</p></div><button class="btn pri" id="subBase">Activate · $5/mo</button></div></div>';
    return '';
  }

  const gated = () => u.role !== 'owner' && !W.subActive(u);

  function appsPanelHtml() {
    const apps = W.APPS_CATALOG || [];
    if (!apps.length) return '';
    const unlockedApps = apps.filter(a => W.can(u, 'app', a.id, 'view'));
    const lockedApps = apps.filter(a => !W.can(u, 'app', a.id, 'view'));

    const renderAppCard = (a) => {
      const allowed = W.can(u, 'app', a.id, 'view');
      const badge = allowed
        ? '<span class="chip ok">' + (u.role === 'owner' ? '👑 Owner' : a.defaultCustomer ? '✅ Default Unlocked' : '✅ Granted') + '</span>'
        : '<span class="chip warn">🔒 Restricted</span>';
      const act = allowed
        ? '<a class="btn pri" href="' + esc(a.href) + '">Launch App →</a>'
        : '<button class="btn" data-req-app="' + esc(a.id) + '">Request Owner Unlock →</button> <a class="btn" href="saas-apps-and-lms-showcase.html">Preview →</a>';
      return '<div class="compact-card" style="border-color:' + (allowed ? 'rgba(16,185,129,0.42)' : 'rgba(148,163,184,0.2)') + '">' +
        '<div><div class="row"><h3>' + a.icon + ' ' + esc(a.title) + '</h3>' + badge + '</div>' +
        '<p>' + (allowed ? 'Ready in your workspace session.' : 'Restricted on customer login. Request Owner unlock or upgrade.') + '</p></div>' +
        '<div class="row" style="justify-content:flex-start;gap:8px">' + act + '</div></div>';
    };

    return '<div class="card" style="padding:18px 20px">' +
      '<div class="row" style="margin-bottom:12px"><div><h2 style="margin:0">🚀 Unlocked Applications (' + unlockedApps.length + '/' + apps.length + ')</h2><p style="margin:2px 0 0">Launch your provisioned customer deliverables and interactive workspaces.</p></div>' +
      '<span class="chip ' + (u.role === 'owner' ? 'ok' : 'warn') + '">' + (u.role === 'owner' ? 'OWNER_FULL' : 'CUSTOMER_RESTRICTED') + '</span></div>' +
      '<div class="bento-2">' + unlockedApps.map(renderAppCard).join('') + '</div>' +
      (lockedApps.length ? '<details style="margin-top:14px"><summary>🔒 Restricted Enterprise SCORM Apps (' + lockedApps.length + ' available via Owner Unlock)</summary><div class="bento-2" style="margin-top:12px">' + lockedApps.map(renderAppCard).join('') + '</div></details>' : '') +
      '</div>';
  }

  function pagesPanel() {
    const readyCards = [];
    const addonCards = [];
    W.CATALOG.forEach(c => {
      const st = u.pages[c.id];
      const includedByQuote = ((W.TAILOR[u.quote.interest] || { pages: [] }).pages).includes(c.id);
      const mine = u.role === 'owner' || c.base || includedByQuote || (u.plan.addons || []).includes(c.id);
      const ok = W.can(u, 'page', c.id, 'view');
      let badge, action;
      if (st === 'pending') { badge = '<span class="chip warn">Pending Build</span>'; action = ''; }
      else if (ok) { badge = '<span class="chip ok">Ready</span>'; action = '<button class="btn pri" data-open="' + c.id + '">Open →</button>'; }
      else if (!mine && u.role !== 'owner') { badge = '<span class="chip">Add-on</span>'; action = '<button class="btn" data-addon="' + c.id + '"' + (u.plan.base ? '' : ' disabled title="Activate base plan first"') + '>Add Module</button>'; }
      else { badge = '<span class="chip">' + (gated() ? 'Locked' : 'Owner Approval') + '</span>'; action = ''; }
      const html = '<div class="compact-card"><div><div class="row"><h3>' + c.icon + ' ' + esc(c.title) + '</h3>' + badge + '</div><p>' + esc(c.desc) + '</p></div>' + (action ? '<div>' + action + '</div>' : '') + '</div>';
      if (ok || st === 'pending') readyCards.push(html);
      else addonCards.push(html);
    });
    return appsPanelHtml() +
      (open ? preview(open) : '') +
      '<div class="card" style="padding:18px 20px"><div class="row" style="margin-bottom:12px"><div><h2 style="margin:0">📂 Workspace Modules (' + readyCards.length + ' Ready)</h2><p style="margin:2px 0 0">Core workspace pages and tailored hubs provisioned for your account.</p></div></div>' +
      '<div class="bento-2">' + readyCards.join('') + '</div>' +
      (addonCards.length ? '<details style="margin-top:14px"><summary>➕ Available Add-On Modules (' + addonCards.length + ')</summary><div class="bento-2" style="margin-top:12px">' + addonCards.join('') + '</div></details>' : '') +
      '</div>';
  }

  function preview(id) {
    const c = W.CATALOG.find(x => x.id === id); const t = W.TAILOR[u.quote.interest] || W.TAILOR.federal;
    const launchBtn = c && c.href ? '<div style="margin-top:10px"><a class="btn pri" href="' + esc(c.href) + '">Launch ' + esc(c.title) + ' →</a></div>' : '';
    const body = id === 'home' ? '<p>Welcome back. Your next 3 action items:</p><ul>' + t.actions.slice(0, 3).map(a => '<li>' + esc(a) + '</li>').join('') + '</ul>'
      : id === 'agile' ? '<p>Your shared projects live here.</p><a class="btn pri" href="agile-board.html">Open board →</a>'
      : '<p>' + esc(c.desc) + '</p><p>This page is generated from your quote (<b>' + esc(t.label) + '</b>) and refined by us on request.</p>' + launchBtn;
    return '<div class="card" style="margin-top:12px"><div class="row"><h2>' + c.icon + ' ' + esc(c.title) + ' — preview</h2><button class="btn" id="closePrev">Close</button></div>' + body + '</div>';
  }

  function actionsPanel() {
    const t = W.TAILOR[u.quote.interest] || W.TAILOR.federal; const k = 'mgcw.chk.' + u.id;
    const st = JSON.parse(localStorage.getItem(k) || '{}');
    return '<div class="card"><h2>Action items — ' + esc(t.label) + '</h2>' + t.actions.map((a, i) => '<label class="row" style="justify-content:flex-start;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer"><input type="checkbox" data-chk="' + i + '"' + (st[i] ? ' checked' : '') + '> <span>' + esc(a) + '</span></label>').join('') + '</div>';
  }
  function resourcesPanel() {
    const t = W.TAILOR[u.quote.interest] || W.TAILOR.federal;
    return '<div class="card"><h2>Curated resources</h2>' + t.resources.map(r => '<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>' + esc(r[0]) + '</span><a class="btn" target="_blank" rel="noopener" href="' + esc(r[1]) + '">Open ↗</a></div>').join('') + '</div>';
  }
  function workflowsPanel() {
    const t = W.TAILOR[u.quote.interest] || W.TAILOR.federal;
    return '<div class="card"><h2>Real-life workflows</h2>' + t.workflows.map(w => '<details open><summary>' + esc(w.split('→')[0].trim()) + '</summary><p>' + esc(w) + '</p></details>').join('') + '</div>';
  }
  function featuresPanel() {
    const list = S().features.filter(f => u.role === 'owner' || f.by === u.id);
    return '<div class="card"><h2>Request a feature or page</h2><div class="row" style="justify-content:flex-start"><input id="ftitle" maxlength="120" placeholder="Title" style="flex:1;min-width:200px"><button class="btn pri" id="fadd"' + (gated() ? ' disabled' : '') + '>Submit</button></div><textarea id="fbody" maxlength="2000" rows="2" placeholder="What would you like? (optional)" style="width:100%;margin-top:8px"></textarea></div>' +
      '<div class="card" style="margin-top:10px"><h2>Your requests</h2>' + (list.length ? list.map(f => '<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>' + esc(f.title) + '</span><span class="chip">' + esc(f.status) + '</span></div>').join('') : '<p>None yet.</p>') + '</div>';
  }
  function billingPanel() {
    const addons = W.CATALOG.filter(c => !c.base);
    return '<div class="card"><h2>Billing</h2><div class="row"><span>Base workspace · $5/mo</span><span class="chip ' + (u.plan.base ? 'ok' : 'warn') + '">' + (u.role === 'owner' ? 'Owner · free' : u.plan.base ? 'Active' : 'Not active') + '</span></div>' +
      '<details><summary>Per-page add-ons</summary>' + addons.map(c => '<div class="row" style="padding:6px 0"><span>' + c.icon + ' ' + esc(c.title) + ' · $' + c.price + '/mo</span><span class="chip ' + ((u.plan.addons || []).includes(c.id) ? 'ok' : '') + '">' + ((u.plan.addons || []).includes(c.id) ? 'Subscribed' : 'Available') + '</span></div>').join('') + '</details>' +
      '<p>Prototype: no real charge. Production uses Stripe Checkout; a webhook sets your <code>sub</code> claim.</p></div>';
  }
  function inboxPanel() {
    const list = S().notifications.filter(n => n.toUid === u.id);
    list.forEach(n => n.read = true); W.commit();
    return '<div class="card" id="inbox"><h2>Notifications</h2>' + (list.length ? list.map(n => '<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="row"><b style="font-size:13px">' + esc(n.title) + '</b><span class="chip">' + esc(n.channel) + '</span></div><p>' + esc(n.body) + '</p></div>').join('') : '<p>Nothing yet.</p>') + '</div>';
  }

  const TABS = [
    ['pages', '🚀 Active Apps & Modules', pagesPanel],
    ['actions', '✅ Action Checklist', actionsPanel],
    ['resources', '📚 Curated Resources', resourcesPanel],
    ['workflows', '⚡ Guided Workflows', workflowsPanel],
    ['features', '💡 Feature Requests', featuresPanel],
    ['billing', '💳 Plan & Add-Ons', billingPanel],
    ['inbox', '🔔 Notifications', inboxPanel]
  ];
  const needsActive = ['actions', 'resources', 'workflows'];

  function render() {
    if (!u) { app.innerHTML = '<div class="card lock"><span class="chip warn">🔒 Federated SSO Enforced</span><h1 style="margin-top:10px">Single Sign-On Required</h1><p>Authenticate with <b>Google</b>, <b>Microsoft</b>, or <b>Apple</b> SSO to open your workspace.</p><div style="margin-top:14px"><a class="btn pri" href="login.html?next=/member-portal.html">Sign In with SSO →</a></div></div>'; W.header('member-portal.html'); return; }
    let body;
    if (u.status === 'denied') body = '';
    else if (needsActive.includes(tab) && u.role !== 'owner' && !W.subActive(u)) body = '<div class="card lock"><h2>🔒 Locked until your workspace is active</h2><p>Complete the steps above to unlock this section.</p></div>';
    else body = (TABS.find(t => t[0] === tab) || TABS[0])[2]();

    const apps = W.APPS_CATALOG || [];
    const unlockedCount = apps.filter(a => W.can(u, 'app', a.id, 'view')).length;
    const kpiHtml = '<div class="kpi-strip">' +
      '<div class="kpi-tile"><small>Access Tier</small><strong>' + (u.role === 'owner' ? 'Owner Full' : 'Customer Tier') + '</strong></div>' +
      '<div class="kpi-tile"><small>Unlocked Apps</small><strong>' + unlockedCount + ' / ' + apps.length + ' Ready</strong></div>' +
      '<div class="kpi-tile"><small>Workspace Track</small><strong>' + esc(((W.TAILOR[u.quote.interest] || {}).label || 'Custom Scope')) + '</strong></div>' +
      '</div>';

    const sideNav = '<aside class="ws-side" aria-label="Workspace Navigation">' +
      '<div class="ws-side-title">Workspace Views</div>' +
      TABS.map(t => '<button type="button" class="ws-nav-btn' + (t[0] === tab ? ' active' : '') + '" data-tab="' + t[0] + '"><span>' + t[1] + '</span></button>').join('') +
      '</aside>';

    app.innerHTML = '<div style="margin-bottom:14px"><div class="row"><div><h1 style="margin:0">Welcome, ' + esc(u.name.split(' (')[0]) + '</h1><p style="margin:2px 0 0">' + (u.brand === 'FIX' ? 'F.I.X Solutions' : 'Milton Group Concepts') + ' · <b>' + (u.role === 'owner' ? 'Owner Full Access' : 'Default Restricted Customer Access') + '</b></p></div></div></div>' +
      banner() +
      '<div class="ws-layout">' + sideNav + '<div class="ws-main">' + kpiHtml + body + '</div></div>';
    W.header('member-portal.html');
    bind();
  }

  function bind() {
    app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; open = null; render(); });
    app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { if (W.can(u, 'page', b.dataset.open, 'view')) { open = b.dataset.open; render(); } });
    app.querySelectorAll('[data-req-app]').forEach(b => b.onclick = () => { if (W.requestAppAccess) W.requestAppAccess(b.dataset.reqApp); W.toast('Unlock request sent to Owner — you will be notified when granted'); b.textContent = '✓ Request Sent to Owner'; b.disabled = true; });
    const cp = document.getElementById('closePrev'); if (cp) cp.onclick = () => { open = null; render(); };
    const sb = document.getElementById('subBase'); if (sb) sb.onclick = () => { W.subscribeBase(u.id); W.toast('Workspace activated'); render(); };
    app.querySelectorAll('[data-addon]').forEach(b => b.onclick = () => { W.toggleAddon(u.id, b.dataset.addon); W.toast('Page requested — we will build it and notify you'); render(); });
    app.querySelectorAll('[data-chk]').forEach(c => c.onchange = () => { const k = 'mgcw.chk.' + u.id; const st = JSON.parse(localStorage.getItem(k) || '{}'); st[c.dataset.chk] = c.checked; localStorage.setItem(k, JSON.stringify(st)); });
    const fa = document.getElementById('fadd'); if (fa) fa.onclick = () => { const t = document.getElementById('ftitle').value.trim(); if (!t) return; const b = document.getElementById('fbody').value; if (!W.postServerAction || !W.postServerAction({ action: 'createFeature', title: t, body: b })) { S().features.unshift({ id: W.uid('f'), by: u.id, title: t, body: b, votes: [u.id], status: 'new', created: W.now() }); W.notify('owner', 'Feature request', u.name + ': ' + t); W.log(u.id, 'feature.create', t); W.commit(); } W.toast('Request sent'); render(); };
  }
  render();
})();
</script>

<!-- SCORM 2004 4TH EDITION + DUAL CITYSCAPE (F.I.X. & MILTONGROUPSECURITY.ORG) LAYER -->
<style id="mgc-fix-scorm-cityscape-style">
  body { position: relative; isolation: isolate; }
  body > *:not(#mgc-fix-bg-image):not(#mgc-fix-skyscraper-overlay):not(#mgc-scorm-floating-dock):not(#dual-cityscape-bg):not(#dual-cityscape-overlay):not(#mgc-skyscraper-layer):not(.thematic-city-backdrop):not(script):not(style):not(link) {
    position: relative;
    z-index: 5;
  }
  header, nav, main, section, .container, .wrap, .main-grid, .portal-grid, .stepper, .hero, .hero-banner, .top-nav, .topbar {
    position: relative;
    z-index: 5;
  }
  header, .hero, .hero-banner, .top-nav, .topbar {
    background-color: rgba(7, 12, 24, 0.96) !important;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }
  .card, .panel, .portal-item, .step, .stat-card, .hub-card, .glass-card, .module-card, .section-card, .eveng-console-pane, .theory-box, .kpi-card, .box, .tile, .feature-card, .metric-card, .control-card, .workflow-card, .product-card, .radar-card {
    background-color: rgba(9, 16, 32, 0.96) !important;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-color: rgba(148, 163, 184, 0.34) !important;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    position: relative;
    z-index: 5;
  }
  #mgc-fix-bg-image {
    position: fixed;
    inset: -5%;
    z-index: -10 !important;
    pointer-events: none;
    background-image: url('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&q=80&w=2500');
    background-size: 118% 118%;
    background-position: 50% 50%;
    opacity: 0.20;
    mix-blend-mode: normal !important;
    filter: grayscale(30%) contrast(118%) brightness(50%) sepia(24%) hue-rotate(185deg);
    transition: filter 0.8s ease, background-position 1s ease, opacity 0.5s ease;
  }
  #mgc-fix-skyscraper-overlay {
    position: fixed;
    inset: 0;
    z-index: -9 !important;
    pointer-events: none;
    opacity: 0.75;
    mix-blend-mode: normal !important;
    transition: opacity 0.6s ease;
  }
  @keyframes waveFlagInjected {
    0%, 100% { transform: skewY(0deg) scaleX(1); }
    35% { transform: skewY(3.5deg) scaleX(0.93); }
    70% { transform: skewY(-2.5deg) scaleX(0.97); }
  }
  #mgc-scorm-floating-dock {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    background: rgba(11, 20, 38, 0.94);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(197, 179, 88, 0.48);
    border-radius: 999px;
    padding: 7px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 11.5px;
    color: #f8fafc;
    max-width: 96vw;
  }
  #mgc-scorm-floating-dock a, #mgc-scorm-floating-dock button, #mgc-scorm-floating-dock select {
    font-size: 11px;
    font-weight: 700;
    border-radius: 999px;
    padding: 4px 10px;
    cursor: pointer;
    text-decoration: none;
  }
</style>
<div id="mgc-fix-bg-image" aria-hidden="true"></div>
<div id="mgc-fix-skyscraper-overlay" aria-hidden="true">
  <div style="position:absolute;top:0;left:0;width:100%;height:65vh;background:linear-gradient(180deg,rgba(249,115,22,0.18),rgba(197,179,88,0.10),transparent);"></div>
  <div style="position:absolute;bottom:0;right:4%;width:180px;height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;opacity:0.55;">
    <div style="position:relative;width:3px;height:74px;background:#cbd5e1;margin-bottom:-4px;">
      <div style="position:absolute;top:3px;left:3px;width:74px;height:44px;transform-origin:left center;animation:waveFlagInjected 2.6s infinite ease-in-out;">
        <svg viewBox="0 0 60 40" style="width:100%;height:100%;border-radius:2px;">
          <rect width="60" height="40" fill="#fff"/>
          <rect width="60" height="3.07" y="0" fill="#b22234"/><rect width="60" height="3.07" y="6.15" fill="#b22234"/><rect width="60" height="3.07" y="12.3" fill="#b22234"/><rect width="60" height="3.07" y="18.46" fill="#b22234"/><rect width="60" height="3.07" y="24.61" fill="#b22234"/><rect width="60" height="3.07" y="30.76" fill="#b22234"/><rect width="60" height="3.07" y="36.92" fill="#b22234"/>
          <rect width="24" height="21.5" fill="#3c3b6e"/>
        </svg>
      </div>
    </div>
    <div style="width:45px;height:60px;background:rgba(11,20,38,0.9);border-top:1px solid rgba(197,179,88,0.4);"></div>
    <div style="width:110px;height:100px;background:rgba(11,20,38,0.92);border-top:1px solid rgba(197,179,88,0.4);"></div>
    <div style="width:180px;flex:1;background:rgba(11,20,38,0.95);border-top:1px solid rgba(197,179,88,0.5);"></div>
  </div>
</div>

<script src="projects/spanish-acquisition-os/src/modules/scorm_adapter.js"></script>
<script>
  window.switchInjectedCityscape = function(mode) {
    var bg = document.getElementById('mgc-fix-bg-image');
    var sky = document.getElementById('mgc-fix-skyscraper-overlay');
    if (!bg || !sky) return;
    if (mode === 'mgc-cityscape') {
      sky.style.opacity = '1';
      bg.style.filter = 'contrast(122%) brightness(65%) saturate(130%)';
    } else if (mode === 'noir-greyscale') {
      sky.style.opacity = '0';
      bg.style.filter = 'grayscale(100%) contrast(138%) brightness(52%)';
    } else if (mode === 'emerald-matrix') {
      sky.style.opacity = '1';
      bg.style.filter = 'grayscale(55%) sepia(40%) hue-rotate(115deg) saturate(190%) contrast(122%) brightness(54%)';
    } else {
      sky.style.opacity = '0';
      bg.style.filter = 'grayscale(30%) contrast(118%) brightness(58%) sepia(24%) hue-rotate(185deg)';
    }
    bg.style.backgroundPosition = (30 + Math.floor(Math.random() * 45)) + '% ' + (30 + Math.floor(Math.random() * 45)) + '%';
  };
  window.commitInjectedScorm = function() {
    if (typeof SAOS_SCORM !== 'undefined') {
      SAOS_SCORM.set('cmi.completion_status', 'completed');
      SAOS_SCORM.set('cmi.success_status', 'passed');
      SAOS_SCORM.commit();
    }
    alert('✓ SCORM 2004 4th Edition Completion committed (MGC_MEMBER_PORTAL_SCO)!');
  };
</script>

</body>
</html>
